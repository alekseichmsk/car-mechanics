};

const input = { throttle: 0, brake: 0, steer: 0, handbrake: 0 };
const impacts = [];
let scripted = null;
const keys = new Set();
const touch = { throttle: 0, brake: 0, steerL: 0, steerR: 0, handbrake: 0 };
const steerUi = { angle: 0, dragging: false, last: 0 };

function staticCompression() {
  const fz = (CONFIG.chassis.mass * CONFIG.physics.gravity) / CONFIG.wheels.length;
  return clamp(fz / CONFIG.suspension.stiffness, 0, CONFIG.suspension.maxCompression * 0.8);
}

function rideHeight() {
  const w = CONFIG.wheels[0];
  const length = CONFIG.suspension.restLength - staticCompression();
  return length + w.radius - w.y;
}

function localToWorld(p) {
  return add(state.position, rotateVec(state.quat, p));
}
function worldToLocal(p) {
  return rotateVec({ x: -state.quat.x, y: -state.quat.y, z: -state.quat.z, w: state.quat.w }, sub(p, state.position));
}
function velocityAt(point) {
  return add(state.velocity, cross(state.omega, sub(point, state.position)));
}
function applyForce(point, f) {
  state.force.x += f.x;
  state.force.y += f.y;
  state.force.z += f.z;
  const t = cross(sub(point, state.position), f);
  state.torque.x += t.x;
  state.torque.y += t.y;
  state.torque.z += t.z;
}

function wheelbase() {
  const f = CONFIG.wheels.find((w) => w.axle === "front");
  const r = CONFIG.wheels.find((w) => w.axle === "rear");
  return f.z - r.z;
}
function trackWidth() {
  const l = CONFIG.wheels.find((w) => w.id === "FL");
  const r = CONFIG.wheels.find((w) => w.id === "FR");
  return r.x - l.x;
}

function reset(opts = {}) {
  const z = opts.z ?? CONFIG.spawn.z;
  const x = opts.x ?? CONFIG.spawn.x;
  ensureRoad(z);
  const y = rideHeight() + groundHeight(x, z);
  state.position = {
    x,
    y: (opts.y ?? y) + (opts.drop ?? 0),
    z,
  };
  const yaw = opts.yaw ?? 0;
  state.quat = quatFromAxisAngle({ x: 0, y: 1, z: 0 }, yaw);
  const fwd = rotateVec(state.quat, { x: 0, y: 0, z: 1 });
  const speed = opts.speed ?? 0;
  state.velocity = { x: fwd.x * speed, y: 0, z: fwd.z * speed };
  state.omega = { x: 0, y: 0, z: 0 };
  state.force = { x: 0, y: 0, z: 0 };
  state.torque = { x: 0, y: 0, z: 0 };
  state.gear = 1;
  state.shiftTimer = 0;
  state.shiftCooldown = 0;
  state.reverseHold = 0;
  state.engineOmega = (CONFIG.engine.idleRpm * TAU) / 60;
  state.steer = 0;
  state.cruise = false;
  state.coolant = 0.34;
  steerUi.angle = 0;
  steerUi.dragging = false;
  state.time = 0;
  state.tick = 0;
  state.blewUp = false;
  state.minUp = 1;
  const comp = staticCompression();
  for (const w of wheels) {
    w.omega = speed / w.spec.radius;
    w.spinAngle = 0;
    w.suspensionLength = CONFIG.suspension.restLength - comp;
    w.compression = comp;
    w.fx = 0;
    w.fy = 0;
    w.fz = 0;
    w.slipRatio = 0;
    w.slipAngle = 0;
    w.driveTorque = 0;
    w.skidAcc = 0;
    w.rutAcc = 0;
    w.sinkDepth = 0;
    w.tireSquash = 0;
    w.latFlex = 0;
    w.inContact = true;
    w.surface = surfaceAt(state.position.x, state.position.z);
    w.steerAngle = 0;
  }
  clearEffects();
  snapCamera();
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------

function readInput() {
  if (scripted) {
    input.throttle = scripted.throttle || 0;
    input.brake = scripted.brake || 0;
    input.steer = scripted.steer || 0;
    input.handbrake = scripted.handbrake || 0;
    return;
  }
  const keyT = keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0;
  const keyB = keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0;
  const keyL = keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0;
  const keyR = keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0;
  const keyH = keys.has("Space") ? 1 : 0;
  input.throttle = Math.max(keyT, touch.throttle);
  input.brake = Math.max(keyB, touch.brake);
  input.handbrake = Math.max(keyH, touch.handbrake);
  const buttons = touch.steerR - touch.steerL;
  if (steerUi.dragging) input.steer = clamp(steerUi.angle / CONFIG.steer.wheelLock, -1, 1);
  else input.steer = clamp((keyR - keyL) + buttons, -1, 1);
  if (state.cruise && state.engineOn) {
    if (input.brake > 0.08 || input.throttle > 0.08) state.cruise = false;
    else if (state.gear > 0) {
      const speed = Math.hypot(state.velocity.x, state.velocity.z);
      input.throttle = clamp((state.cruiseSpeed - speed) * 0.15, 0, 0.85);
    }
  }
}

// In reverse the brake pedal is the throttle and the gas pedal slows you.
function pedals() {
  if (state.gear < 0) return { throttle: input.brake, brake: input.throttle };
  if (input.brake > 0.05) return { throttle: 0, brake: input.brake };
  return { throttle: input.throttle, brake: 0 };
}

function updateSteer(dt) {
  if (!steerUi.dragging && !scripted) {
    const target = input.steer * CONFIG.steer.wheelLock;
    const maxStep = 3.2 * dt;
    steerUi.angle += clamp(target - steerUi.angle, -maxStep, maxStep);
  }
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  const fade = lerp(1, CONFIG.steer.speedFade, clamp(speed / CONFIG.steer.fadeSpeed, 0, 1));
  // input.steer > 0 is a right turn: clockwise wheel, D / ArrowRight, right button.
  // The chase camera looks along body +Z. In that view body -X is screen-right,
  // so the yaw that turns the car right is the opposite of input.steer.
  const command = -input.steer;
  const target = command * CONFIG.steer.maxAngle * fade;
  const rate = input.steer === 0 ? CONFIG.steer.returnRate : CONFIG.steer.rate;
  const maxStep = rate * dt;
  state.steer += clamp(target - state.steer, -maxStep, maxStep);
  const L = wheelbase();
  const T = trackWidth();
  for (const w of wheels) {
    if (!w.spec.steer || Math.abs(state.steer) < 1e-5) {
      w.steerAngle = w.spec.steer ? state.steer : 0;
      continue;
    }
    const R = L / Math.tan(state.steer);
    const side = Math.sign(w.spec.x) || 1;
    const Rw = R - side * (T * 0.5);
    w.steerAngle = Math.abs(Rw) < 0.35 ? state.steer : Math.atan(L / Rw);
  }
}

function updateReverse(dt) {
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  if (state.gear > 0 && input.brake > 0.65 && input.throttle < 0.05 && speed < 0.7) {
    state.reverseHold += dt;
    if (state.reverseHold > 0.22) {
      state.gear = -1;
      state.shiftTimer = 0.12;
      state.reverseHold = 0;
    }
  } else {
    state.reverseHold = 0;
  }
  if (state.gear < 0 && input.throttle > 0.2) {
    state.gear = 1;
    state.shiftTimer = 0.12;
  }
}

// ---------------------------------------------------------------------------
// Physics step
// ---------------------------------------------------------------------------

function castSuspension() {
  const down = normalize(rotateVec(state.quat, { x: 0, y: -1, z: 0 }));
  const rayLen = CONFIG.suspension.restLength + CONFIG.wheels[0].radius + 0.48;
  for (const w of wheels) {
    const origin = localToWorld({ x: w.spec.x, y: w.spec.y, z: w.spec.z });
    const hit = raycast(origin, down, rayLen);
    w.water = 0;
    w.centerWorld = localToWorld({
      x: w.spec.x,
      y: w.spec.y - w.suspensionLength,
      z: w.spec.z,
    });
    if (!hit) {
      w.inContact = false;
      w.suspensionLength = CONFIG.suspension.restLength;
      w.compression = 0;
      w.tireSquash = 0;
      w.fz = 0;
      w.surface = surfaceAt(origin.x, origin.z);
      w.normal = { x: 0, y: 1, z: 0 };
      w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });
      continue;
    }
    const radius = w.spec.radius;
    const kS = CONFIG.suspension.stiffness;
    const kT = CONFIG.tire.verticalStiffness;
    const defl = CONFIG.suspension.restLength + radius - hit.distance;
    if (defl <= 1e-4) {
      w.inContact = false;
      w.suspensionLength = CONFIG.suspension.restLength;
      w.compression = 0;
      w.tireSquash = 0;
      w.fz = 0;
      w.surface = hit.surface;
      w.normal = hit.normal;
      w.contact = hit.point;
      w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });
      continue;
    }
    // Series springs: the softer suspension takes most of the travel, the tire squashes a little.
    let xSusp = (kT / (kS + kT)) * defl;
    let xTire = (kS / (kS + kT)) * defl;
    let bump = 0;
    if (xSusp > CONFIG.suspension.maxCompression) {
      bump = (xSusp - CONFIG.suspension.maxCompression) * CONFIG.suspension.bumpStop;
      xSusp = CONFIG.suspension.maxCompression;
    }
    xTire = clamp(xTire, 0, radius * CONFIG.tire.maxSquashFraction);
    w.tireSquash = xTire;
    w.inContact = true;
    w.suspensionLength = CONFIG.suspension.restLength - xSusp;
    w.compression = xSusp;
    w.contact = hit.point;
    w.normal = hit.normal;
    w.surface = hit.surface;
    w.water = waterDepth(hit.point.x, hit.point.z);
    if (w.water > 0.04) w.surface = "water";
    w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });

    const denom = dot(hit.normal, down);
    let inv = 8;
    let rel = 0;
    if (denom < -0.1) {
      inv = -1 / denom;
      rel = dot(hit.normal, velocityAt(hit.point)) * inv;
    }
    let force = kS * xSusp * inv;
    const damp = rel < 0 ? CONFIG.suspension.dampingBump : CONFIG.suspension.dampingRebound;
    force -= damp * rel;
    force += bump;
    w.fz = clamp(force, 0, CONFIG.suspension.maxForce);
  }
}

function applyAntiRoll() {
  for (const axle of ["front", "rear"]) {
    const pair = wheels.filter((w) => w.spec.axle === axle);
    const a = pair[0];
    const b = pair[1];
    if (!a || !b || !a.inContact || !b.inContact) continue;
    const diff = a.compression - b.compression;
    const f = CONFIG.suspension.antiRoll * diff;
    a.fz += f;
    b.fz -= f;
  }
  for (const w of wheels) w.fz = clamp(w.fz, 0, CONFIG.suspension.maxForce);
}

function driveShares() {
  const split = CONFIG.drive.split[state.driveMode];
  return wheels.map((w) => {
    const axleShare = split[w.spec.axle] || 0;
    const n = wheels.filter((o) => o.spec.axle === w.spec.axle).length;
    return axleShare / n;
  });
}

function sampleTorque(rpm) {
  const curve = CONFIG.engine.torqueCurve;
  if (rpm <= curve[0].rpm) return curve[0].nm;
  for (let i = 1; i < curve.length; i++) {
    if (rpm <= curve[i].rpm) {
      const a = curve[i - 1];
      const b = curve[i];
      const t = (rpm - a.rpm) / (b.rpm - a.rpm);
      return lerp(a.nm, b.nm, t);
    }
  }
  return curve[curve.length - 1].nm;
}

function solvePowertrain(dt) {
  if (!state.engineOn || state.fuel <= 0) {
    state.engineOmega += ((0 - state.engineOmega) * dt) / 0.4;
    for (const w of wheels) w.driveTorque = 0;
    return;
  }
  const shares = driveShares();
  const driven = [];
  for (let i = 0; i < wheels.length; i++) if (shares[i] > 0) driven.push(i);
  const box = CONFIG.gearbox;
  const gearRatio = state.gear < 0 ? box.reverse : box.gears[state.gear - 1];
  const sign = state.gear < 0 ? -1 : 1;
  const totalRatio = gearRatio * box.finalDrive * sign;

  let wRef = 0;
  let sumSq = 0;
  for (const i of driven) {
    wRef += shares[i] * wheels[i].omega;
    sumSq += shares[i] * shares[i];
  }

  const pedal = pedals();
  const rpm = (state.engineOmega * 60) / TAU;
  let teng = sampleTorque(rpm) * pedal.throttle;
  if (state.coolant > 0.92) teng *= 0.18;
  if (rpm < CONFIG.engine.idleRpm) teng += (CONFIG.engine.idleRpm - rpm) * CONFIG.engine.idleGain;
  if (rpm >= CONFIG.engine.limiterRpm) teng = Math.min(teng, 0);
  if (pedal.throttle < 0.02) teng -= CONFIG.engine.brakeNm * clamp(rpm / CONFIG.engine.maxRpm, 0, 1);

  const matchedRpm = Math.abs(wRef * totalRatio) * 60 / TAU;
  let cap = CONFIG.clutch.maxTorque;
  if (pedal.throttle < CONFIG.clutch.idleThrottle && matchedRpm < CONFIG.engine.idleRpm * CONFIG.clutch.idleRpmFactor) {
    cap = CONFIG.clutch.idleCap;
  }
  if (state.shiftTimer > 0) cap = 0;

  let clutchTorque = 0;
  if (cap > 0 && driven.length && Math.abs(totalRatio) > 1e-4) {
    const slip = state.engineOmega - wRef * totalRatio;
    const Ie = CONFIG.engine.inertia;
    const Iw = CONFIG.wheel.inertia;
    const lock = (1 / Ie) + (totalRatio * totalRatio * box.efficiency * sumSq) / Iw;
    const tcLock = slip / (lock * dt);
    clutchTorque = clamp(tcLock, -cap, cap);
  }

  state.engineOmega += ((teng - clutchTorque) * dt) / CONFIG.engine.inertia;
  const limit = (CONFIG.engine.limiterRpm * TAU) / 60;
  state.engineOmega = clamp(state.engineOmega, 0, limit * 1.02);

  const wheelTorque = clutchTorque * totalRatio * box.efficiency;
  for (let i = 0; i < wheels.length; i++) {
    let torque = wheelTorque * shares[i];
    if (state.tc && shares[i] > 0) {
      const slip = Math.abs(wheels[i].slipRatio);
      if (slip > CONFIG.tc.slip) {
        torque *= clamp(1 - (slip - CONFIG.tc.slip) * CONFIG.tc.gain, CONFIG.tc.min, 1);
      }
    }
    wheels[i].driveTorque = torque;
  }

  state.shiftTimer = Math.max(0, state.shiftTimer - dt);
  state.shiftCooldown = Math.max(0, state.shiftCooldown - dt);
  if (state.gear < 1 || state.shiftTimer > 0 || state.shiftCooldown > 0) return;

  let slipAvg = 0;
  if (driven.length) {
    for (const i of driven) slipAvg += Math.abs(wheels[i].slipRatio);
    slipAvg /= driven.length;
  }
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  const spinning = slipAvg > box.wheelspinSlip && speed < box.wheelspinSpeed;
  if (!spinning && rpm > box.upRpm && state.gear < box.gears.length && pedal.throttle > 0.45) {
    state.gear += 1;
    state.shiftTimer = box.shiftTime;
    state.shiftCooldown = box.shiftCooldown;
  } else if (rpm < box.downRpm && state.gear > 1) {
    state.gear -= 1;
    state.shiftTimer = box.shiftTime;
    state.shiftCooldown = box.shiftCooldown;
  }
}

function tireFrame(w) {
  const n = w.normal;
  let fwd = rotateVec(state.quat, { x: 0, y: 0, z: 1 });
  fwd = sub(fwd, mul(n, dot(fwd, n)));
  if (vecLen(fwd) < 1e-4) fwd = { x: 0, y: 0, z: 1 };
  fwd = normalize(fwd);
  let right = normalize(cross(n, fwd));
  fwd = normalize(cross(right, n));
  const s = Math.sin(w.steerAngle);
  const c = Math.cos(w.steerAngle);
  w.forward = add(mul(fwd, c), mul(right, s));
  w.right = add(mul(right, c), mul(fwd, -s));
}

function solveTires(dt) {
  const ref = (CONFIG.chassis.mass * CONFIG.physics.gravity) / wheels.length;
  for (const w of wheels) {
    tireFrame(w);
    const vel = velocityAt(w.centerWorld);
    w.vLong = dot(vel, w.forward);
    w.vLat = dot(vel, w.right);
    if (!w.inContact || w.fz < 25) {
      w.fx = 0;
      w.fy = 0;
      w.slipRatio += (0 - w.slipRatio) * 0.2;
      w.slipAngle += (0 - w.slipAngle) * 0.2;
      continue;
    }
    w.grip = surfaceParams(w.centerWorld.x, w.centerWorld.z);
    const kappa = (w.omega * w.spec.radius - w.vLong) / Math.max(Math.abs(w.vLong), CONFIG.tire.kappaFloor);
    const alpha = Math.atan2(w.vLat, Math.max(Math.abs(w.vLong), CONFIG.tire.alphaFloor));
    const rate = Math.max(Math.hypot(w.vLong, w.vLat), 2) / CONFIG.tire.relaxation;
    const blend = 1 - Math.exp(-rate * dt);
    w.slipRatio += (kappa - w.slipRatio) * blend;
    w.slipAngle += (alpha - w.slipAngle) * blend;

    let surf = w.grip || surfaceParams(w.contact.x, w.contact.z);
    if (state.rainGrip && (w.surface === "asphalt" || w.surface === "wet")) {
      const wet = CONFIG.surfaces.wet;
      surf = { mu: wet.mu, rolling: wet.rolling, sink: surf.sink, lng: wet.lng, lat: wet.lat };
      const puddle = roadHash(ROAD.seed, Math.floor(w.centerWorld.x * 2), Math.floor(w.centerWorld.z * 2));
      if (puddle > 0.84) surf = { ...surf, mu: surf.mu * 0.78 };
    }
    if (state.snowCover && (w.surface === "asphalt" || w.surface === "wet" || w.surface === "dirt" || w.surface === "grass")) {
      // Slippery, but still able to pull away in rear-wheel drive. Packed-snow mu spun the wheels in place.
      surf = { ...surf, mu: Math.min(surf.mu * 0.62, 0.55), rolling: surf.rolling + 0.01 };
    }
    const load = Math.max(0.3, 1 - CONFIG.tire.loadSensitivity * ((w.fz - ref) / ref));
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const gripScale = 1 - (spec.gripLoss || 0) * clamp(w.sinkDepth, 0, 1);
    let waterMul = 1;
    if (w.water > 0) {
      const shallow = clamp(w.water / CONFIG.water.shallow, 0, 1);
      const deep = clamp((w.water - CONFIG.water.hub) / Math.max(0.05, CONFIG.water.deep - CONFIG.water.hub), 0, 1);
      waterMul = lerp(1, CONFIG.surfaces.water.mu / Math.max(surf.mu, 0.2), shallow) * lerp(1, CONFIG.water.muDeep, deep);
    }
    const peak = surf.mu * gripScale * waterMul * w.fz * load;
    let fx = magic(w.slipRatio, surf.lng) * peak;
    let fy = -magic(w.slipAngle, surf.lat) * peak;
    const rho = Math.hypot(fx / peak, fy / peak);
    if (rho > 1) {
      fx /= rho;
      fy /= rho;
    }
    w.fx = fx;
    w.fy = fy;
    const flexTarget = clamp(-fy / CONFIG.tire.flexStiffness, -0.07, 0.07);
    w.latFlex += (flexTarget - w.latFlex) * (1 - Math.exp(-dt / CONFIG.tire.flexTime));
  }
}

function updateSink(dt) {
  // Sink settles onto a packed base. A rolling wheel only digs so far;
  // a locked slide can plow deeper, then the depth stops growing.
  for (const w of wheels) {
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const slip = Math.abs(w.slipRatio);
    const slipLat = Math.abs(w.slipAngle || 0);
    const locked = w.inContact && Math.abs(w.omega) < 2.4 && Math.abs(w.vLong) > 0.55;
    const braking = input.brake > 0.35 || input.handbrake > 0.35;
    const digAbove = spec.digAbove ?? 0.45;
    const cap = spec.loose ? ((locked || braking) ? (spec.sinkCapBrake ?? 0.85) : (spec.sinkCap ?? 1)) : 1;
    if (spec.loose && w.inContact) {
      if (spec.restSink && w.sinkDepth < spec.restSink) {
        w.sinkDepth += (spec.restSink - w.sinkDepth) * Math.min(1, dt * 1.5);
      }
      const digSignal = Math.min(1.35, Math.max(slip, slipLat * 1.05, locked ? 1.2 : 0));
      const dig = Math.max(0, digSignal - digAbove) * (spec.slipGain || 0.4);
      if (w.sinkDepth < cap && dig > 0) {
        const room = clamp((cap - w.sinkDepth) / Math.max(cap, 0.25), 0, 1);
        w.sinkDepth += dig * (0.2 + 0.8 * room) * dt;
      }
    }
    const digging = spec.loose && w.inContact && (locked || braking || slip > digAbove || slipLat > digAbove);
    if (!w.inContact || !digging) {
      const floor = spec.restSink && w.inContact ? spec.restSink : 0;
      if (w.sinkDepth > floor) w.sinkDepth -= (spec.recover || 0.45) * dt;
    }
    if (!spec.loose) w.sinkDepth -= 1.2 * dt;
    w.sinkDepth = clamp(w.sinkDepth, 0, cap);
  }
}

function applyContactForces() {
  for (const w of wheels) {
    if (!w.inContact) continue;
    applyForce(w.contact, mul(w.normal, w.fz));
    applyForce(w.contact, mul(w.forward, w.fx));
    applyForce(w.contact, mul(w.right, w.fy));
    const surf = w.grip || surfaceParams(w.contact.x, w.contact.z);
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const vel = velocityAt(w.centerWorld);
    // Horizontal only. A vertical component here fights the suspension and jitters.
    const hs = Math.hypot(vel.x, vel.z);
    if (hs > 0.05 && w.fz > 0) {
      const roll = surf.rolling * w.fz * Math.min(1, hs / 1.4);
      const speedDrag = (surf.sink || 0) * w.fz * hs;
      const rut = (spec.hDrag || 0) * w.sinkDepth * w.fz * hs;
      const bullK = spec.bull || 0;
      let bull = 0;
      if (bullK > 0) {
        const slipLong = Math.abs(w.slipRatio);
        const slipLat = Math.abs(w.slipAngle || 0);
        const locked = Math.abs(w.omega) < 2.2 && hs > 0.45;
        const spinning = Math.abs(w.omega) * w.spec.radius > Math.abs(w.vLong) + 0.35
          && Math.sign(w.omega || 1) === Math.sign(w.vLong || w.omega || 1);
        const sliding = locked || slipLat > 0.38 || (slipLong > 0.9 && !spinning);
        const sinkUse = clamp(w.sinkDepth, 0, 1);
        const visc = bullK * 0.04 * Math.max(sinkUse, (spec.restSink || 0) * 0.35) * w.spec.width * (hs / (hs + 1.6));
        let slide = 0;
        if (sliding) {
          const boost = (locked ? 1.7 : 0.65) + Math.min(slipLat, 1.1) * 0.4;
          const fSpeed = 0.7 + hs / (hs + 0.75);
          slide = bullK * Math.max(sinkUse, locked ? 0.42 : 0.2) * w.spec.width * fSpeed * boost;
        }
        bull = visc + slide;
      }
      let hydro = 0;
      if (w.water > CONFIG.water.hub) {
        const submerged = w.water - CONFIG.water.hub * 0.35;
        hydro = CONFIG.water.drag * submerged * hs * hs;
      }
      const mag = roll + speedDrag + rut + hydro + bull;
      applyForce(w.contact, { x: -vel.x / hs * mag, y: 0, z: -vel.z / hs * mag });
    }
  }
  // Belly in the ford: a capped upward force, never enough to float the car out.
  let belly = 0;
  let bellyN = 0;
  for (const p of CONFIG.chassis.samples) {
    if (p.y > 0) continue;
    const world = localToWorld(p);
    const bed = groundHeight(world.x, world.z);
    const surfaceY = bed + waterDepth(world.x, world.z);
    const under = surfaceY - world.y;
    if (under > 0) belly += under;
    bellyN++;
  }
  if (bellyN && belly > 0) {
    const depth = belly / bellyN;
    const lift = Math.min(CONFIG.water.buoyancy * depth, CONFIG.chassis.mass * CONFIG.physics.gravity * CONFIG.water.buoyancyCap);
    applyForce(state.position, { x: 0, y: lift, z: 0 });
  }
  const v = state.velocity;
  const s = vecLen(v);
  if (s > 0.3) {
    const a = CONFIG.chassis.aero;
    const drag = 0.5 * a.rho * a.cd * a.area * s * s;
    applyForce(state.position, mul(v, -drag / s));
  }
}

function collideChassis() {
  const k = CONFIG.chassis.scrapeStiffness;
  const c = CONFIG.chassis.scrapeDamping;
  for (const p of CONFIG.chassis.samples) {
    const world = localToWorld(p);
    const h = groundHeight(world.x, world.z);
    const soft = CONFIG.surfaces[surfaceAt(world.x, world.z)];
    const give = p.y < 0 && soft && soft.bellyGive ? soft.bellyGive : 0;
    if (world.y + give >= h) continue;
    const n = groundNormal(world.x, world.z);
    const pen = h - give - world.y;
    const vn = dot(velocityAt(world), n);
    let f = pen * k - vn * c;
    if (f < 0) continue;
    f = Math.min(f, CONFIG.chassis.scrapeCap);
    applyForce(world, mul(n, f));
  }
}

function integrateWheels(dt) {
  const pedal = pedals();
  const I = CONFIG.wheel.inertia;
  for (const w of wheels) {
    let brake = pedal.brake * (w.spec.axle === "front" ? CONFIG.brake.frontTorque : CONFIG.brake.rearTorque);
    if (input.handbrake > 0 && w.spec.axle === "rear") brake = Math.max(brake, CONFIG.brake.handbrakeTorque * input.handbrake);
    let T = w.driveTorque - w.fx * w.spec.radius;
    T -= Math.sign(w.omega) * CONFIG.wheel.spinDrag;
    const wUn = w.omega + (T * dt) / I;
    const maxDelta = (brake * dt) / I;
    if (brake > 0 && Math.abs(wUn) <= maxDelta) w.omega = 0;
    else if (brake > 0) w.omega = wUn - Math.sign(wUn) * maxDelta;
    else w.omega = wUn;
    const sunk = CONFIG.surfaces[w.surface];
    if (sunk && sunk.spinDamp && w.sinkDepth > 0.8 && Math.abs(w.slipRatio) > 0.45) {
      const depth = (w.sinkDepth - 0.8) / 0.2;
      const dragT = sunk.spinDamp * depth;
      const wSign = Math.sign(w.omega || T || 1);
      w.omega -= wSign * Math.min(Math.abs(w.omega), (dragT * dt) / I);
    }
    w.omega = clamp(w.omega, -700, 700);
    w.spinAngle += w.omega * dt;
  }
}

function integrateChassis(dt) {
  const m = CONFIG.chassis.mass;
  state.force.y -= m * CONFIG.physics.gravity;
  state.velocity.x += (state.force.x / m) * dt;
  state.velocity.y += (state.force.y / m) * dt;
  state.velocity.z += (state.force.z / m) * dt;
  const ld = Math.exp(-CONFIG.chassis.linearDamping * dt);
  state.velocity.x *= ld;
  state.velocity.z *= ld;

  const R = quatToMat3(state.quat);
  const Ib = [
    CONFIG.chassis.inertia.x, 0, 0,
    0, CONFIG.chassis.inertia.y, 0,
    0, 0, CONFIG.chassis.inertia.z,
  ];
  const Iworld = mulMat(mulMat(R, Ib), transpose(R));
  const Iw = mulMatVec(Iworld, state.omega);
  const tau = sub(state.torque, cross(state.omega, Iw));
  const alpha = mulMatVec(invertMat3(Iworld), tau);
  state.omega.x += alpha.x * dt;
  state.omega.y += alpha.y * dt;
  state.omega.z += alpha.z * dt;
  const ad = Math.exp(-CONFIG.chassis.angularDamping * dt);
  state.omega.x *= ad;
  state.omega.y *= ad;
  state.omega.z *= ad;
  const om = vecLen(state.omega);
  if (om > 30) {
    const s = 30 / om;
    state.omega.x *= s;
    state.omega.y *= s;
    state.omega.z *= s;
  }
  const sp = vecLen(state.velocity);
  if (sp > 140) {
    const s = 140 / sp;
    state.velocity.x *= s;
    state.velocity.y *= s;
    state.velocity.z *= s;
  }

  state.position.x += state.velocity.x * dt;
  state.position.y += state.velocity.y * dt;
  state.position.z += state.velocity.z * dt;
  const wq = { x: state.omega.x, y: state.omega.y, z: state.omega.z, w: 0 };
  const dq = quatMul(wq, state.quat);
  state.quat.x += 0.5 * dq.x * dt;
  state.quat.y += 0.5 * dq.y * dt;
  state.quat.z += 0.5 * dq.z * dt;
  state.quat.w += 0.5 * dq.w * dt;
  quatNormalize(state.quat);

  const upy = rotateVec(state.quat, { x: 0, y: 1, z: 0 }).y;
  if (upy < state.minUp) state.minUp = upy;
  if (!Number.isFinite(state.position.y + state.quat.w + state.velocity.x)) state.blewUp = true;
}

function noteImpact(point, normal, speed) {
  if (state.impactCooldown > 0 || speed < 2.4) return;
  state.impactCooldown = 0.45;
  impacts.push({
    x: point.x, y: point.y, z: point.z,
    nx: normal.x, ny: normal.y, nz: normal.z,
    speed,
  });
}

function pushOutOfRail(p, box) {
  const base = box.y || 0;
  if (p.y < base - 0.25 || p.y > base + box.h + 0.4) return null;
  const x1 = box.x + box.w;
  const z1 = box.z + box.d;
  if (p.x < box.x || p.x > x1 || p.z < box.z || p.z > z1) return null;
  const dl = p.x - box.x;
  const dr = x1 - p.x;
  const df = p.z - box.z;
  const db = z1 - p.z;
  const m = Math.min(dl, dr, df, db);
  if (m === dl) return { n: { x: -1, y: 0, z: 0 }, pen: dl };
  if (m === dr) return { n: { x: 1, y: 0, z: 0 }, pen: dr };
  if (m === df) return { n: { x: 0, y: 0, z: -1 }, pen: df };
  return { n: { x: 0, y: 0, z: 1 }, pen: db };
}

function resolveBarriers() {
  const points = () => {
    const list = [state.position];
    for (const s of CONFIG.chassis.samples) list.push(localToWorld(s));
    return list;
  };
  for (let iter = 0; iter < 3; iter++) {
    let pushed = false;
    for (const p of points()) {
      for (const rail of railsNear(p.z)) {
        const hit = pushOutOfRail(p, rail);
        if (!hit || hit.pen <= 0) continue;
        const vn = state.velocity.x * hit.n.x + state.velocity.z * hit.n.z;
        state.position.x += hit.n.x * (hit.pen + 0.03);
        state.position.z += hit.n.z * (hit.pen + 0.03);
        if (vn < 0) {
          state.velocity.x -= hit.n.x * vn;
          state.velocity.z -= hit.n.z * vn;
        }
        if (hit.pen > 0.02 && -vn > 1.6) noteImpact(p, hit.n, -vn);
        pushed = true;
      }
      for (const rock of rocksNear(p.z)) {
        const d = { x: p.x - rock.x, y: p.y - rock.cy, z: p.z - rock.z };
        const dist = vecLen(d);
        const pen = rock.r + 0.08 - dist;
        if (pen <= 0.03 || dist < 1e-4) continue;
        const n = mul(d, 1 / dist);
        const vn = state.velocity.x * n.x + state.velocity.y * n.y + state.velocity.z * n.z;
        if (n.y > 0.62) {
          // Crown of a rock under the belly: lift straight up so the car can drive off.
          const lift = Math.min(pen, 0.07);
          state.position.y += lift;
          if (state.velocity.y < 0) state.velocity.y *= 0.15;
        } else {
          state.position.x += n.x * pen;
          state.position.y += Math.max(0, n.y) * pen * 0.45;
          state.position.z += n.z * pen;
          if (vn < 0) {
            state.velocity.x -= n.x * vn;
            state.velocity.y -= n.y * vn * 0.35;
            state.velocity.z -= n.z * vn;
          }
          if (pen > 0.06 && -vn > 2) noteImpact(p, n, -vn);
        }
        pushed = true;
      }
    }
    if (!pushed) break;
  }
}

function stepTravel(dt) {
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  const rpm = (state.engineOmega * 60) / TAU;
  const pedal = pedals();
  if (!scripted && state.engineOn && state.fuel > 0) {
    const burn = (0.0032 + pedal.throttle * 0.011 + (rpm / 7000) * 0.0045) * dt;
    state.fuel = Math.max(0, state.fuel - burn);
    if (state.fuel <= 0) state.engineOn = false;
  }
  let slip = 0;
  for (const w of wheels) slip += Math.abs(w.slipRatio);
  slip /= wheels.length;
  const heat = scripted ? 0 : (pedal.throttle * 0.012 + Math.max(0, slip - 0.55) * 0.02) * dt;
  const cool = 0.016 * dt * (state.coolant > 0.36 ? 1 : 0.35);
  state.coolant = clamp(state.coolant + heat - cool, 0.16, 1);
  const draw = (0.0012 + state.lights * 0.0055 + ((state.wipers || state.rain) ? 0.0025 : 0)) * dt;
  state.battery = clamp(state.battery + (state.engineOn ? 0.012 : 0) * dt - draw, 0, 1);
  if (state.battery <= 0.02) {
    state.lights = 0;
    state.wipers = false;
  }
  state.odo += (speed * dt) / 1000;
  const scale = state.timeScale || 1;
  state.timeOfDay = (state.timeOfDay + (dt * scale) / 180) % 1;
  if (!scripted && state.weatherMode === "auto") {
    state.weatherTime += dt * scale;
    if (state.weatherTime > 75) {
      state.weatherTime = 0;
      state.weatherEpoch += 1;
      state.weatherFront = state.position.z + 40;
      rebuildAhead();
    }
  }
  updateClimate();
  if (state.impactCooldown > 0) state.impactCooldown = Math.max(0, state.impactCooldown - dt);
}

function stepPhysics(dt) {
  if (state.blewUp) return;
  ensureRoad(state.position.z);
  state.force.x = state.force.y = state.force.z = 0;
  state.torque.x = state.torque.y = state.torque.z = 0;
  readInput();
  updateSteer(dt);
  updateReverse(dt);
  castSuspension();
  applyAntiRoll();
  solvePowertrain(dt);
  solveTires(dt);
  updateSink(dt);
  applyContactForces();
  collideChassis();
  integrateWheels(dt);
  integrateChassis(dt);
  resolveBarriers();
  // Wheel hubs are stored in world space for the axle meshes. Refresh them
  // after the body moves so a fast car does not leave the axles a step behind.
  for (const w of wheels) {
    w.centerWorld = localToWorld({
      x: w.spec.x,
      y: w.spec.y - w.suspensionLength,
      z: w.spec.z,
    });
  }
  updateEffects(dt);
  stepTravel(dt);
  state.time += dt;
}

const specks = [];
let speckI = 0;
let smokeParts = [];
let dirtParts = [];
let smokeMesh = null;
let dirtMesh = null;
const partDummy = new THREE.Object3D();

function spawnPart(pool, x, y, z, vx, vy, vz) {
  for (const p of pool) {
    if (p.life > 0) continue;
    p.life = 0.75;
    p.x = x;
    p.y = y;
    p.z = z;
    p.vx = vx;
    p.vy = vy;
    p.vz = vz;
    p.s = 0.22;
    return;
  }
}

function stepParts(pool, mesh, dt, grow) {
  if (!mesh) return;
  for (let i = 0; i < pool.length; i++) {
    const p = pool[i];
    if (p.life > 0) {
      p.life -= dt;
      p.vy -= 1.6 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.s = Math.min(p.s + grow * dt, 1.35);
      const ground = groundHeight(p.x, p.z) + 0.06;
      if (p.y < ground) {
        p.y = ground;
        p.vy = Math.abs(p.vy) * 0.15;
      }
    }
    const alive = p.life > 0;
    const s = alive ? p.s * Math.min(1, p.life * 2.2) : 0.001;
    partDummy.position.set(p.x, alive ? p.y : -30, p.z);
    partDummy.scale.setScalar(s);
    partDummy.rotation.set(p.life * 2, p.life * 3, 0);
    partDummy.updateMatrix();
    mesh.setMatrixAt(i, partDummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}
let skidPool = [];
let skidCursor = 0;
let rutPool = [];
let rutCursor = 0;
let effectsReady = false;

function hash01(n) {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

function clearEffects() {
  for (const p of specks) p.life = 0;
  for (const p of smokeParts) p.life = 0;
  for (const p of dirtParts) p.life = 0;
  for (const m of skidPool) m.visible = false;
  for (const m of rutPool) m.visible = false;
  skidCursor = 0;
  rutCursor = 0;
  for (const w of wheels) {
    w.skidAcc = 0;
    w.rutAcc = 0;
  }
}

function dropSkid(w, slip) {
  if (!skidPool.length) return;
  const m = skidPool[skidCursor];
  skidCursor = (skidCursor + 1) % skidPool.length;
  m.visible = true;
  m.position.set(w.contact.x, w.contact.y + 0.03, w.contact.z);
  m.rotation.set(0, Math.atan2(w.forward.x, w.forward.z), 0);
  m.scale.set(1, 1, 0.7 + Math.min(slip, 1.4) * 0.45);
    if (w.surface === "wet") {
      m.material.color.setHex(0x1c2430);
      m.material.opacity = 0.55;
    } else {
      m.material.color.setHex(0x141414);
      m.material.opacity = 0.72;
    }
  }

function dropRut(w) {
  if (!rutPool.length) return;
  const m = rutPool[rutCursor];
  rutCursor = (rutCursor + 1) % rutPool.length;
  m.visible = true;
  const side = w.spec.x < 0 ? -0.08 : 0.08;
  m.position.set(w.contact.x + w.right.x * side, w.contact.y + 0.025, w.contact.z + w.right.z * side);
  m.rotation.set(0, Math.atan2(w.forward.x, w.forward.z), 0);
  const deep = clamp(0.4 + w.sinkDepth * 0.6, 0.4, 1);
  m.scale.set(0.7 + deep * 0.5, 1, 0.85);
  if (w.surface === "snow" || w.surface === "drift" || w.surface === "pack") m.material.color.setHex(0x9eb0be);
  else if (w.surface === "sand") m.material.color.setHex(0x8c7040);
  else m.material.color.setHex(0x2a1c12);
  m.material.opacity = 0.45 + deep * 0.4;
}

function emitSpeck(x, y, z, vx, vy, vz, color) {
  const p = specks[speckI];
  speckI = (speckI + 1) % specks.length;
  p.x = x; p.y = y; p.z = z;
  p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = CONFIG.particles.life;
  p.r = color.r; p.g = color.g; p.b = color.b;
}

function updateEffects(dt) {
  if (!effectsReady) return;
  for (const w of wheels) {
    if (!w.inContact) continue;
    const slip = Math.hypot(w.slipRatio, w.slipAngle * 2.2);
    const loose = w.surface === "sand" || w.surface === "dirt" || w.surface === "grass";
    const paved = w.surface === "asphalt" || w.surface === "wet";
    const spinning = Math.abs(w.slipRatio) > 0.3;
    if (paved && slip > CONFIG.skid.slip) {
      w.skidAcc += Math.max(Math.hypot(w.vLong, w.vLat), 1.2) * dt;
      if (w.skidAcc >= CONFIG.skid.spacing) {
        w.skidAcc = 0;
        dropSkid(w, slip);
      }
    } else {
      w.skidAcc = 0;
    }
    const rutty = w.surface === "snow" || w.surface === "drift" || w.surface === "pack" || w.surface === "sand" || w.surface === "mud";
    if (rutty && w.inContact) {
      const spec = CONFIG.surfaces[w.surface];
      const depth = Math.max((w.sinkDepth || 0) * (spec.sinkMax || 0), spec.sinkMax ? 0.012 : 0);
      carveSoft(w.contact.x, w.contact.z, depth);
    }
    if (rutty && w.sinkDepth > 0.12) {
      w.rutAcc += Math.max(Math.hypot(w.vLong, w.vLat), spinning ? 1.4 : 0) * dt;
      if (w.rutAcc >= 0.22) {
        w.rutAcc = 0;
        dropRut(w);
      }
    } else {
      w.rutAcc = 0;
    }
    const wetWheel = (w.water || 0) > 0.03 && Math.hypot(w.vLong, w.vLat) > 0.7;
    const sprayOn = (loose && (spinning || slip > 0.28)) || (paved && spinning) || (w.surface === "ice" && spinning) || (rutty && spinning && w.sinkDepth > 0.12) || wetWheel;
    if (sprayOn && state.tick % 2 === 0) {
      const spray = w.surface === "sand" ? { r: 0.86, g: 0.72, b: 0.4 }
        : w.surface === "dirt" ? { r: 0.55, g: 0.36, b: 0.18 }
        : w.surface === "grass" ? { r: 0.42, g: 0.62, b: 0.28 }
        : (w.surface === "snow" || w.surface === "drift" || w.surface === "pack") ? { r: 0.93, g: 0.96, b: 1 }
        : w.surface === "mud" ? { r: 0.32, g: 0.22, b: 0.12 }
        : w.surface === "ice" ? { r: 0.9, g: 0.95, b: 1 }
        : (w.water || 0) > 0.03 ? { r: 0.72, g: 0.88, b: 0.95 }
        : { r: 0.62, g: 0.62, b: 0.62 };
      const j = hash01(state.tick * 0.17 + w.spec.x * 3 + w.spec.z);
      const atContact = (rutty && w.sinkDepth > 0.12) || (w.water || 0) > 0.03;
      emitSpeck(
        w.contact.x + (atContact ? w.right.x * 0.05 : w.right.x * 0.4),
        w.contact.y + ((w.water || 0) > 0.03 ? 0.15 : atContact ? 0.08 : 0.25),
        w.contact.z + (atContact ? w.right.z * 0.05 : w.right.z * 0.4),
        -w.forward.x * 0.8 + (j - 0.5) * 1.4,
        1.1 + j * 1.3,
        -w.forward.z * 0.8 + (hash01(j + 2) - 0.5) * 1.4,
        spray,
      );
    }
    const burnout = Math.abs(w.slipRatio) > 0.42 || slip > 0.58;
    if (paved && burnout && state.tick % 3 === 0) {
      const puff = hash01(state.tick * 0.13 + w.spec.x);
      spawnPart(smokeParts, w.contact.x, w.contact.y + 0.18, w.contact.z, -w.forward.x * 0.5 + (puff - 0.5), 1.1, -w.forward.z * 0.5);
    }
    const clod = w.surface === "dirt" || w.surface === "mud" || w.surface === "grass" || w.surface === "sand";
    if (clod && (slip > 0.32 || w.sinkDepth > 0.22) && state.tick % 4 === 0) {
      spawnPart(dirtParts, w.contact.x, w.contact.y + 0.12, w.contact.z, w.right.x * 1.2, 1.6, w.right.z * 1.2);
    }
  }
  for (const p of specks) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vy -= 3.2 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
  }
  stepParts(smokeParts, smokeMesh, dt, 1.4);
  stepParts(dirtParts, dirtMesh, dt, 0.6);
  flushSoft();
  state.tick++;
}

  tile(1, (g, S) => { grain(g, S, [48, 62, 78], 22); g.fillStyle = "rgba(180,200,220,0.18)"; for (let i = 0; i < 8; i++) g.fillRect(rnd(i, 3) * S, rnd(i, 9) * S, 30, 3); });
  tile(2, (g, S) => { grain(g, S, [122, 78, 42], 46); });

function groundMaterial(atlas) {

  mat.customProgramCacheKey = () => "surface-atlas-1";
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.atlasMap = { value: atlas };
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", "#include <common>\nattribute float surfaceId;\nvarying float vSid;\nvarying vec3 vWpos;")
      .replace("#include <uv_vertex>", "#include <uv_vertex>\nvSid = surfaceId;\nvWpos = position;");
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying float vSid;\nvarying vec3 vWpos;\nuniform sampler2D atlasMap;")
      .replace("#include <color_fragment>", `#include <color_fragment>
        float col = mod(vSid, 4.0);
        float rowTop = floor(vSid / 4.0);
        vec2 f = fract(vWpos.xz * 0.35) * 0.84 + 0.08;
        float v0 = 1.0 - (rowTop + 1.0) / 2.0;
        vec2 auv = vec2((col + f.x) / 4.0, v0 + f.y / 2.0);
        diffuseColor.rgb *= texture2D(atlasMap, auv).rgb;
        if (abs(vSid - 5.0) < 0.5) {
          vec3 V = normalize(cameraPosition - vWpos);
          float fres = pow(1.0 - max(V.y, 0.0), 2.4);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.82, 0.93, 0.98), 0.28);
          diffuseColor.rgb += vec3(0.75, 0.88, 0.98) * fres * 0.95;
        }`);
  };
  return mat;
}

function buildWater() {
  const f = CONFIG.water.ford;
  const geo = new THREE.PlaneGeometry(f.w, f.d, 14, 16);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      time: { value: 0 },
      ford: { value: new THREE.Vector4(f.x, f.z, f.w, f.d) },
      peak: { value: f.depth },
      car: { value: new THREE.Vector2(0, 4) },
    },
    vertexShader: `
      uniform float time;
      uniform vec4 ford;
      uniform float peak;
      varying vec3 vPos;
      varying float vDepth;
      void main() {
        vec4 world0 = modelMatrix * vec4(position, 1.0);
        float u = clamp((world0.x - ford.x) / ford.z, 0.0, 1.0);
        float v = clamp((world0.z - ford.y) / ford.w, 0.0, 1.0);
        float side = smoothstep(0.0, 0.14, u) * smoothstep(1.0, 0.86, u);
        vDepth = peak * sin(3.14159 * v) * side;
        float wave = sin(world0.x * 0.85 + time * 1.25) * 0.11 + sin(world0.z * 1.05 - time * 0.95) * 0.08;
        vec3 p = position;
        p.y += 0.04 + wave * smoothstep(0.02, 0.16, vDepth);
        vec4 world = modelMatrix * vec4(p, 1.0);
        vPos = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform vec2 car;
      varying vec3 vPos;
      varying float vDepth;
      void main() {
        if (vDepth < 0.02) discard;
        vec3 n = normalize(cross(dFdx(vPos), dFdy(vPos)));
        float shade = clamp(vDepth / 0.55, 0.0, 1.0);
        vec3 deep = vec3(0.03, 0.16, 0.26);
        vec3 shallow = vec3(0.42, 0.72, 0.74);
        vec3 col = mix(shallow, deep, shade);
        col *= 0.55 + 0.45 * max(dot(n, normalize(vec3(0.35, 0.9, 0.2))), 0.0);
        float edge = smoothstep(0.16, 0.0, vDepth);
        float nearCar = smoothstep(4.2, 0.7, length(vPos.xz - car));
        float foam = clamp(edge * 0.95 + nearCar * 0.75 * smoothstep(0.02, 0.2, vDepth), 0.0, 1.0);
        col = mix(col, vec3(0.86, 0.93, 0.94), foam);
        float alpha = 0.42 + shade * 0.34 + foam * 0.2;
        gl_FragColor = vec4(col, alpha);
      }
    `,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(f.x + f.w / 2, 0, f.z + f.d / 2);
  mesh.renderOrder = 2;
  scene.userData.water = mat;
  return mesh;
}

function buildForest() {
  const count = 80;
  const trunks = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.14, 0.22, 1.5, 5),
    new THREE.MeshStandardMaterial({ color: 0x6d4428, flatShading: true, roughness: 0.95 }),
    count,
  );
  const crowns = new THREE.InstancedMesh(
    new THREE.ConeGeometry(0.95, 2.2, 5),
    new THREE.MeshStandardMaterial({ color: 0x2f7d34, flatShading: true, roughness: 0.9 }),
    count,
  );
  const dummy = new THREE.Object3D();
  let seed = 11;
  const rnd = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
  const mesh = CONFIG.track.mesh;
  let placed = 0;
  let guard = 0;
  while (placed < count && guard < 2500) {
    guard++;
    const x = mesh.minX + 6 + rnd() * (mesh.maxX - mesh.minX - 12);
    const z = mesh.minZ + 6 + rnd() * (mesh.maxZ - mesh.minZ - 12);
    if (surfaceAt(x, z) !== "grass") continue;
    if (Math.abs(x) < 18 && z > -48 && z < 200) continue;
    const s = 0.7 + rnd() * 0.85;
    dummy.position.set(x, groundHeight(x, z) + 0.75 * s, z);
    dummy.scale.set(s, s, s);
    dummy.rotation.y = rnd() * TAU;
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    dummy.position.y += 1.35 * s;
    dummy.updateMatrix();
    crowns.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = placed;
  crowns.count = placed;
  scene.add(trunks);
  scene.add(crowns);
}

function buildRocks() {
  const geo = new THREE.DodecahedronGeometry(1, 0);
  const pebble = new THREE.DodecahedronGeometry(1, 0);
  for (const rock of CONFIG.track.rocks) {
    const h = rock.cy + rock.r;
    const shade = 0.42 + (Math.abs(Math.sin(rock.x * 12.1 + rock.z)) * 0.38);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(shade, shade * 0.93, shade * 0.84),
      flatShading: true,
      roughness: 0.94,
    });
    const mesh = new THREE.Mesh(h < 0.22 ? pebble : geo, mat);
    const squash = rock.crawl ? 0.78 : 0.82;
    mesh.scale.set(rock.r, rock.r * squash, rock.r * (0.9 + (rock.x % 0.2)));
    mesh.position.set(rock.x, rock.cy, rock.z);
    mesh.rotation.set(rock.z * 0.2, rock.x * 0.4, rock.z * 0.15);
    mesh.castShadow = h > 0.35;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}

function buildRails() {
  const metal = new THREE.MeshStandardMaterial({ color: 0xc5ccd1, metalness: 0.72, roughness: 0.32, flatShading: true });
  const postMat = new THREE.MeshStandardMaterial({ color: 0x8e969c, metalness: 0.5, roughness: 0.45, flatShading: true });
  for (const rail of CONFIG.track.guardrails) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(rail.w, 0.16, rail.d), metal);
    beam.position.set(rail.x + rail.w * 0.5, 0.72, rail.z + rail.d * 0.5);
    beam.castShadow = true;
    scene.add(beam);
    const beam2 = beam.clone();
    beam2.position.y = 0.42;
    scene.add(beam2);
    const posts = Math.max(2, Math.floor(rail.d / 4));
    for (let i = 0; i < posts; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 0.12), postMat);
      post.position.set(rail.x + rail.w * 0.5, 0.45, rail.z + (i + 0.5) * (rail.d / posts));
      scene.add(post);
    }
  }
}

let skyMat = null;
let skyMesh = null;
let moonMesh = null;
let weatherPts = null;
function buildSky() {
  skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color("#8ec6ef") },
      horizon: { value: new THREE.Color("#f3d7b0") },
      bottom: { value: new THREE.Color("#b7c9a4") },
      sunDir: { value: new THREE.Vector3(0.3, 0.8, 0.2) },
    },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "varying vec3 vP; uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; void main(){ float h = clamp(vP.y * 0.55 + 0.15, 0.0, 1.0); vec3 col = mix(bottom, horizon, smoothstep(0.0, 0.42, h)); col = mix(col, top, smoothstep(0.32, 0.85, h)); float sun = pow(max(dot(normalize(vP), normalize(sunDir)), 0.0), 160.0); col += vec3(1.0, 0.9, 0.7) * sun; gl_FragColor = vec4(col, 1.0); }",
  });
  skyMesh = new THREE.Mesh(new THREE.SphereGeometry(90, 16, 10), skyMat);
  skyMesh.frustumCulled = false;
  scene.add(skyMesh);
  moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xf4f1e4 }),
  );
  scene.add(moonMesh);
  const clouds = [];
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xf7f4ee, flatShading: true, roughness: 1 });
  for (let i = 0; i < 7; i++) {
    const group = new THREE.Group();
    for (let b = 0; b < 4; b++) {
      const puff = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.1, 2.2), cloudMat);
      puff.position.set((b - 1.5) * 2.1, (b % 2) * 0.5, (b - 1) * 0.6);
      group.add(puff);
    }
    group.position.set(-30 + i * 18, 26 + (i % 3) * 4, -20 + (i % 4) * 22);
    scene.add(group);
    clouds.push(group);
  }
  scene.userData.clouds = clouds;
  const n = 70;
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = (hash01(i) - 0.5) * 20;
    arr[i * 3 + 1] = 2 + hash01(i + 3) * 8;
    arr[i * 3 + 2] = (hash01(i + 8) - 0.5) * 20;
  }
  geo.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  weatherPts = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.1, transparent: true, opacity: 0.85, depthWrite: false, sizeAttenuation: true,
  }));
  weatherPts.frustumCulled = false;
  weatherPts.visible = false;
  scene.add(weatherPts);
}

function makeTread() {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#161616";
  g.fillRect(0, 0, 128, 64);
  g.fillStyle = "#3a3a3a";
  for (let i = 0; i < 10; i++) g.fillRect(4 + i * 12, 6, 6, 52);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function buildCar() {
  const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0, flatShading: true, ...extra });
  const paint = flat(0xd6a21e, { roughness: 0.55 });
  const paintDark = flat(0xa67c12, { roughness: 0.6 });
  const dark = flat(0x1b1e22, { roughness: 0.8 });
  const chrome = flat(0xd5dde3, { metalness: 0.85, roughness: 0.22 });
  const glass = flat(0xb7e0ef, { roughness: 0.08, metalness: 0.05, transparent: true, opacity: 0.45 });

  const spare = add(new THREE.Mesh(

      shader.uniforms.uPlaneN = mat.userData.planeN;
      shader.uniforms.uPlaneD = mat.userData.planeD;
      shader.vertexShader = shader.vertexShader
        .replace("#include <common>", `#include <common>
          uniform float uDefl;
          uniform vec3 uPlaneN;
          uniform float uPlaneD;`)
        .replace("#include <begin_vertex>", `#include <begin_vertex>
          if (uDefl > 0.0004) {
            float h = dot(transformed, uPlaneN);
            float gap = uPlaneD - h;
            if (gap > 0.0) {
              transformed += uPlaneN * gap;
              vec3 axle = vec3(1.0, 0.0, 0.0);
              vec3 radial = transformed - axle * dot(transformed, axle);
              float rl = length(radial);

function buildEffects() {
  for (let i = 0; i < CONFIG.particles.pool; i++) {
    specks.push({ x: 0, y: -40, z: 0, vx: 0, vy: 0, vz: 0, life: 0, r: 1, g: 1, b: 1 });
  }
  const positions = new Float32Array(CONFIG.particles.pool * 3);
  const colors = new Float32Array(CONFIG.particles.pool * 3);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const points = new THREE.Points(
    geom,
    new THREE.PointsMaterial({ size: 0.24, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }),
  );
  scene.add(points);
  scene.userData.points = points;

  const skidGeo = new THREE.BoxGeometry(0.28, 0.02, 0.7);
  for (let i = 0; i < CONFIG.skid.pool; i++) {
    const m = new THREE.Mesh(
      skidGeo,
      new THREE.MeshBasicMaterial({ color: 0x141414, transparent: true, opacity: 0.6, depthWrite: false }),
    );
    m.visible = false;
    scene.add(m);
    skidPool.push(m);
  }
  const rutGeo = new THREE.BoxGeometry(0.34, 0.012, 0.55);
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(
      rutGeo,
      new THREE.MeshBasicMaterial({ color: 0x8c7040, transparent: true, opacity: 0.7, depthWrite: false }),
    );
    m.visible = false;
    scene.add(m);
    rutPool.push(m);
  }
  const ico = new THREE.IcosahedronGeometry(0.18, 0);
  smokeMesh = new THREE.InstancedMesh(
    ico,
    new THREE.MeshStandardMaterial({ color: 0xd5dde4, transparent: true, opacity: 0.5, flatShading: true, depthWrite: false, roughness: 1 }),
    22,
  );
  smokeMesh.frustumCulled = false;
  scene.add(smokeMesh);
  smokeParts = Array.from({ length: 22 }, () => ({ life: 0, x: 0, y: -30, z: 0, vx: 0, vy: 0, vz: 0, s: 0.2 }));
  dirtMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.16, 0.1, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x6a3d22, flatShading: true, roughness: 1 }),
    16,
  );
  dirtMesh.frustumCulled = false;
  scene.add(dirtMesh);
  dirtParts = Array.from({ length: 16 }, () => ({ life: 0, x: 0, y: -30, z: 0, vx: 0, vy: 0, vz: 0, s: 0.2 }));
  effectsReady = true;
}

function orientBetween(mesh, a, b, axis) {
  const d = sub(b, a);
  const len = Math.max(vecLen(d), 0.05);
  const mid = mul(add(a, b), 0.5);
  mesh.position.set(mid.x, mid.y, mid.z);
  const dir = mul(d, 1 / len);
  const from = axis === "x" ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  mesh.quaternion.setFromUnitVectors(from, new THREE.Vector3(dir.x, dir.y, dir.z));
  if (axis === "x") mesh.scale.set(len, 1, 1);
  else mesh.scale.set(1, len, 1);
}

function setArrow(arrow, origin, vector) {
  const len = vecLen(vector);
  if (!state.debug || len < 180) {
    arrow.visible = false;
    return;
  }
  const L = len * CONFIG.debug.forceScale;
  arrow.visible = true;
  arrow.position.set(origin.x, origin.y + 0.05, origin.z);
  arrow.setDirection(new THREE.Vector3(vector.x / len, vector.y / len, vector.z / len));
  arrow.setLength(Math.max(L, 0.2), Math.max(L * 0.22, 0.08), Math.max(L * 0.12, 0.05));
}

const orbit = {
  yaw: 0,
  pitch: CONFIG.camera.pitch,
  dist: CONFIG.camera.orbitDist,
  hold: false,
  idle: 10,
  dragging: false,
  pointers: new Map(),
  lastX: 0,
  lastY: 0,
  pinch: 0,
};

function settleOrbit() {
  orbit.yaw = 0;
  orbit.pitch = CONFIG.camera.pitch;
  orbit.dist = CONFIG.camera.orbitDist;
  orbit.idle = 10;
  orbit.dragging = false;
  orbit.pointers.clear();
  orbit.pinch = 0;
}

function easeOrbit(frameDt) {
  if (orbit.dragging || orbit.hold) return;
  orbit.idle += frameDt;
  if (orbit.idle < CONFIG.camera.returnDelay) return;
  const k = 1 - Math.exp(-2.4 * frameDt);
  let dyaw = -orbit.yaw;
  while (dyaw > Math.PI) dyaw -= TAU;
  while (dyaw < -Math.PI) dyaw += TAU;
  orbit.yaw += dyaw * k;
  orbit.pitch += (CONFIG.camera.pitch - orbit.pitch) * k;
  orbit.dist += (CONFIG.camera.orbitDist - orbit.dist) * k;
}

function cameraDesired() {
  const face = Math.atan2(rotateVec(state.quat, { x: 0, y: 0, z: 1 }).x, rotateVec(state.quat, { x: 0, y: 0, z: 1 }).z) + orbit.yaw;
  const pitch = clamp(orbit.pitch, CONFIG.camera.minPitch, CONFIG.camera.maxPitch);
  const dist = clamp(orbit.dist, CONFIG.camera.minDist, CONFIG.camera.maxDist);
  const horiz = dist * Math.cos(pitch);
  const x = state.position.x - Math.sin(face) * horiz;
  const z = state.position.z - Math.cos(face) * horiz;
  let y = state.position.y + dist * Math.sin(pitch);
  const floorY = groundHeight(x, z) + 0.45;
  if (y < floorY) y = floorY;
  return { x, y, z };
}

function snapCamera() {
  settleOrbit();
  const d = cameraDesired();
  camPos.set(d.x, d.y, d.z);
  camera.position.copy(camPos);
  const up = rotateVec(state.quat, { x: 0, y: 1, z: 0 });
  look.set(
    state.position.x + up.x * CONFIG.camera.lookHeight,
    state.position.y + up.y * CONFIG.camera.lookHeight,
    state.position.z + up.z * CONFIG.camera.lookHeight,
  );
  camera.up.set(0, 1, 0);
  camera.lookAt(look);
  camReady = true;
}

function addScratch(mesh, localHit, outward) {
  const scratches = chassis.userData.scratches || (chassis.userData.scratches = []);
  if (scratches.length > 14) return;
  const mark = new THREE.Mesh(
    new THREE.PlaneGeometry(0.34, 0.1),
    new THREE.MeshBasicMaterial({ color: 0x241c14, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }),
  );
  mark.position.copy(localHit).addScaledVector(outward, 0.04);
  mark.lookAt(mark.position.clone().add(outward));
  mesh.add(mark);
  scratches.push(mark);
}

function applyImpacts() {
  const panels = chassis.userData.panels;
  if (!panels) return;
  while (impacts.length) {
    const hit = impacts.pop();
    let best = null;
    let bestD = 1.05;
    const at = new THREE.Vector3(hit.x, hit.y, hit.z);
    for (const mesh of panels) {
      const wp = new THREE.Vector3();
      mesh.getWorldPosition(wp);
      const d = wp.distanceTo(at);
      if (d < bestD) {
        best = mesh;
        bestD = d;
      }
    }
    if (!best) continue;
    const attr = best.geometry.attributes.position;
    const localHit = best.worldToLocal(at.clone());
    const inward = best.worldToLocal(at.clone().add(new THREE.Vector3(-hit.nx, -hit.ny, -hit.nz))).sub(localHit);
    if (inward.lengthSq() < 1e-6) inward.set(0, -1, 0);
    inward.normalize();
    let moved = 0;
    for (let i = 0; i < attr.count; i++) {
      const dx = attr.getX(i) - localHit.x;
      const dy = attr.getY(i) - localHit.y;
      const dz = attr.getZ(i) - localHit.z;
      const dist = Math.hypot(dx, dy, dz);
      if (dist > 0.72) continue;
      const k = (1 - dist / 0.72) * 0.16;
      attr.setXYZ(i, attr.getX(i) + inward.x * k, attr.getY(i) + inward.y * k, attr.getZ(i) + inward.z * k);
      moved++;
    }
    if (!moved) continue;
    attr.needsUpdate = true;
    best.geometry.computeVertexNormals();
    state.wear += 2;
    const surf = surfaceAt(hit.x, hit.z);
    const ru = (CONFIG.surfaces[surf] && CONFIG.surfaces[surf].ru) || "КУЗОВ";
    state.wearLine = `${ru} • ИЗНОС +${state.wear}`;
    addScratch(best, localHit, inward.clone().negate());
  }
}

const BIOME_SKY = {
  winter: { top: "#d5e4ef", horizon: "#eef3f6", fog: "#dfe8ee", near: 34 },
  rain: { top: "#4d6270", horizon: "#6d624f", fog: "#6a7278", near: 24 },
  desert: { top: "#f0b15a", horizon: "#f6d7a2", fog: "#e6c98a", near: 30 },
  forest: { top: "#7eb0dc", horizon: "#d5e7c4", fog: "#b7cda6", near: 40 },
  mixed: { top: "#8ec6ef", horizon: "#f3d7b0", fog: "#a9c0ce", near: 46 },
};

function skyColor(name, key) {
  return new THREE.Color((BIOME_SKY[name] || BIOME_SKY.mixed)[key]);
}

function updateAtmosphere(frameDt) {
  updateClimate();
  const t = state.timeOfDay;
  const elev = Math.sin((t - 0.25) * TAU);
  const az = t * TAU;
  const sunDir = new THREE.Vector3(Math.cos(az), elev, Math.sin(az)).normalize();
  const day = clamp(elev * 0.5 + 0.5, 0, 1);
  const mixT = state.biomeT || 0;
  const rainDim = state.rain ? 0.62 : state.dust ? 0.9 : 1;
  if (skyMat) {
    const top = skyColor(state.biome, "top").lerp(skyColor(state.biomeNext, "top"), mixT);
    const horizon = skyColor(state.biome, "horizon").lerp(skyColor(state.biomeNext, "horizon"), mixT);
    skyMat.uniforms.top.value.copy(top).lerp(new THREE.Color("#070b16"), 1 - day);
    skyMat.uniforms.horizon.value.copy(horizon).lerp(new THREE.Color("#1a120c"), 1 - day);
    skyMat.uniforms.bottom.value.set("#8ea4b4").lerp(new THREE.Color("#05070c"), 1 - day);
    skyMat.uniforms.sunDir.value.copy(sunDir);
  }
  if (skyMesh) skyMesh.position.copy(camera.position);
  sun.intensity = Math.max(0, elev) * 1.25 * rainDim;
  sun.position.set(
    state.position.x + sunDir.x * 40,
    state.position.y + Math.max(sunDir.y, 0.05) * 40,
    state.position.z + sunDir.z * 40,
  );
  if (typeof hemi !== "undefined") hemi.intensity = (0.25 + day * 0.7) * rainDim;
  fill.intensity = (0.08 + day * 0.3) * rainDim;
  const fog = skyColor(state.biome, "fog").lerp(skyColor(state.biomeNext, "fog"), mixT);
  scene.fog.color.copy(fog).lerp(new THREE.Color("#12161c"), 1 - day);
  const near = BIOME_SKY[state.biome].near + (BIOME_SKY[state.biomeNext].near - BIOME_SKY[state.biome].near) * mixT;
  scene.fog.near = near;
  if (moonMesh) {
    moonMesh.position.set(
      state.position.x - sunDir.x * 60,
      state.position.y + Math.max(-sunDir.y, 0.1) * 40,
      state.position.z - sunDir.z * 60,
    );
    moonMesh.visible = elev < 0.15;
  }
  const clouds = scene.userData.clouds || [];
  for (const cloud of clouds) {
    cloud.position.x += frameDt * 1.6;
    if (cloud.position.x > 80) cloud.position.x = -80;
  }
  const rainEl = document.getElementById("rainfx");
  const snowEl = document.getElementById("snowfx");
  const hazeEl = document.getElementById("hazefx");
  if (rainEl) rainEl.classList.toggle("on", state.rain);
  if (snowEl) snowEl.classList.toggle("on", state.snowing);
  if (hazeEl) hazeEl.classList.toggle("on", state.dust && day > 0.35);
  if (weatherPts) {
    const show = state.snowing || state.dust;
    weatherPts.visible = show;
    if (show) {
      const pos = weatherPts.geometry.attributes.position;
      const n = pos.count;
      for (let i = 0; i < n; i++) {
        let y = pos.getY(i) - frameDt * (state.snowing ? 2.4 : 0.8);
        let x = pos.getX(i) + frameDt * (state.dust ? 1.4 : 0.2);
        if (y < state.position.y - 1 || x > state.position.x + 14) {
          x = state.position.x + (hash01(i + state.time * 10) - 0.5) * 22;
          y = state.position.y + 2 + hash01(i + 4) * 8;
          pos.setZ(i, state.position.z + (hash01(i + 9) - 0.5) * 22);
        }
        pos.setX(i, x);
        pos.setY(i, y);
      }
      pos.needsUpdate = true;
      weatherPts.material.color.set(state.dust ? 0xd7b07a : 0xf7fbff);
      weatherPts.material.size = state.dust ? 0.22 : 0.09;
    }
  }
  const beam = state.battery > 0.02 ? state.lights : 0;
  if (chassis.userData.headMat) chassis.userData.headMat.emissiveIntensity = beam === 0 ? 0.15 : beam === 1 ? 1.3 : 2.6;
  if (chassis.userData.spot) {
    const spot = chassis.userData.spot;
    spot.intensity = beam === 0 ? 0 : beam === 1 ? 10 : 26;
    spot.angle = beam === 2 ? 0.28 : 0.55;
    spot.distance = beam === 2 ? 55 : 28;
  }
  const sweeping = state.wipers || state.rain;
  const sweep = sweeping ? Math.sin(state.time * 2.6) : -0.85;
  for (const wiper of chassis.userData.wipers || []) wiper.rotation.y = sweep * 0.9;
}

function updateVisuals(frameDt) {
  chassis.position.set(state.position.x, state.position.y, state.position.z);
  chassis.quaternion.set(state.quat.x, state.quat.y, state.quat.z, state.quat.w);

  if (scene.userData.water) {
    scene.userData.water.uniforms.time.value += frameDt;
    scene.userData.water.uniforms.car.value.set(state.position.x, state.position.z);
  }
  if (scripted && !steerUi.dragging) steerUi.angle = input.steer * CONFIG.steer.wheelLock;
  const wheelEl = document.getElementById("wheel-rotor");
  if (wheelEl) wheelEl.style.transform = `rotate(${steerUi.angle}rad)`;
  if (chassis.userData.steerWheel) chassis.userData.steerWheel.rotation.z = -steerUi.angle;

  for (const w of wheels) {
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const sink = spec.deform ? 0 : (w.sinkDepth || 0) * w.spec.radius * 0.3;
    const y = w.spec.y - w.suspensionLength - sink;
    w.visual.steer.position.set(w.spec.x, y, w.spec.z);
    w.visual.steer.rotation.set(0, w.steerAngle, 0);
    w.visual.spin.scale.set(1, 1, 1);
    w.visual.spin.rotation.set(w.spinAngle, 0, w.latFlex || 0);
    const defl = w.inContact ? Math.min(w.tireSquash || 0, 0.045) : 0;
    const mat = w.visual.tire.material;
    w.visual.tire.updateWorldMatrix(true, false);
    if (defl > 0.0004 && w.contact) {
      const inv = _tireInv.copy(w.visual.tire.matrixWorld).invert();
      _tireN.set(w.normal.x, w.normal.y, w.normal.z).transformDirection(inv);
      _tireP.set(w.contact.x, w.contact.y, w.contact.z).applyMatrix4(inv);
      mat.userData.defl.value = defl;
      mat.userData.planeN.value.copy(_tireN);
      mat.userData.planeD.value = _tireN.dot(_tireP);
    } else {
      mat.userData.defl.value = 0;
    }
    const plow = w.visual.plow;
    const plowing = spec.deform && (spec.bull || 0) > 0 && w.inContact && w.sinkDepth > 0.32;
    plow.visible = plowing;
    if (plowing) {
      const reach = 0.28 + w.sinkDepth * 0.55;
      plow.position.set(
        w.contact.x + w.forward.x * reach,
        w.contact.y + 0.08 + w.sinkDepth * 0.12,
        w.contact.z + w.forward.z * reach,
      );
      plow.scale.set(0.7 + w.sinkDepth, 0.45 + w.sinkDepth * 1.3, 0.7 + w.sinkDepth);
      plow.quaternion.setFromUnitVectors(_plowFrom, _plowTo.set(w.forward.x, 0.15, w.forward.z).normalize());
      plow.material.color.set(w.surface === "mud" ? 0x3a2418 : w.surface === "sand" ? 0xc6a15a : 0xf4f7fb);
    }
    const slipV = Math.abs(w.omega * w.spec.radius - w.vLong);
    const blur = clamp(Math.abs(w.omega) / 40, 0, 1);
    w.visual.ghosts.forEach((g, i) => {
      const sign = i === 0 ? 1 : -1;
      g.rotation.set(w.spinAngle + sign * (0.35 + blur * 0.55), 0, 0);
      g.material.opacity = slipV > 2.2 && blur > 0.15 ? 0.28 + blur * 0.35 : 0;
    });
    setArrow(w.arrows.n, w.contact, mul(w.normal, w.fz));
    setArrow(w.arrows.x, w.contact, mul(w.forward, w.fx));
    setArrow(w.arrows.y, w.contact, mul(w.right, w.fy));
  }
  if (chassis.userData.tailMat) {
    const braking = input.brake > 0.12 || input.handbrake > 0.15;
    chassis.userData.tailMat.emissiveIntensity = braking ? 2.4 : 0.35;
  }
  applyImpacts();
  updateAtmosphere(frameDt);

  const byAxle = { front: [], rear: [] };
  for (const w of wheels) byAxle[w.spec.axle].push(w);
  for (const axle of ["front", "rear"]) {
    const [a, b] = byAxle[axle];
    orientBetween(chassis.userData.axles[axle], a.centerWorld, b.centerWorld, "x");
  }
  wheels.forEach((w, i) => {
    // Visual wishbone from the tub out to the hub. Length tracks suspension travel.
    const mount = localToWorld({
      x: Math.sign(w.spec.x) * 0.46,
      y: 0.02,
      z: w.spec.z,
    });
    orientBetween(chassis.userData.arms[i], mount, w.centerWorld, "y");
  });

  const points = scene.userData.points;
  const pos = points.geometry.attributes.position.array;
  const col = points.geometry.attributes.color.array;
  for (let i = 0; i < specks.length; i++) {
    const p = specks[i];
    const alive = p.life > 0;
    pos[i * 3] = alive ? p.x : 0;
    pos[i * 3 + 1] = alive ? p.y : -40;
    pos[i * 3 + 2] = alive ? p.z : 0;
    const fade = alive ? clamp(p.life / CONFIG.particles.life, 0, 1) : 0;
    col[i * 3] = p.r * fade;
    col[i * 3 + 1] = p.g * fade;
    col[i * 3 + 2] = p.b * fade;
  }
  points.geometry.attributes.position.needsUpdate = true;
  points.geometry.attributes.color.needsUpdate = true;

  easeOrbit(frameDt);
  const desired = cameraDesired();
  if (!camReady) snapCamera();
  const stiff = orbit.dragging ? 16 : CONFIG.camera.stiffness;
  const k = 1 - Math.exp(-stiff * Math.max(frameDt, 1 / 120));
  camPos.lerp(new THREE.Vector3(desired.x, desired.y, desired.z), k);
  const floorY = groundHeight(camPos.x, camPos.z) + 0.4;
  if (camPos.y < floorY) camPos.y = floorY;
  camera.position.copy(camPos);
  look.set(state.position.x, state.position.y + CONFIG.camera.lookHeight, state.position.z);
  camera.up.set(0, 1, 0);
  camera.lookAt(look);

  sun.position.set(state.position.x + 14, state.position.y + 22, state.position.z + 8);
  sun.target.position.set(state.position.x, state.position.y, state.position.z);
  fill.position.set(state.position.x - 10, state.position.y + 8, state.position.z - 6);

  updateHud();
}
