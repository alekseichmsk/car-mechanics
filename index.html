<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="car-build" content="voyage-5432g">
<title>Car mechanics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23d3541a' width='16' height='16' rx='3'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #e8eef3;
    --amber: #ffbf3c;
    --panel: rgba(8, 10, 12, 0.82);
    --line: rgba(255, 255, 255, 0.14);
    --good: #86f0b0;
    --bad: #ff5a45;
  }
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #8ea4b4;
    color: var(--ink);
    font-family: "Segoe UI", "DejaVu Sans", "Noto Sans", "Arial", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; width: 100%; }
  #view {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud, #touch, #hint, #rotate { position: fixed; z-index: 2; }
  #hud {
    top: 0; left: 0; right: 0;
    padding:
      calc(6px + env(safe-area-inset-top, 0px))
      calc(8px + env(safe-area-inset-right, 0px))
      0
      calc(8px + env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #cluster {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
    pointer-events: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  #speedbox { min-width: 108px; display: flex; flex-direction: column; justify-content: center; }
  #speed {
    font-size: 40px;
    line-height: 0.9;
    font-weight: 750;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
  }
  #unit { font-size: 12px; letter-spacing: 0.14em; opacity: 0.75; }
  #gearbox { min-width: 116px; }
  #gear {
    font-size: 28px;
    font-weight: 750;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #rpmwrap {
    margin: 6px 0 4px;
    height: 8px;
    background: #1a2128;
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  #rpmfill { height: 100%; width: 0%; background: var(--amber); }
  #rpmfill.hot { background: var(--bad); }
  #rpm { font-size: 12px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; opacity: 0.85; }
  #modes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: auto; }
  #modes button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    min-height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  #modes button[data-drive="FWD"]::before { content: "ПП"; }
  #modes button[data-drive="RWD"]::before { content: "ЗП"; }
  #modes button[data-drive="AWD"]::before { content: "4×4"; }
  #tc::before { content: "TC"; }
  #trip { display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .tbar { width: 58px; }
  .tbar i { display: block; height: 7px; border-radius: 99px; background: #1a2128; overflow: hidden; }
  .tbar i span { display: block; height: 100%; width: 0%; }
  #fuel i span { background: #e2b43a; }
  #temp i span { background: #ff7a3c; }
  #batt i span { background: #7ee0a0; }
  #odo {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    font-weight: 750;
    font-size: 16px;
    min-width: 7.2ch;
  }
  #wear {
    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  #side {
    position: fixed;
    z-index: 4;
    top: 118px;
    right: calc(8px + env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }
  #side button {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #side svg { width: 22px; height: 22px; }
  #rainfx, #snowfx, #hazefx {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  #rainfx {
    background: repeating-linear-gradient(105deg, transparent 0 14px, rgba(190, 210, 225, 0.28) 14px 15px);
    animation: streaks 0.45s linear infinite;
    opacity: 0.85;
  }
  #snowfx {
    background:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,.9) 0 1.1px, transparent 1.6px),
      radial-gradient(circle at 70% 40%, rgba(255,255,255,.75) 0 1.2px, transparent 1.7px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.8) 0 1px, transparent 1.5px);
    background-size: 140px 180px, 180px 220px, 160px 200px;
    animation: snowfall 2.8s linear infinite;
    opacity: 0.8;
  }
  #hazefx {
    background: linear-gradient(180deg, rgba(255, 214, 150, 0.22), rgba(255, 236, 200, 0.05) 40%, rgba(255, 220, 160, 0.12));
    animation: haze 3.2s ease-in-out infinite;
    opacity: 0.9;
  }
  #rainfx.on, #snowfx.on, #hazefx.on { display: block; }
  #seedchip { display: none; }
  #wheels, #legend, #wear, #hint, #rpm, #rpmwrap, #temp, #batt, #odo, #forces { display: none !important; }
  #newseed::before { content: "НОВЫЙ СИД"; }
  #seedline { font-size: 12px; letter-spacing: 0.04em; }
  #worldmenu {
    position: fixed;
    z-index: 6;
    left: calc(12px + env(safe-area-inset-left, 0px));
    top: 200px;
    width: min(250px, calc(100vw - 90px));
    display: none;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }
  #worldmenu.open { display: flex; }
  #worldmenu .wx, #worldmenu .ts {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  #worldmenu button {
    min-height: 32px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 12px;
  }
  #worldmenu button[data-wx="auto"]::before { content: "АВТО"; }
  #worldmenu button[data-wx="snow"]::before { content: "СНЕГ"; }
  #worldmenu button[data-wx="rain"]::before { content: "ДОЖДЬ"; }
  #worldmenu button[data-wx="desert"]::before { content: "ПУСТЫНЯ"; }
  #worldmenu button[data-wx="mixed"]::before { content: "СМЕШАН"; }
  #worldmenu button[data-time="1"]::before { content: "1×"; }
  #worldmenu button[data-time="4"]::before { content: "4×"; }
  #worldmenu button[data-time="16"]::before { content: "16×"; }
  #worldmenu button.on { background: var(--amber); color: #1a1408; }
  #bioline { font-size: 12px; letter-spacing: 0.06em; opacity: 0.9; }
  #extra {
    position: fixed;
    z-index: 4;
    left: calc(12px + env(safe-area-inset-left, 0px));
    top: 148px;
    display: flex;
    flex-direction: row;
    gap: 6px;
  }
  #extra button {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #extra svg { width: 22px; height: 22px; }
  @keyframes streaks { from { background-position: 0 0; } to { background-position: -30px 90px; } }
  @keyframes snowfall { from { background-position: 0 -40px, 0 -20px, 0 -60px; } to { background-position: 30px 180px, -20px 220px, 16px 200px; } }
  @keyframes haze { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
  #forces svg, #reset svg { width: 18px; height: 18px; }
  #wheels {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    max-width: 720px;
    pointer-events: none;
  }
  .wcard { padding: 6px 8px; }
  .wtop, .wmeta { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .wid { font-weight: 750; letter-spacing: 0.06em; }
  .wtag { font-size: 11px; font-weight: 750; letter-spacing: 0.08em; color: var(--bad); min-height: 1em; }
  .wsurf { font-size: 12px; opacity: 0.9; margin: 2px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .wcard.driven .wid { color: var(--amber); }
  .wcard.hot { outline: 1px solid var(--bad); }
  .meter { height: 7px; background: #1a2128; border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .meter > div { height: 100%; width: 0%; background: var(--good); }
  .meter.susp > div { background: #7eb6ff; }
  .meter-label { font-size: 10px; opacity: 0.65; letter-spacing: 0.08em; }
  #legend { display: flex; flex-wrap: wrap; gap: 5px; max-width: 640px; pointer-events: none; }
  .swatch {
    display: flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 99px; padding: 3px 8px 3px 4px;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .swatch i { width: 12px; height: 12px; border-radius: 99px; display: block; }
  #hint::before { content: "WASD · пробел ручник · ПП ЗП 4×4 · фары, дворники и дождь справа"; }
  #hint {
    left: calc(8px + env(safe-area-inset-left, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(var(--pad-h, 108px) + 8px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #f4f7fa;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #rotate::before { content: "Rotate to landscape"; }
  #rotate {
    display: none;
    top: env(safe-area-inset-top, 0px);
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    height: 32px;
    align-items: center;
    justify-content: center;
    background: rgba(8, 10, 12, 0.9);
    color: var(--amber);
    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #touch {
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    padding:
      0
      calc(12px + env(safe-area-inset-right, 0px))
      calc(10px + env(safe-area-inset-bottom, 0px))
      calc(12px + env(safe-area-inset-left, 0px));
    pointer-events: none;
    z-index: 3;
  }
  .steer, .pedals { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  .steer { flex-direction: column; align-items: flex-start; }
  .steer-btns { display: flex; gap: 8px; }
  #wheel {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: rgba(8, 10, 12, 0.72);
    color: #e8eef3;
    border: 1px solid var(--line);
    touch-action: none;
    pointer-events: auto;
  }
  #wheel-rotor { width: 100%; height: 100%; }
  #wheel svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  #steerL, #steerR { width: 72px; height: 72px; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 18px;
    padding: 0;
    font: inherit;
    font-weight: 750;
    letter-spacing: 0.04em;
    touch-action: none;
  }
  button svg {
    width: 44px;
    height: 44px;
    display: block;
    pointer-events: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  button:active, button.held, button.on { background: var(--amber); color: #1c1404; border-color: transparent; }
  #steerL, #steerR, #brake, #handbrake, #gas, #forces, #reset {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #brake, #handbrake {
    width: 92px;
    height: 92px;
  }
  #steerL, #steerR { width: 72px; height: 72px; }
  #gas {
    width: 108px;
    height: 108px;
    font-size: 18px;
    background: #d3541a;
    color: white;
    border-color: transparent;
  }
  #gas:active, #gas.held { background: #ff8a4a; color: white; }
  #brake { background: #243140; font-size: 13px; }
  #handbrake { background: #6e2424; font-size: 16px; }
  #err {
    display: none;
    position: fixed;
    z-index: 5;
    left: 10px; right: 10px; top: 40%;
    background: #3a1010;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
  }
  /* iPhone 12 Pro Max landscape is 926x428. Keep the HUD to one band. */
  @media (orientation: landscape) and (max-height: 500px) {
    #legend, #hint, .meter-label { display: none; }
    #speed { font-size: 28px; }
    #gear { font-size: 22px; }
    #unit, #rpm { font-size: 10px; }
    #rpmwrap { margin: 3px 0 2px; }
    .panel { padding: 4px 8px; }
    .wcard { padding: 3px 6px; }
    .wsurf { font-size: 10px; margin: 0 0 2px; }
    #hud { gap: 4px; }
    #cluster { flex-wrap: nowrap; align-items: center; }
    #modes button { min-height: 30px; padding: 0 8px; }
    #odo { font-size: 13px; }
    #wear { font-size: 11px; }
    #side { top: 74px; gap: 4px; }
    #side button { width: 38px; height: 38px; }
    #extra { top: 132px; }
    #extra button { width: 36px; height: 36px; }
    #worldmenu { top: 176px; }
    .tbar { width: 44px; }
  }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    #hud {
      top: calc(32px + env(safe-area-inset-top, 0px));
      padding-top: 6px;
    }
    #legend, #hint, .meter-label { display: none; }
    .wcard { padding: 4px 6px; }
    .wsurf { font-size: 10px; margin: 0 0 2px; }
    .pedals { flex-direction: column; align-items: flex-end; }
  }
  @media (min-width: 1100px) and (min-height: 700px) {
    #speed { font-size: 52px; }
    #legend { display: flex; }
    #hint { display: block; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="rotate" role="status"></div>
<div id="hud">
  <div id="cluster">
    <div id="speedbox" class="panel">
      <div id="speed">0</div>
      <div id="unit">KM/H</div>
    </div>
    <div id="gearbox" class="panel">
      <div id="gear">1</div>
      <div id="rpmwrap"><div id="rpmfill"></div></div>
      <div id="rpm">900 RPM</div>
    </div>
    <div id="trip" class="panel">
      <div class="tbar" id="fuel" aria-label="Топливо"><i><span></span></i></div>
      <div class="tbar" id="temp" aria-label="Температура"><i><span></span></i></div>
      <div class="tbar" id="batt" aria-label="Аккумулятор"><i><span></span></i></div>
      <div id="odo">00000.0</div>
    </div>
    <div id="modes" class="panel">
      <button type="button" data-drive="FWD" aria-label="Front-wheel drive"></button>
      <button type="button" data-drive="RWD" class="on" aria-label="Rear-wheel drive"></button>
      <button type="button" data-drive="AWD" aria-label="All-wheel drive"></button>
      <button type="button" id="tc" aria-label="Traction control"></button>
      <button type="button" id="forces" aria-label="Force vectors">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V7"/><path d="M8 11l4-5 4 5"/><path d="M5 15l4 4"/><path d="M19 15l-4 4"/></svg>
      </button>
      <button type="button" id="reset" aria-label="Reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v6h-6"/></svg>
      </button>
    </div>
  </div>
  <div id="wear">АСФАЛЬТ • ИЗНОС +0</div>
  <div id="wheels"></div>
  <div id="legend"></div>
</div>
<div id="extra">
  <button type="button" id="rocks" aria-label="Камни"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-8 3 4 2-3 6 7z"/><path d="M8 8l1.2-2L12 8"/></svg></button>
  <button type="button" id="menubtn" aria-label="Погода"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/><circle cx="17" cy="12" r="2"/></svg></button>
  <button type="button" id="camhold" aria-label="Камера"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M4 12a8 8 0 0 1 14-5"/><path d="M20 12a8 8 0 0 1-14 5"/></svg></button>
</div>
<div id="side">
  <button type="button" id="eng" aria-label="Двигатель"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9"/><path d="M7 6a8 8 0 1 0 10 0"/></svg></button>
  <button type="button" id="cruise" aria-label="Круиз"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2"/></svg></button>
  <button type="button" id="lights" aria-label="Фары"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h4"/><path d="M9 8l8-3v14l-8-3z"/><path d="M19 9v6"/></svg></button>
  <button type="button" id="wipers" aria-label="Дворники"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16c4-6 8-8 16-8"/><path d="M8 16l6-9"/></svg></button>
  <button type="button" id="rainbtn" aria-label="Дождь"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a5 5 0 1 1 1.2-9.8A6 6 0 0 1 18 11"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg></button>
</div>
<div id="rainfx"></div>
<div id="snowfx"></div>
<div id="hazefx"></div>
<div id="worldmenu" class="panel">
  <div id="seedline"></div>
  <div id="bioline"></div>
  <div class="wx">
    <button type="button" data-wx="auto" aria-label="Авто"></button>
    <button type="button" data-wx="snow" aria-label="Снег"></button>
    <button type="button" data-wx="rain" aria-label="Дождь"></button>
    <button type="button" data-wx="desert" aria-label="Пустыня"></button>
    <button type="button" data-wx="mixed" aria-label="Смешанный"></button>
  </div>
  <div class="ts">
    <button type="button" data-time="1" aria-label="Время 1"></button>
    <button type="button" data-time="4" aria-label="Время 4"></button>
    <button type="button" data-time="16" aria-label="Время 16"></button>
  </div>
  <button type="button" id="newseed" aria-label="Новый сид"></button>
</div>
<p id="hint"></p>
<div id="touch">
  <div class="steer">
    <div id="wheel" aria-label="Steering wheel" role="slider">
      <div id="wheel-rotor">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="10"/>
          <circle cx="50" cy="50" r="8" fill="currentColor"/>
          <path d="M50 18 V50 M18 62 L50 50 L82 62" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <circle cx="50" cy="16" r="5" fill="#ffbf3c"/>
        </svg>
      </div>
    </div>
    <div class="steer-btns">
    <button type="button" id="steerL" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <button type="button" id="steerR" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg></button>
    </div>
  </div>
  <div class="pedals">
    <button type="button" id="handbrake" aria-label="Handbrake"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8"/><path d="M12 20V9"/><circle cx="12" cy="6.2" r="2.2"/></svg></button>
    <button type="button" id="brake" aria-label="Brake"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="gas" aria-label="Gas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/></svg></button>
  </div>
</div>
<div id="err"></div>
<script type="module" id="app">
import * as THREE from "three";

// Climbable rock garden north of the dirt road. Buried spheres: exposed height is cy + r.
(function addCrawlRocks() {
  let seed = 91;
  const rnd = () => {
    seed = (seed * 48271) % 2147483647;
    return seed / 2147483647;
  };
  const placed = [];
  const push = (rock) => {
    for (const o of placed) {
      if (Math.hypot(o.x - rock.x, o.z - rock.z) < (o.r + rock.r) * 0.62) return;
    }
    placed.push(rock);
    CONFIG.track.rocks.push(rock);
  };
  for (let i = 0; i < 7; i++) {
    const z = 188 + rnd() * 18;
    const x = i % 2 === 0 ? 24 + rnd() * 5 : 74 + rnd() * 6;
    const h = 0.9 + rnd() * 0.35;
    const r = 0.72 + rnd() * 0.28;
    push({ x, z, r, cy: h - r, crawl: true });
  }
  for (let i = 0; i < 46; i++) {
    const z = 183 + rnd() * 24;
    const x = 30 + rnd() * 42;
    const h = 0.08 + rnd() * rnd() * 0.4;
    const r = Math.max(0.15, h * 0.8 + 0.08 + rnd() * 0.12);
    push({ x, z, r, cy: h - r, crawl: true });
  }
})();

// ---------------------------------------------------------------------------
// Math. Plain objects so the step can be ported without Three.js.
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function mul(a, s) { return { x: a.x * s, y: a.y * s, z: a.z * s }; }
function cross(a, b) {
  return {
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x,
  };
}
function vecLen(a) { return Math.hypot(a.x, a.y, a.z); }
function normalize(a) {
  const l = vecLen(a) || 1;
  return { x: a.x / l, y: a.y / l, z: a.z / l };
}
function quatMul(a, b) {
  return {
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
  };
}
function quatNormalize(q) {
  const l = Math.hypot(q.x, q.y, q.z, q.w) || 1;
  q.x /= l; q.y /= l; q.z /= l; q.w /= l;
  return q;
}
function quatFromAxisAngle(axis, angle) {
  const n = normalize(axis);
  const h = angle * 0.5;
  const s = Math.sin(h);
  return { x: n.x * s, y: n.y * s, z: n.z * s, w: Math.cos(h) };
}
function rotateVec(q, v) {
  const p = { x: v.x, y: v.y, z: v.z, w: 0 };
  const qi = { x: -q.x, y: -q.y, z: -q.z, w: q.w };
  const r = quatMul(quatMul(q, p), qi);
  return { x: r.x, y: r.y, z: r.z };
}
function quatToMat3(q) {
  const x = q.x, y = q.y, z = q.z, w = q.w;
  const x2 = x + x, y2 = y + y, z2 = z + z;
  const xx = x * x2, xy = x * y2, xz = x * z2;
  const yy = y * y2, yz = y * z2, zz = z * z2;
  const wx = w * x2, wy = w * y2, wz = w * z2;
  return [
    1 - (yy + zz), xy - wz, xz + wy,
    xy + wz, 1 - (xx + zz), yz - wx,
    xz - wy, yz + wx, 1 - (xx + yy),
  ];
}
function mulMat(a, b) {
  const c = new Array(9);
  for (let r = 0; r < 3; r++) {
    for (let col = 0; col < 3; col++) {
      c[r * 3 + col] =
        a[r * 3] * b[col] +
        a[r * 3 + 1] * b[3 + col] +
        a[r * 3 + 2] * b[6 + col];
    }
  }
  return c;
}
function transpose(m) {
  return [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
}
function mulMatVec(m, v) {
  return {
    x: m[0] * v.x + m[1] * v.y + m[2] * v.z,
    y: m[3] * v.x + m[4] * v.y + m[5] * v.z,
    z: m[6] * v.x + m[7] * v.y + m[8] * v.z,
  };
}
function invertMat3(m) {
  const a = m[0], b = m[1], c = m[2];
  const d = m[3], e = m[4], f = m[5];
  const g = m[6], h = m[7], i = m[8];
  const A = e * i - f * h;
  const B = f * g - d * i;
  const C = d * h - e * g;
  const D = c * h - b * i;
  const E = a * i - c * g;
  const F = b * g - a * h;
  const G = b * f - c * e;
  const H = c * d - a * f;
  const I = a * e - b * d;
  const det = a * A + b * B + c * C;
  const inv = 1 / det;
  return [A * inv, D * inv, G * inv, B * inv, E * inv, H * inv, C * inv, F * inv, I * inv];
}
function magic(slip, shape) {
  const bx = shape.B * slip;
  return Math.sin(shape.C * Math.atan(bx - shape.E * (bx - Math.atan(bx))));
}
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0 || 1), 0, 1);
  return t * t * (3 - 2 * t);
}

function assertMath() {
  const q = quatFromAxisAngle({ x: 0, y: 1, z: 0 }, Math.PI / 2);
  const v = rotateVec(q, { x: 0, y: 0, z: 1 });
  if (Math.abs(v.x - 1) > 1e-6 || Math.abs(v.y) > 1e-6 || Math.abs(v.z) > 1e-6) {
    throw new Error("quaternion rotate failed");
  }
  const R = quatToMat3(q);
  const vr = mulMatVec(R, { x: 0, y: 0, z: 1 });
  if (Math.abs(vr.x - v.x) > 1e-6 || Math.abs(vr.z - v.z) > 1e-6) {
    throw new Error("quat matrix does not match rotate");
  }
  const I = [4, 1, 0.2, 1, 5, 0.3, 0.2, 0.3, 6];
  const P = mulMat(I, invertMat3(I));
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const expect = r === c ? 1 : 0;
      if (Math.abs(P[r * 3 + c] - expect) > 1e-6) throw new Error("mat3 inverse failed");
    }
  }
  const up = cross({ x: 1, y: 0, z: 0 }, { x: 0, y: 1, z: 0 });
  if (Math.abs(up.z - 1) > 1e-9) throw new Error("cross product failed");
}

  mixed: { ru: "СМЕШАН", surfaces: ["asphalt", "dirt", "rocks", "sand", "mud", "drift", "pack", "ice", "water"] },
};
const BIOME_ZONE = 420;

function roadHash(seed, i, salt) {
  let n = (seed >>> 0) + Math.imul(i | 0, 0x9e3779b1) + Math.imul((salt | 0) + 1, 0x85ebca6b);
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d);
  n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

const roadPts = new Map();
let roadHi = 0;
let roadLo = 0;
const orderCache = new Map();
roadPts.set(0, { x: 0, y: 0, hdg: 0 });

function clearRoad() {
  roadPts.clear();
  roadPts.set(0, { x: 0, y: 0, hdg: 0 });
  roadHi = 0;
  roadLo = 0;
  orderCache.clear();
}

function biomeAt(z) {
  const mode = state.weatherMode;
  if (mode === "snow") return "winter";
  if (mode === "rain") return "rain";
  if (mode === "desert") return "desert";
  if (mode === "mixed") return "mixed";
  const keys = ["forest", "winter", "rain", "desert"];
  const along = Math.max(0, Math.abs(z) - ROAD.plain);
  let zone = Math.floor(along / BIOME_ZONE);
  if (z >= state.weatherFront) zone += state.weatherEpoch;
  const pick = Math.floor(roadHash(ROAD.seed, zone, 4) * keys.length) % keys.length;
  return keys[pick];
}

function biomeBlend(z) {
  const biome = biomeAt(z);
  if (state.weatherMode !== "auto") return { biome, next: biome, t: 0 };
  const along = Math.max(0, Math.abs(z) - ROAD.plain);
  const m = along % BIOME_ZONE;
  const t = clamp((m - (BIOME_ZONE - 80)) / 80, 0, 1);
  const sign = Math.sign(z) || 1;
  return { biome, next: biomeAt(z + sign * 90), t };
}

function surfaceOrder(biome, zone) {
  const key = `${ROAD.seed}:${biome}:${zone}`;
  if (orderCache.has(key)) return orderCache.get(key);
  const list = BIOMES[biome].surfaces.slice();
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(roadHash(ROAD.seed, zone * 31 + i, biome.length + 3) * (i + 1));
    const swap = list[i];
    list[i] = list[j];
    list[j] = swap;
  }
  orderCache.set(key, list);
  return list;
}

function advanceRoad(prev, index, dir) {
  const z = index * ROAD.step;
  if (Math.abs(z) <= ROAD.plain && Math.abs(prev.x) < 0.001) return { x: 0, y: 0, hdg: 0 };
  const kind = Math.abs(z) <= ROAD.plain ? "asphalt" : segKind(z);
  const soft = kind === "drift" || kind === "ice" || kind === "water";
  const turnAmp = soft ? 0.045 : 0.10;
  const slopeAmp = soft ? 0.012 : ROAD.maxSlope;
  const turn = (roadHash(ROAD.seed, index, 1) - 0.5) * 2 * turnAmp;
  let hdg = clamp(prev.hdg * 0.76 + turn, -ROAD.maxHeading, ROAD.maxHeading);
  if (Math.abs(z) < ROAD.plain + ROAD.step * 2) hdg *= 0.4;
  const dz = ROAD.step * dir;
  const x = prev.x + Math.tan(hdg) * dz;
  const slope = (roadHash(ROAD.seed, index, 2) - 0.5) * 2 * slopeAmp;
  let y = prev.y + slope * dz;
  y = clamp(y * 0.992, -8, 16);
  return { x, y, hdg };
}

function ensureRoadPt(index) {
  if (index > roadHi) {
    let prev = roadPts.get(roadHi);
    for (let k = roadHi + 1; k <= index; k++) {
      prev = advanceRoad(prev, k, 1);
      roadPts.set(k, prev);
    }
    roadHi = index;
  } else if (index < roadLo) {
    let prev = roadPts.get(roadLo);
    for (let k = roadLo - 1; k >= index; k--) {
      prev = advanceRoad(prev, k, -1);
      roadPts.set(k, prev);
    }
    roadLo = index;
  }
  return roadPts.get(index);
}

function roadSample(z) {
  const step = ROAD.step;
  const f = z / step;
  const i = Math.floor(f);
  const t = f - i;
  const a = ensureRoadPt(i);
  const b = ensureRoadPt(i + 1);
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, hdg: a.hdg + (b.hdg - a.hdg) * t };
}
function roadX(z) { return roadSample(z).x; }
function roadY(z) { return roadSample(z).y; }
function roadHeading(z) {
  const e = 2;
  return Math.atan2(roadX(z + e) - roadX(z - e), e * 2);
}
function segKind(z) {
  if (z >= -ROAD.plain && z <= ROAD.plain) return "asphalt";
  const biome = biomeAt(z);
  const list = BIOMES[biome].surfaces;
  const n = Math.floor((Math.abs(z) - ROAD.plain) / ROAD.seg);
  const zone = Math.floor(n / list.length);
  return surfaceOrder(biome, zone)[n % list.length];
}
function segStartZ(z) {
  if (Math.abs(z) <= ROAD.plain) return z >= 0 ? -ROAD.plain : -ROAD.plain;
  const sign = Math.sign(z) || 1;
  const shifted = Math.abs(z) - ROAD.plain;
  return sign * (ROAD.plain + Math.floor(shifted / ROAD.seg) * ROAD.seg);
}
function distToSegEdge(z) {
  const az = Math.abs(z);
  if (az <= ROAD.plain) return Math.min(ROAD.plain - z, z + ROAD.plain);
  const start = segStartZ(z);
  const sign = Math.sign(z) || 1;
  const end = start + sign * ROAD.seg;
  return Math.min(Math.abs(z - start), Math.abs(end - z));
}

function surfaceAt(x, z) {
  if (Math.abs(x - roadX(z)) > ROAD.half + 2) return "grass";
  const kind = segKind(z);
  if (kind === "rocks") return "gravel";
  if (kind === "water") return "asphalt";
  return kind;
}

// Blend grip a couple of metres across a zone edge so the car doesn't hit a friction cliff.
function surfaceParams(x, z) {
  const radius = CONFIG.track.blend;
  const samples = [[0, 0, 3], [radius, 0, 1], [-radius, 0, 1], [0, radius, 1], [0, -radius, 1]];
  let wsum = 0;
  const acc = { mu: 0, rolling: 0, sink: 0, lB: 0, lC: 0, lE: 0, aB: 0, aC: 0, aE: 0 };
  for (const [dx, dz, w] of samples) {
    const s = CONFIG.surfaces[surfaceAt(x + dx, z + dz)] || CONFIG.surfaces.grass;
    acc.mu += s.mu * w;
    acc.rolling += s.rolling * w;
    acc.sink += s.sink * w;
    acc.lB += s.lng.B * w;
    acc.lC += s.lng.C * w;
    acc.lE += s.lng.E * w;
    acc.aB += s.lat.B * w;
    acc.aC += s.lat.C * w;
    acc.aE += s.lat.E * w;
    wsum += w;
  }
  const k = 1 / wsum;
  return {
    mu: acc.mu * k,
    rolling: acc.rolling * k,
    sink: acc.sink * k,
    lng: { B: acc.lB * k, C: acc.lC * k, E: acc.lE * k },
    lat: { B: acc.aB * k, C: acc.aC * k, E: acc.aE * k },
  };
}

function featureHeight(x, z, f) {
  const u = (x - f.x) / f.w;
  const v = (z - f.z) / f.d;
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  if (f.type === "whoops") {
    const edge = smoothstep(0, 0.1, u) * smoothstep(1, 0.9, u) * smoothstep(0, 0.08, v) * smoothstep(1, 0.92, v);
    return edge * f.amp * (0.5 - 0.5 * Math.cos(v * f.cycles * TAU));
  }
  if (f.type === "bump") {
    const edge = smoothstep(0, 0.15, u) * smoothstep(1, 0.85, u);
    return edge * f.height * Math.sin(v * Math.PI);
  }
  if (f.type === "ford") return -waterDepth(x, z);
  if (f.type === "ramp") {
    const side = smoothstep(0, 0.08, u) * smoothstep(1, 0.92, u);
    const profile = v < 0.62 ? smoothstep(0, 1, v / 0.62) : 1 - smoothstep(0, 1, (v - 0.62) / 0.38);
    return side * f.height * profile;
  }
  return 0;
}

function waterDepth(x, z) {
  if (segKind(z) !== "water") return 0;
  const dx = x - roadX(z);
  if (Math.abs(dx) > 6.2) return 0;
  const start = segStartZ(z);
  const along = clamp((z - start) / ROAD.seg, 0, 1);
  const edge = smoothstep(0.08, 0.2, along) * smoothstep(0.92, 0.8, along);
  const side = 1 - (dx / 6.2) ** 2;
  return Math.min(ROAD.maxWater, 0.36 * edge * Math.max(side, 0));
}

function detailHeight(x, z, dx) {
  const kind = segKind(z);
  const fade = smoothstep(0, 14, distToSegEdge(z));
  const phase = ROAD.seed * 0.017;
  let h = 0;
  if (kind === "sand") h = 0.035 * Math.sin(x * 1.55 + phase) + 0.14 * Math.sin(z * 0.042 + phase) * Math.sin(x * 0.08 + phase * 0.3);
  else if (kind === "mud") h = 0.045 * Math.sin(x * 0.7 + phase) * Math.sin(z * 0.55);
  else if (kind === "drift") {
    const side = clamp((Math.abs(dx) - 5.8) / 1.5, 0, 1);
    const amp = 0.26 + 0.14 * roadHash(ROAD.seed, Math.floor(z / 18), 8);
    h = side * Math.min(ROAD.maxDrift, amp) * (0.7 + 0.3 * Math.sin(z * 0.07 + phase));
  } else if (kind === "pack") h = 0.012 * Math.sin(x * 0.9 + z * 0.3 + phase);
  return h * fade;
}

function terrainHeight(x, z) {
  const dx = x - roadX(z);
  let y = roadY(z);
  const ad = Math.abs(dx);
  if (ad > ROAD.half) y -= Math.min((ad - ROAD.half) * 0.06, 1.1);
  y -= waterDepth(x, z);
  y += detailHeight(x, z, dx);
  return y;
}

const softChunks = [];

function seedSoft(kind, x, z) {
  if (kind === "drift") {
    let h = 0.03 * Math.sin(x * 0.65) * Math.sin(z * 0.42);
    const mounds = [[68.2, 116, 0.7, 3.2], [86, 138, 0.9, 3.6], [68, 158, 0.66, 3.0], [85.5, 108, 0.55, 2.6]];
    const side = clamp((Math.abs(x - 77) - 3.2) / 3.5, 0, 1);
    for (const [mx, mz, amp, rad] of mounds) {
      const dx = x - mx;
      const dz = z - mz;
      h += amp * side * Math.exp(-(dx * dx + dz * dz) / (rad * rad));
    }
    return h;
  }
  if (kind === "pack") return 0.012 * Math.sin(x * 0.8 + z * 0.35);
  if (kind === "sand") {
    return 0.48 * Math.sin(x * 0.23 + 0.6) * Math.sin(z * 0.19 + 1.1) + 0.055 * Math.sin(x * 1.8 + z * 0.7);
  }
  if (kind === "mud") {
    const wave = 0.06 * Math.sin(x * 0.8) * Math.sin(z * 0.62 + 0.4);
    const bowl = Math.min(0, 0.05 * Math.sin(x * 0.5 + 1.7) * Math.sin(z * 0.46) - 0.015);
    return wave + bowl;
  }
  return 0;
}

function edgeFade(c, x, z) {
  const u = Math.min(x - c.x, c.x + c.w - x);
  const v = Math.min(z - c.z, c.z + c.d - z);
  return clamp(Math.min(u, v) / 1.4, 0, 1);
}

function buildSoftChunks() {
  const specs = [
    { kind: "drift", x: 66, z: 100, w: 22, d: 74, res: 0.72, color: 0xf3f6f8 },
    { kind: "pack", x: 66, z: 40, w: 22, d: 60, res: 0.9, color: 0xd5dee6 },
    { kind: "sand", x: 14, z: -16, w: 52, d: 56, res: 0.85, color: 0xc6a15a },
    { kind: "mud", x: 14, z: -44, w: 52, d: 28, res: 0.8, color: 0x4a3424 },
  ];
  for (const spec of specs) {
    const cols = Math.floor(spec.w / spec.res) + 1;
    const rows = Math.floor(spec.d / spec.res) + 1;
    const base = new Float32Array(cols * rows);
    const disp = new Float32Array(cols * rows);
    const positions = new Float32Array(cols * rows * 3);
    const colors = new Float32Array(cols * rows * 3);
    const col = new THREE.Color(spec.color);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = spec.x + i * spec.res;
        const z = spec.z + j * spec.res;
        const seeded = seedSoft(spec.kind, x, z) * edgeFade(spec, x, z);
        base[j * cols + i] = seeded;
        const y = terrainHeight(x, z) + seeded;
        const p = (j * cols + i) * 3;
        positions[p] = x;
        positions[p + 1] = y + 0.012;
        positions[p + 2] = z;
        const tint = spec.kind === "drift" || spec.kind === "pack" ? (hash01(i * 13.1 + j * 7.7) > 0.9 ? 1.15 : 0.94 + hash01(i + j * 3) * 0.08) : 0.86 + hash01(i * 5 + j) * 0.22;
        const wet = spec.kind === "mud" && seeded < -0.01 ? 0.55 : 1;
        colors[p] = col.r * tint * wet;
        colors[p + 1] = col.g * tint * wet;
        colors[p + 2] = col.b * tint * (spec.kind === "mud" && seeded < -0.01 ? 0.7 : 1);
      }
    }
    const index = [];
    for (let j = 0; j < rows - 1; j++) {
      for (let i = 0; i < cols - 1; i++) {
        const a = j * cols + i;
        index.push(a, a + cols, a + 1, a + 1, a + cols, a + cols + 1);
      }
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geom.setIndex(index);
    geom.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: spec.kind === "mud" ? 0.72 : 0.94, metalness: spec.kind === "mud" ? 0.08 : 0 });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.receiveShadow = true;
    scene.add(mesh);
    const chunk = { ...spec, cols, rows, base, disp, positions, geom, mesh, dirty: false };
    chunk.sample = (x, z) => {
      const u = (x - chunk.x) / chunk.res;
      const v = (z - chunk.z) / chunk.res;
      const i = clamp(Math.floor(u), 0, chunk.cols - 2);
      const j = clamp(Math.floor(v), 0, chunk.rows - 2);
      const tx = clamp(u - i, 0, 1);
      const tz = clamp(v - j, 0, 1);
      const at = (ii, jj) => {
        const k = jj * chunk.cols + ii;
        return chunk.base[k] + chunk.disp[k];
      };
      const h = at(i, j) * (1 - tx) * (1 - tz) + at(i + 1, j) * tx * (1 - tz) + at(i, j + 1) * (1 - tx) * tz + at(i + 1, j + 1) * tx * tz;
      return h;
    };
    softChunks.push(chunk);
  }
  const puddleMat = new THREE.MeshStandardMaterial({
    color: 0x1c2a28, roughness: 0.06, metalness: 0.35, transparent: true, opacity: 0.82, flatShading: true,
  });
  for (const [x, z, r] of [[28, -32, 1.3], [40, -24, 0.9], [52, -36, 1.1], [22, -22, 0.7]]) {
    const puddle = new THREE.Mesh(new THREE.CircleGeometry(r, 6), puddleMat);
    puddle.rotation.x = -Math.PI / 2;
    puddle.position.set(x, groundHeight(x, z) + 0.03, z);
    puddle.receiveShadow = true;
    scene.add(puddle);
  }
}

const SOFT_RECTS = [
  { x: 66, z: 100, w: 22, d: 74 },
  { x: 66, z: 40, w: 22, d: 60 },
  { x: 14, z: -16, w: 52, d: 56 },
  { x: 14, z: -44, w: 52, d: 28 },
];
function insideSoft(x, z) {
  for (const r of SOFT_RECTS) {
    if (x >= r.x && x <= r.x + r.w && z >= r.z && z <= r.z + r.d) return true;
  }
  return false;
}

function softSample(x, z) {
  for (const c of softChunks) {
    if (x < c.x || z < c.z || x > c.x + c.w || z > c.z + c.d) continue;
    return c.sample(x, z);
  }
  return 0;
}

function carveSoft(x, z, depth) {
  if (depth < 0.008) return;
  for (const c of softChunks) {
    if (x < c.x || z < c.z || x > c.x + c.w || z > c.z + c.d) continue;
    const rad = 0.55;
    const i0 = Math.max(0, Math.floor((x - rad - c.x) / c.res));
    const i1 = Math.min(c.cols - 1, Math.ceil((x + rad - c.x) / c.res));
    const j0 = Math.max(0, Math.floor((z - rad - c.z) / c.res));
    const j1 = Math.min(c.rows - 1, Math.ceil((z + rad - c.z) / c.res));
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const px = c.x + i * c.res;
        const pz = c.z + j * c.res;
        const d = Math.hypot(px - x, pz - z);
        if (d > rad) continue;
        const k = j * c.cols + i;
        const bite = -depth * (1 - d / rad) * (c.road ? 1 : edgeFade(c, px, pz));
        if (bite < c.disp[k]) {
          c.disp[k] = bite;
          const p = k * 3;
          c.positions[p + 1] = terrainHeight(px, pz) + c.base[k] + c.disp[k] + 0.012;
          c.dirty = true;
        }
      }
    }
  }
}

function clearRuts() {
  for (const c of softChunks) {
    c.disp.fill(0);
    for (let j = 0; j < c.rows; j++) {
      for (let i = 0; i < c.cols; i++) {
        const k = j * c.cols + i;
        const x = c.x + i * c.res;
        const z = c.z + j * c.res;
        c.positions[k * 3 + 1] = terrainHeight(x, z) + c.base[k] + 0.012;
      }
    }
    c.dirty = true;
  }
  flushSoft();
}

function flushSoft() {
  for (const c of softChunks) {
    if (!c.dirty) continue;
    c.geom.attributes.position.needsUpdate = true;
    c.geom.computeVertexNormals();
    c.dirty = false;
  }
}

const roadIndex = new Map();
const signTex = new Map();

function signTexture(label) {
  if (signTex.has(label)) return signTex.get(label);
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(12,14,16,0.8)";
  g.fillRect(0, 0, 256, 64);
  g.fillStyle = "#f4f7fa";
  g.font = "700 36px sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(label, 128, 34);
  const tex = new THREE.CanvasTexture(c);
  signTex.set(label, tex);
  return tex;
}

let sharedRockGeo = null;
function rockGeometry() {
  if (!sharedRockGeo) sharedRockGeo = new THREE.DodecahedronGeometry(1, 0);
  return sharedRockGeo;
}

function rockSpecs(z0, d) {
  const rocks = [];
  for (let z = z0 + 3; z < z0 + d - 2; z += 5.5) {
    if (segKind(z) !== "rocks") continue;
    const cx = roadX(z);
    const slots = [
      [-2.9, 0.1 + roadHash(ROAD.seed, Math.floor(z * 4), 3) * 0.16],
      [3.0, 0.1 + roadHash(ROAD.seed, Math.floor(z * 4), 4) * 0.16],
      [-5.7, 0.5 + roadHash(ROAD.seed, Math.floor(z * 4), 5) * 0.28],
      [5.8, 0.48 + roadHash(ROAD.seed, Math.floor(z * 4), 6) * 0.3],
    ];
    for (const [lat, h0] of slots) {
      const h = Math.min(Math.abs(lat) < 3.4 ? ROAD.maxLaneRock : 0.95, h0);
      const x = cx + lat;
      const r = Math.max(0.12, h * 0.8);
      const gy = terrainHeight(x, z);
      rocks.push({ x, z, r, cy: gy + h - r, top: h, lat, crawl: true });
    }
  }
  return rocks;
}
function chunkRocks(z0, d) { return rockSpecs(z0, d); }

function chunkRails(z0, d) {
  const rails = [];
  for (let z = z0; z < z0 + d; z += 10.5) {
    if (Math.abs(z + 5) < ROAD.plain) continue;
    if (segKind(z + 5) !== "asphalt") continue;
    const cx = roadX(z + 5);
    const y = terrainHeight(cx, z + 5);
    rails.push({ x: cx + ROAD.half + 0.15, z, y, w: 0.42, d: 10.2, h: 0.85 });
    rails.push({ x: cx - ROAD.half - 0.55, z, y, w: 0.42, d: 10.2, h: 0.85 });
  }
  return rails;
}

function makeRoadChunk(index) {
  const z0 = index * ROAD.chunk;
  const d = ROAD.chunk;
  const res = 1.2;
  let minX = Infinity;
  let maxX = -Infinity;
  for (let z = z0; z <= z0 + d; z += 3) {
    const cx = roadX(z);
    minX = Math.min(minX, cx - 16);
    maxX = Math.max(maxX, cx + 16);
  }
  const x0 = minX;
  const w = Math.max(8, maxX - minX);
  const cols = Math.floor(w / res) + 1;
  const rows = Math.floor(d / res) + 1;
  const base = new Float32Array(cols * rows);
  const disp = new Float32Array(cols * rows);
  const positions = new Float32Array(cols * rows * 3);
  const colors = new Float32Array(cols * rows * 3);
  const color = new THREE.Color();
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const x = x0 + i * res;
      const z = z0 + j * res;
      const y = terrainHeight(x, z);
      const p = (j * cols + i) * 3;
      positions[p] = x;
      positions[p + 1] = y + 0.01;
      positions[p + 2] = z;
      const surf = surfaceAt(x, z);
      const spec = CONFIG.surfaces[surf] || CONFIG.surfaces.grass;
      color.set(spec.color);
      if ((biomeAt(z) === "rain" || state.weatherMode === "rain") && (surf === "asphalt" || surf === "wet")) color.multiplyScalar(0.62);
      const edge = distToSegEdge(z);
      if (edge < 12) {
        const nz = z + (z >= 0 ? 8 : -8);
        const other = CONFIG.surfaces[surfaceAt(x, nz)] || spec;
        if (other !== spec) color.lerp(new THREE.Color(other.color), (1 - edge / 12) * 0.65);
      }
      const tint = 0.9 + hash01(i * 3.1 + j * 1.7 + index) * 0.18;
      colors[p] = color.r * tint;
      colors[p + 1] = color.g * tint;
      colors[p + 2] = color.b * tint;
    }
  }
  const indices = [];
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const a = j * cols + i;
      indices.push(a, a + cols, a + 1, a + 1, a + cols, a + cols + 1);
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(
    geom,
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.94 }),
  );
  mesh.receiveShadow = true;
  const group = new THREE.Group();
  group.add(mesh);
  const rocks = chunkRocks(z0, d);
  const rockGeo = rockGeometry();
  for (const rock of rocks) {
    const shade = 0.45 + hash01(rock.x * 2 + rock.z) * 0.35;
    const rockMesh = new THREE.Mesh(
      rockGeo,
      new THREE.MeshStandardMaterial({ color: new THREE.Color(shade, shade * 0.92, shade * 0.82), flatShading: true, roughness: 0.95 }),
    );
    rockMesh.scale.set(rock.r, rock.r * 0.8, rock.r);
    rockMesh.position.set(rock.x, rock.cy, rock.z);
    rockMesh.rotation.y = rock.x;
    rockMesh.castShadow = rock.cy + rock.r > 0.4;
    group.add(rockMesh);
  }
  const rails = chunkRails(z0, d);
  const railMat = new THREE.MeshStandardMaterial({ color: 0xc5ccd1, metalness: 0.6, roughness: 0.35, flatShading: true });
  for (const rail of rails) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(rail.w, 0.14, rail.d), railMat);
    beam.position.set(rail.x + rail.w * 0.5, (rail.y || 0) + 0.62, rail.z + rail.d * 0.5);
    group.add(beam);
  }
  const kind = segKind(z0 + d * 0.5);
  if (kind === "water") {
    const cx = roadX(z0 + d * 0.5);
    const bed = terrainHeight(cx, z0 + d * 0.5) + waterDepth(cx, z0 + d * 0.5);
    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(14, d * 0.92, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0x1c6e86, transparent: true, opacity: 0.72, roughness: 0.15, metalness: 0.15, flatShading: true }),
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(cx, bed + 0.05, z0 + d * 0.5);
    group.add(water);
  }
  if (kind === "mud" || ((biomeAt(z0 + d * 0.5) === "rain" || state.weatherMode === "rain") && (kind === "asphalt" || kind === "dirt"))) {
    const puddleMat = new THREE.MeshStandardMaterial({ color: 0x243038, roughness: 0.08, metalness: 0.25, transparent: true, opacity: 0.72, flatShading: true });
    for (let p = 0; p < 2; p++) {
      const z = z0 + 8 + p * 16;
      const cx = roadX(z) + (p === 0 ? -1.4 : 1.6);
      const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.9 + p * 0.35, 6), puddleMat);
      puddle.rotation.x = -Math.PI / 2;
      puddle.position.set(cx, terrainHeight(cx, z) + 0.04, z);
      group.add(puddle);
    }
  }
  const start = segStartZ(z0 + 2);
  if (start >= z0 && start < z0 + d && Math.abs(start) > ROAD.plain - 1) {
    const label = ROAD.names[segKind(start + 2)] || "ДОРОГА";
    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(3.2, 0.8),
      new THREE.MeshBasicMaterial({ map: signTexture(label), transparent: true }),
    );
    const cx = roadX(start);
    const sy = roadY(start);
    board.position.set(cx + ROAD.half + 1.8, sy + 1.7, start + 1.2);
    board.rotation.y = roadHeading(start) + Math.PI;
    group.add(board);
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 1.7, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x6b4428, flatShading: true }),
    );
    post.position.set(board.position.x, sy + 0.85, board.position.z);
    group.add(post);
  }
  const treeBiome = biomeAt(z0 + d * 0.5);
  for (let t = 0; t < (treeBiome === "desert" ? 0 : 5); t++) {
    const z = z0 + 4 + t * 8;
    const side = t % 2 === 0 ? 1 : -1;
    const x = roadX(z) + side * (ROAD.half + 3.5);
    if (Math.abs(x) > 80) continue;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.18, 1.3, 5),
      new THREE.MeshStandardMaterial({ color: 0x6b4428, flatShading: true }),
    );
    trunk.position.set(x, terrainHeight(x, z) + 0.65, z);
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry(0.8, 1.8, 5),
      new THREE.MeshStandardMaterial({ color: 0x2f7d34, flatShading: true }),
    );
    crown.position.set(x, trunk.position.y + 1.3, z);
    group.add(trunk);
    group.add(crown);
  }
  scene.add(group);
  const chunk = {
    road: true,
    index,
    x: x0,
    z: z0,
    w,
    d,
    res,
    cols,
    rows,
    base,
    disp,
    positions,
    geom,
    mesh,
    group,
    rocks,
    rails,
    dirty: false,
  };
  chunk.sample = (px, pz) => {
    const u = (px - chunk.x) / chunk.res;
    const v = (pz - chunk.z) / chunk.res;
    if (u < 0 || v < 0 || u > chunk.cols - 1 || v > chunk.rows - 1) return 0;
    const i = clamp(Math.floor(u), 0, chunk.cols - 2);
    const j = clamp(Math.floor(v), 0, chunk.rows - 2);
    const tx = clamp(u - i, 0, 1);
    const tz = clamp(v - j, 0, 1);
    const at = (ii, jj) => chunk.disp[jj * chunk.cols + ii];
    return at(i, j) * (1 - tx) * (1 - tz) + at(i + 1, j) * tx * (1 - tz) + at(i, j + 1) * (1 - tx) * tz + at(i + 1, j + 1) * tx * tz;
  };
  softChunks.push(chunk);
  roadIndex.set(index, chunk);
  return chunk;
}

function disposeChunk(c) {
  scene.remove(c.group);
  c.group.traverse((o) => {
    if (o.geometry && o.geometry.type !== "DodecahedronGeometry") o.geometry.dispose();
    if (o.material && !o.material.userData.shared) o.material.dispose();
  });
  const i = softChunks.indexOf(c);
  if (i >= 0) softChunks.splice(i, 1);
  roadIndex.delete(c.index);
}

function ensureRoad(z) {
  const size = ROAD.chunk;
  const a = Math.floor((z - ROAD.behind) / size);
  const b = Math.floor((z + ROAD.ahead) / size);
  const keep = new Set();
  for (let i = a; i <= b; i++) {
    keep.add(i);
    if (!roadIndex.has(i)) makeRoadChunk(i);
  }
  for (const [i, c] of roadIndex) {
    if (!keep.has(i)) disposeChunk(c);
  }
}

function rebuildAhead() {
  for (const c of [...softChunks]) {
    if (c.road && c.z > state.weatherFront - 8) disposeChunk(c);
  }
  ensureRoad(state.position.z);
}

function rebuildRoad() {
  for (const c of [...softChunks]) if (c.road) disposeChunk(c);
  ensureRoad(state.position.z);
}

function paddockDry(z) {
  // The spawn straight stays dry asphalt so a winter or rain seed cannot pin the car.
  return 1 - smoothstep(ROAD.plain * 0.42, ROAD.plain * 0.82, Math.abs(z));
}

function updateClimate() {
  const z = state.position.z;
  const blend = biomeBlend(z);
  state.biome = blend.biome;
  state.biomeNext = blend.next;
  state.biomeT = blend.t * (1 - paddockDry(z));
  const snowing = state.weatherMode === "snow" || blend.biome === "winter" || (blend.next === "winter" && blend.t > 0.4);
  const raining = !snowing && (state.weatherMode === "rain" || blend.biome === "rain" || (blend.next === "rain" && blend.t > 0.4));
  const dry = paddockDry(z);
  state.snowing = snowing && dry < 0.85;
  state.rain = raining && dry < 0.85;
  state.dust = (state.weatherMode === "desert" || blend.biome === "desert" || (blend.next === "desert" && blend.t > 0.45)) && dry < 0.85;
  state.snowCover = snowing && dry < 0.2;
  state.rainGrip = raining && dry < 0.2;
}

function setWeather(mode) {
  const allowed = ["auto", "snow", "rain", "desert", "mixed"];
  if (!allowed.includes(mode) || mode === state.weatherMode) {
    updateClimate();
    return;
  }
  state.weatherMode = mode;
  state.weatherEpoch = 0;
  state.weatherTime = 0;
  state.weatherFront = 1e9;
  clearRoad();
  rebuildRoad();
  updateClimate();
}

function setSeed(seed, opts = {}) {
  const next = (Number(seed) || 1) >>> 0;
  if (next === ROAD.seed && !opts.force) return ROAD.seed;
  ROAD.seed = next || 1;
  clearRoad();
  if (opts.rebuild !== false) rebuildRoad();
  if (opts.resetCar) reset({ x: 0, z: 4, speed: 0, yaw: 0 });
  return ROAD.seed;
}

function auditSeed(seed) {
  const saved = {
    seed: ROAD.seed,
    hi: roadHi,
    lo: roadLo,
    pts: new Map(roadPts),
    mode: state.weatherMode,
    epoch: state.weatherEpoch,
    front: state.weatherFront,
  };
  ROAD.seed = (Number(seed) || 1) >>> 0;
  clearRoad();
  state.weatherEpoch = 0;
  state.weatherFront = 1e9;
  let maxH = 0;
  let maxS = 0;
  let maxW = 0;
  let maxDc = 0;
  let maxDs = 0;
  let maxRock = 0;
  let maxSand = 0;
  let x900 = 0;
  const xs = [];
  const biomes = new Set();
  for (const mode of ["auto", "snow", "rain", "desert", "mixed"]) {
    state.weatherMode = mode;
    clearRoad();
    for (let z = ROAD.plain + 20; z <= 2600; z += 16) {
      const a = roadSample(z);
      const b = roadSample(z + 8);
      maxH = Math.max(maxH, Math.abs(Math.atan2(b.x - a.x, 8)));
      maxS = Math.max(maxS, Math.abs((b.y - a.y) / 8));
      const kind = segKind(z);
      if (kind === "water") maxW = Math.max(maxW, waterDepth(roadX(z), z));
      if (kind === "drift") {
        maxDc = Math.max(maxDc, Math.abs(detailHeight(roadX(z), z, 0)));
        maxDs = Math.max(maxDs, detailHeight(roadX(z) + 7.2, z, 7.2));
      }
      if (kind === "sand") maxSand = Math.max(maxSand, Math.abs(detailHeight(roadX(z), z, 0)));
      if (kind === "rocks") {
        for (const rock of rockSpecs(z - 2, 6)) {
          if (Math.abs(rock.lat) < 1.3) maxRock = Math.max(maxRock, rock.top);
        }
      }
      if (mode === "mixed" && z % 80 < 16) xs.push(a.x);
      if (mode === "mixed" && Math.abs(z - 900) < 12) x900 = a.x;
      if (mode === "auto" && z % 200 < 16) biomes.add(biomeAt(z));
    }
  }
  const spread = xs.length ? Math.max(...xs) - Math.min(...xs) : 0;
  ROAD.seed = saved.seed;
  roadPts.clear();
  for (const [k, v] of saved.pts) roadPts.set(k, v);
  roadHi = saved.hi;
  roadLo = saved.lo;
  state.weatherMode = saved.mode;
  state.weatherEpoch = saved.epoch;
  state.weatherFront = saved.front;
  orderCache.clear();
  return {
    seed: (Number(seed) || 1) >>> 0,
    maxAbsHeading: maxH,
    maxAbsSlope: maxS,
    maxWater: maxW,
    maxDriftCenter: maxDc,
    maxDriftSide: maxDs,
    maxLaneRock: maxRock,
    maxSand,
    xSpread: spread,
    xAt900: x900,
    biomes: [...biomes],
  };
}

function roadSpot(kind) {
  if (kind === "grass") {
    const z = 20;
    const lane = ROAD.half + 5.2;
    return { x: roadX(z) + lane, z, yaw: 0, kind: "grass", lane };
  }
  if (kind === "asphalt") return { x: 0, z: 0, yaw: 0, kind: "asphalt", lane: 0 };
  for (let z = ROAD.plain + 20; z < ROAD.plain + ROAD.seg * ROAD.cycle.length; z += 20) {
    if (segKind(z) !== kind) continue;
    return { x: roadX(z + 30), z: z + 30, yaw: roadHeading(z + 30), kind };
  }
  return { x: 0, z: 4, yaw: 0, kind: "asphalt" };
}

function rocksNear(z) {
  const list = [];
  for (const c of softChunks) {
    if (!c.rocks || z < c.z - 2 || z > c.z + c.d + 2) continue;
    for (const rock of c.rocks) list.push(rock);
  }
  return list;
}

function railsNear(z) {
  const list = [];
  for (const c of softChunks) {
    if (!c.rails || z < c.z - 2 || z > c.z + c.d + 2) continue;
    for (const rail of c.rails) list.push(rail);
  }
  return list;
}

function groundHeight(x, z) {
  return terrainHeight(x, z) + softSample(x, z);
}

function groundNormal(x, z) {
  const e = 0.35;
  const hx = groundHeight(x + e, z) - groundHeight(x - e, z);
  const hz = groundHeight(x, z + e) - groundHeight(x, z - e);
  // Cross of the two tangents points downward on flat ground, so flip it.
  const n = {
    x: -hx,
    y: 2 * e,
    z: -hz,
  };
  return normalize(n);
}

function rayRocks(origin, dir, maxDist) {
  let best = null;
  for (const rock of rocksNear(origin.z)) {
    const ocx = origin.x - rock.x;
    const ocy = origin.y - rock.cy;
    const ocz = origin.z - rock.z;
    const c = ocx * ocx + ocy * ocy + ocz * ocz - rock.r * rock.r;
    if (c < 0) {
      const nl = Math.hypot(ocx, ocy, ocz) || 1;
      return {
        distance: 0,
        point: { x: origin.x, y: origin.y, z: origin.z },
        normal: { x: ocx / nl, y: ocy / nl, z: ocz / nl },
        surface: "gravel",
      };
    }
    const b = ocx * dir.x + ocy * dir.y + ocz * dir.z;
    const disc = b * b - c;
    if (disc < 0) continue;
    const t = -b - Math.sqrt(disc);
    if (t < 0 || t > maxDist) continue;
    if (best && t >= best.distance) continue;
    const px = origin.x + dir.x * t;
    const py = origin.y + dir.y * t;
    const pz = origin.z + dir.z * t;
    const nx = px - rock.x;
    const ny = py - rock.cy;
    const nz = pz - rock.z;
    const nl = Math.hypot(nx, ny, nz) || 1;
    best = {
      distance: t,
      point: { x: px, y: py, z: pz },
      normal: { x: nx / nl, y: ny / nl, z: nz / nl },
      surface: "gravel",
    };
  }
  return best;
}

function raycast(origin, dir, maxDist) {
  const rockHit = rayRocks(origin, dir, maxDist);
  const h0 = groundHeight(origin.x, origin.z);
  if (origin.y <= h0) {
    if (rockHit && rockHit.distance <= 0) return rockHit;
    return {
      distance: 0,
      point: { x: origin.x, y: h0, z: origin.z },
      normal: groundNormal(origin.x, origin.z),
      surface: surfaceAt(origin.x, origin.z),
    };
  }
  const steps = 10;
  let lo = 0;
  let found = false;
  for (let i = 1; i <= steps; i++) {
    const t = maxDist * (i / steps);
    const p = add(origin, mul(dir, t));
    if (p.y <= groundHeight(p.x, p.z)) {
      lo = maxDist * ((i - 1) / steps);
      found = true;
      let hi = t;
      for (let k = 0; k < 8; k++) {
        const mid = (lo + hi) * 0.5;
        const pm = add(origin, mul(dir, mid));
        if (pm.y <= groundHeight(pm.x, pm.z)) hi = mid;
        else lo = mid;
      }
      const hit = add(origin, mul(dir, hi));
      hit.y = groundHeight(hit.x, hit.z);
      const groundHit = {
        distance: hi,
        point: hit,
        normal: groundNormal(hit.x, hit.z),
        surface: surfaceAt(hit.x, hit.z),
      };
      if (rockHit && rockHit.distance <= groundHit.distance) return rockHit;
      return groundHit;
    }
  }
  return rockHit;
}

const wheels = CONFIG.wheels.map((spec) => ({
  spec,
  omega: 0,
  spinAngle: 0,
  suspensionLength: CONFIG.suspension.restLength,
  compression: 0,
  inContact: false,

  centerWorld: { x: 0, y: 0, z: 0 },
  normal: { x: 0, y: 1, z: 0 },
  forward: { x: 0, y: 0, z: 1 },

  fz: 0,

const state = {
  position: { x: 0, y: 1, z: 0 },
  velocity: { x: 0, y: 0, z: 0 },
  quat: { x: 0, y: 0, z: 0, w: 1 },
  omega: { x: 0, y: 0, z: 0 },

  coolant: 0.34,

  wipers: false,
  rain: false,
  snowing: false,
  dust: false,
  snowCover: false,
  weatherMode: "auto",
  weatherTime: 0,
  weatherEpoch: 0,
  weatherFront: 1e9,
  timeScale: 1,
  biome: "mixed",
  biomeNext: "mixed",
  biomeT: 0,
  wear: 0,
