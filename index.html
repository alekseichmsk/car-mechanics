<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Car mechanics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23d3541a' width='16' height='16' rx='3'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #e8eef3;
    --amber: #ffbf3c;
    --panel: rgba(8, 10, 12, 0.82);
    --line: rgba(255, 255, 255, 0.14);
    --good: #86f0b0;
    --bad: #ff5a45;
  }
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #8ea4b4;
    color: var(--ink);
    font-family: "Segoe UI", "Avenir Next Condensed", "Arial Narrow", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; width: 100%; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud, #touch, #hint, #rotate { position: fixed; z-index: 2; }
  #hud {
    top: 0; left: 0; right: 0;
    padding:
      calc(6px + env(safe-area-inset-top, 0px))
      calc(8px + env(safe-area-inset-right, 0px))
      0
      calc(8px + env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #cluster {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
    pointer-events: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  #speedbox { min-width: 108px; display: flex; flex-direction: column; justify-content: center; }
  #speed {
    font-size: 40px;
    line-height: 0.9;
    font-weight: 750;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
  }
  #unit { font-size: 12px; letter-spacing: 0.14em; opacity: 0.75; }
  #gearbox { min-width: 116px; }
  #gear {
    font-size: 28px;
    font-weight: 750;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #rpmwrap {
    margin: 6px 0 4px;
    height: 8px;
    background: #1a2128;
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  #rpmfill { height: 100%; width: 0%; background: var(--amber); }
  #rpmfill.hot { background: var(--bad); }
  #rpm { font-size: 12px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; opacity: 0.85; }
  #modes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: auto; }
  #modes button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    min-height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  #modes button[data-drive]::before { content: attr(data-drive); }
  #tc::before { content: "TC"; }
  #forces svg, #reset svg { width: 18px; height: 18px; }
  #wheels {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    max-width: 720px;
    pointer-events: none;
  }
  .wcard { padding: 6px 8px; }
  .wtop, .wmeta { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .wid { font-weight: 750; letter-spacing: 0.06em; }
  .wtag { font-size: 11px; font-weight: 750; letter-spacing: 0.08em; color: var(--bad); min-height: 1em; }
  .wsurf { font-size: 12px; opacity: 0.9; margin: 2px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .wcard.driven .wid { color: var(--amber); }
  .wcard.hot { outline: 1px solid var(--bad); }
  .meter { height: 7px; background: #1a2128; border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .meter > div { height: 100%; width: 0%; background: var(--good); }
  .meter.susp > div { background: #7eb6ff; }
  .meter-label { font-size: 10px; opacity: 0.65; letter-spacing: 0.08em; }
  #legend { display: flex; flex-wrap: wrap; gap: 5px; max-width: 640px; pointer-events: none; }
  .swatch {
    display: flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 99px; padding: 3px 8px 3px 4px;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .swatch i { width: 12px; height: 12px; border-radius: 99px; display: block; }
  #hint::before { content: "WASD or arrows · Space handbrake · 1 FWD · 2 RWD · 3 AWD · F forces · R reset"; }
  #hint {
    left: calc(8px + env(safe-area-inset-left, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(var(--pad-h, 108px) + 8px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #f4f7fa;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #rotate::before { content: "Rotate to landscape"; }
  #rotate {
    display: none;
    top: env(safe-area-inset-top, 0px);
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    height: 32px;
    align-items: center;
    justify-content: center;
    background: rgba(8, 10, 12, 0.9);
    color: var(--amber);
    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #touch {
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    padding:
      0
      calc(12px + env(safe-area-inset-right, 0px))
      calc(10px + env(safe-area-inset-bottom, 0px))
      calc(12px + env(safe-area-inset-left, 0px));
    pointer-events: none;
    z-index: 3;
  }
  .steer, .pedals { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  .steer { flex-direction: column; align-items: flex-start; }
  .steer-btns { display: flex; gap: 8px; }
  #wheel {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: rgba(8, 10, 12, 0.72);
    color: #e8eef3;
    border: 1px solid var(--line);
    touch-action: none;
    pointer-events: auto;
  }
  #wheel-rotor { width: 100%; height: 100%; }
  #wheel svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  #steerL, #steerR { width: 72px; height: 72px; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 18px;
    padding: 0;
    font: inherit;
    font-weight: 750;
    letter-spacing: 0.04em;
    touch-action: none;
  }
  button svg {
    width: 44px;
    height: 44px;
    display: block;
    pointer-events: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  button:active, button.held, button.on { background: var(--amber); color: #1c1404; border-color: transparent; }
  #steerL, #steerR, #brake, #handbrake, #gas, #forces, #reset {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #brake, #handbrake {
    width: 92px;
    height: 92px;
  }
  #steerL, #steerR { width: 72px; height: 72px; }
  #gas {
    width: 108px;
    height: 108px;
    font-size: 18px;
    background: #d3541a;
    color: white;
    border-color: transparent;
  }
  #gas:active, #gas.held { background: #ff8a4a; color: white; }
  #brake { background: #243140; font-size: 13px; }
  #handbrake { background: #6e2424; font-size: 16px; }
  #err {
    display: none;
    position: fixed;
    z-index: 5;
    left: 10px; right: 10px; top: 40%;
    background: #3a1010;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
  }
  /* iPhone 12 Pro Max landscape is 926x428. Keep the HUD to one band. */
  @media (orientation: landscape) and (max-height: 500px) {
    #legend, #hint, .meter-label { display: none; }
    #speed { font-size: 28px; }
    #gear { font-size: 22px; }
    #unit, #rpm { font-size: 10px; }
    #rpmwrap { margin: 3px 0 2px; }
    .panel { padding: 4px 8px; }
    .wcard { padding: 3px 6px; }
    .wsurf { font-size: 10px; margin: 0 0 2px; }
    #hud { gap: 4px; }
    #cluster { flex-wrap: nowrap; align-items: center; }
    #modes button { min-height: 30px; padding: 0 8px; }
  }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    #hud {
      top: calc(32px + env(safe-area-inset-top, 0px));
      padding-top: 6px;
    }
    #legend, #hint, .meter-label { display: none; }
    .wcard { padding: 4px 6px; }
    .wsurf { font-size: 10px; margin: 0 0 2px; }
    .pedals { flex-direction: column; align-items: flex-end; }
  }
  @media (min-width: 1100px) and (min-height: 700px) {
    #speed { font-size: 52px; }
    #legend { display: flex; }
    #hint { display: block; }
  }
</style>

<body>
<canvas id="view"></canvas>
<div id="rotate" role="status"></div>
<div id="hud">
  <div id="cluster">
    <div id="speedbox" class="panel">
      <div id="speed">0</div>
      <div id="unit">KM/H</div>
    </div>
    <div id="gearbox" class="panel">
      <div id="gear">1</div>
      <div id="rpmwrap"><div id="rpmfill"></div></div>
      <div id="rpm">900 RPM</div>
    </div>
    <div id="modes" class="panel">
      <button type="button" data-drive="FWD" aria-label="Front-wheel drive"></button>
      <button type="button" data-drive="RWD" class="on" aria-label="Rear-wheel drive"></button>
      <button type="button" data-drive="AWD" aria-label="All-wheel drive"></button>
      <button type="button" id="tc" aria-label="Traction control"></button>
      <button type="button" id="forces" aria-label="Force vectors">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V7"/><path d="M8 11l4-5 4 5"/><path d="M5 15l4 4"/><path d="M19 15l-4 4"/></svg>
      </button>
      <button type="button" id="reset" aria-label="Reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v6h-6"/></svg>
      </button>
    </div>
  </div>
  <div id="wheels"></div>
  <div id="legend"></div>
</div>
<p id="hint"></p>
<div id="touch">
  <div class="steer">
    <div id="wheel" aria-label="Steering wheel" role="slider">
      <div id="wheel-rotor">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="10"/>
          <circle cx="50" cy="50" r="8" fill="currentColor"/>
          <path d="M50 18 V50 M18 62 L50 50 L82 62" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <circle cx="50" cy="16" r="5" fill="#ffbf3c"/>
        </svg>
      </div>
    </div>
    <div class="steer-btns">
    <button type="button" id="steerL" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <button type="button" id="steerR" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg></button>
    </div>
  </div>
  <div class="pedals">
    <button type="button" id="handbrake" aria-label="Handbrake"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8"/><path d="M12 20V9"/><circle cx="12" cy="6.2" r="2.2"/></svg></button>
    <button type="button" id="brake" aria-label="Brake"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="gas" aria-label="Gas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/></svg></button>
  </div>
</div>
<div id="err"></div>
<script type="module" id="app">
import * as THREE from "three";

/**
 * Raycast car.
 * All tunable physics numbers live in CONFIG.
 * stepPhysics(dt) is a fixed step and does not touch Three.js.
 * The renderer only reads state.
 *
 * Body axes: +X right, +Y up, +Z forward. Origin at the center of mass.
 * Units: metres, kilograms, seconds, Newtons.
 */

const CONFIG = {
  physics: {
    fixedDt: 1 / 120,
    maxSubsteps: 8,
    maxFrame: 0.05,
    gravity: 9.81,
  },
  spawn: { x: 0, z: 4 },
  chassis: {
    mass: 1250,
    // Diagonal inertia about the COM, body axes: pitch (X), yaw (Y), roll (Z).
    inertia: { x: 2050, y: 2350, z: 640 },
    linearDamping: 0,
    angularDamping: 0.05,
    scrapeStiffness: 70000,
    scrapeDamping: 8000,
    scrapeCap: 35000,
    // Underside and roof sample points. A point below the heightfield is pushed out.
    samples: [
      { x: -0.62, y: -0.18, z: 1.75 },
      { x: 0.62, y: -0.18, z: 1.75 },
      { x: -0.62, y: -0.18, z: -1.75 },
      { x: 0.62, y: -0.18, z: -1.75 },
      { x: 0, y: -0.18, z: 0.45 },
      { x: 0, y: -0.18, z: -0.55 },
      { x: 0, y: 0.64, z: 0.2 },
      { x: 0, y: 0.64, z: -0.3 },
    ],
    aero: { rho: 1.22, cd: 0.34, area: 2.15 },
  },
  suspension: {
    restLength: 0.34,
    maxCompression: 0.2,
    stiffness: 44000,
    dampingBump: 4300,
    dampingRebound: 5200,
    antiRoll: 9000,
    maxForce: 20000,
    bumpStop: 160000,
  },
  wheels: [
    { id: "FL", axle: "front", x: -0.82, y: 0.02, z: 1.32, steer: true, radius: 0.34, width: 0.22 },
    { id: "FR", axle: "front", x: 0.82, y: 0.02, z: 1.32, steer: true, radius: 0.34, width: 0.22 },
    { id: "RL", axle: "rear", x: -0.82, y: 0.02, z: -1.32, steer: false, radius: 0.34, width: 0.22 },
    { id: "RR", axle: "rear", x: 0.82, y: 0.02, z: -1.32, steer: false, radius: 0.34, width: 0.22 },
  ],
  wheel: { inertia: 1.2, spinDrag: 3.5 },
  tire: {
    // Pacejka magic formula, odd in slip. Peak of the shape is 1, then scaled by mu * Fz.
    longitudinal: { B: 10.2, C: 1.52, E: 0.97 },
    lateral: { B: 7.6, C: 1.48, E: 0.97 },
    loadSensitivity: 0.14,
    relaxation: 0.42,
    kappaFloor: 1.15,
    alphaFloor: 0.7,
    // Tire spring in series with the suspension. Squash = F / verticalStiffness.
    verticalStiffness: 160000,
    maxSquashFraction: 0.2,
    flexStiffness: 55000,
    flexTime: 0.09,
  },
  brake: { frontTorque: 1650, rearTorque: 1150, handbrakeTorque: 4200 },
  steer: { maxAngle: 0.5, rate: 2.7, returnRate: 3.4, speedFade: 0.4, fadeSpeed: 34, wheelLock: 1.15 },
  engine: {
    idleRpm: 900,
    maxRpm: 7000,
    limiterRpm: 6750,
    inertia: 0.28,
    idleGain: 0.22,
    brakeNm: 65,
    torqueCurve: [
      { rpm: 800, nm: 145 },
      { rpm: 1600, nm: 230 },
      { rpm: 3000, nm: 285 },
      { rpm: 4400, nm: 300 },
      { rpm: 5600, nm: 275 },
      { rpm: 6750, nm: 200 },
    ],
  },
  gearbox: {
    gears: [3.1, 2.05, 1.5, 1.15, 0.9],
    reverse: 3.2,
    finalDrive: 3.45,
    efficiency: 0.9,
    upRpm: 6250,
    downRpm: 3000,
    shiftTime: 0.16,
    shiftCooldown: 0.6,
    wheelspinSlip: 0.5,
    wheelspinSpeed: 8,
  },
  clutch: { maxTorque: 360, idleCap: 5, idleThrottle: 0.1, idleRpmFactor: 1.08 },
  // Light traction control. Off by default so loose surfaces can still spin a wheel.
  tc: { slip: 0.16, gain: 2.5, min: 0.42 },
  // Axle share of torque. Each wheel on that axle gets an equal part. Shares sum to 1.
  drive: {
    defaultMode: "RWD",
    split: {
      FWD: { front: 1, rear: 0 },
      RWD: { front: 0, rear: 1 },
      AWD: { front: 0.4, rear: 0.6 },
    },
  },
  // mu is peak friction. lng/lat are Pacejka shapes: C near 1.2 keeps force high past the peak
  // (progressive slide); C near 1.55 lets it fall off. sink is 1/s, drag = sink * Fz * speed.
  surfaces: {
    asphalt: { mu: 1.08, rolling: 0.011, sink: 0, lng: { B: 12.2, C: 1.62, E: 0.97 }, lat: { B: 9.4, C: 1.58, E: 0.97 }, color: "#4a4f56" },
    wet: { mu: 0.68, rolling: 0.016, sink: 0, lng: { B: 8.6, C: 1.4, E: 0.97 }, lat: { B: 6.2, C: 1.34, E: 0.97 }, color: "#3a4a5c" },
    dirt: { mu: 0.66, rolling: 0.028, sink: 0.006, lng: { B: 7.4, C: 1.28, E: 0.95 }, lat: { B: 5.2, C: 1.24, E: 0.95 }, color: "#8a5a30" },
    grass: { mu: 0.58, rolling: 0.03, sink: 0.0075, lng: { B: 6.6, C: 1.22, E: 0.95 }, lat: { B: 4.6, C: 1.18, E: 0.95 }, color: "#3c7a36" },
    sand: { mu: 0.55, rolling: 0.035, sink: 0.008, loose: true, slipGain: 0.32, recover: 0.3, gripLoss: 0.5, hDrag: 0.04, spinDamp: 650, lng: { B: 6.0, C: 1.2, E: 0.96 }, lat: { B: 4.4, C: 1.16, E: 0.96 }, color: "#c6a15a" },
    snow: { mu: 0.3, rolling: 0.018, sink: 0.004, loose: true, slipGain: 0.7, recover: 0.42, gripLoss: 0.72, hDrag: 0.065, spinDamp: 1200, lng: { B: 5.2, C: 1.18, E: 0.96 }, lat: { B: 4.0, C: 1.14, E: 0.96 }, color: "#e7eef3" },
    mud: { mu: 0.4, rolling: 0.032, sink: 0.006, loose: true, slipGain: 0.5, recover: 0.32, gripLoss: 0.65, hDrag: 0.08, spinDamp: 1400, lng: { B: 5.6, C: 1.2, E: 0.95 }, lat: { B: 4.2, C: 1.16, E: 0.95 }, color: "#4a3424" },
    ice: { mu: 0.1, rolling: 0.005, sink: 0, lng: { B: 5.5, C: 1.32, E: 0.97 }, lat: { B: 4.0, C: 1.28, E: 0.97 }, color: "#d5e7f0" },
  },
  track: {
    defaultSurface: "grass",
    blend: 2.6,
    mesh: { minX: -102, maxX: 112, minZ: -40, maxZ: 420, res: 2.5 },
    // First matching rectangle wins. x,z is the min corner. Long lanes so each surface can be driven.
    zones: [
      { surface: "snow", x: -98, z: -40, w: 18, d: 420, mark: true },
      { surface: "sand", x: -64, z: -40, w: 20, d: 420, mark: true },
      { surface: "dirt", x: 22, z: -40, w: 18, d: 420, mark: true },
      { surface: "wet", x: 44, z: -40, w: 16, d: 420, mark: true },
      { surface: "ice", x: 64, z: -40, w: 16, d: 420, mark: true },
      { surface: "mud", x: 84, z: -40, w: 18, d: 420, mark: true },
      { surface: "wet", x: -9, z: 248, w: 18, d: 70, mark: true },
      { surface: "ice", x: -9, z: 168, w: 18, d: 60, mark: true },
      { surface: "asphalt", x: -9, z: -40, w: 18, d: 440 },
    ],
    features: [
      { type: "bump", x: -10, z: 62, w: 20, d: 3.2, height: 0.16 },
      { type: "whoops", x: -10, z: 82, w: 20, d: 32, amp: 0.28, cycles: 4 },
      { type: "ramp", x: -10, z: 128, w: 20, d: 18, height: 1.7 },
    ],
    labels: [
      { text: "ASPHALT", x: 14, z: 28, color: "#d7dde3" },
      { text: "BUMP", x: 14, z: 62, color: "#ffbf3c" },
      { text: "WHOOPS", x: 14, z: 98, color: "#ffbf3c" },
      { text: "RAMP", x: 14, z: 136, color: "#ffbf3c" },
      { text: "ICE", x: 14, z: 184, color: "#e7f4fb" },
      { text: "WET", x: 14, z: 232, color: "#b7d4ea" },
      { text: "SAND", x: -54, z: 18, color: "#f0ddb0" },
      { text: "DIRT", x: 31, z: 18, color: "#f0c49a" },
      { text: "WET LANE", x: 52, z: 18, color: "#b7d4ea" },

// ---------------------------------------------------------------------------
// Math. Plain objects so the step can be ported without Three.js.
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function mul(a, s) { return { x: a.x * s, y: a.y * s, z: a.z * s }; }
function cross(a, b) {
  return {
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x,
  };
}
function vecLen(a) { return Math.hypot(a.x, a.y, a.z); }
function normalize(a) {
  const l = vecLen(a) || 1;
  return { x: a.x / l, y: a.y / l, z: a.z / l };
}
function quatMul(a, b) {
  return {
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
  };
}
function quatNormalize(q) {
  const l = Math.hypot(q.x, q.y, q.z, q.w) || 1;
  q.x /= l; q.y /= l; q.z /= l; q.w /= l;
  return q;
}
function quatFromAxisAngle(axis, angle) {
  const n = normalize(axis);
  const h = angle * 0.5;
  const s = Math.sin(h);
  return { x: n.x * s, y: n.y * s, z: n.z * s, w: Math.cos(h) };
}
function rotateVec(q, v) {
  const p = { x: v.x, y: v.y, z: v.z, w: 0 };
  const qi = { x: -q.x, y: -q.y, z: -q.z, w: q.w };
  const r = quatMul(quatMul(q, p), qi);
  return { x: r.x, y: r.y, z: r.z };
}
function quatToMat3(q) {
  const x = q.x, y = q.y, z = q.z, w = q.w;
  const x2 = x + x, y2 = y + y, z2 = z + z;
  const xx = x * x2, xy = x * y2, xz = x * z2;
  const yy = y * y2, yz = y * z2, zz = z * z2;
  const wx = w * x2, wy = w * y2, wz = w * z2;
  return [
    1 - (yy + zz), xy - wz, xz + wy,
    xy + wz, 1 - (xx + zz), yz - wx,
    xz - wy, yz + wx, 1 - (xx + yy),
  ];
}
function mulMat(a, b) {
  const c = new Array(9);
  for (let r = 0; r < 3; r++) {
    for (let col = 0; col < 3; col++) {
      c[r * 3 + col] =
        a[r * 3] * b[col] +
        a[r * 3 + 1] * b[3 + col] +
        a[r * 3 + 2] * b[6 + col];
    }
  }
  return c;
}
function transpose(m) {
  return [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
}
function mulMatVec(m, v) {
  return {
    x: m[0] * v.x + m[1] * v.y + m[2] * v.z,
    y: m[3] * v.x + m[4] * v.y + m[5] * v.z,
    z: m[6] * v.x + m[7] * v.y + m[8] * v.z,
  };
}
function invertMat3(m) {
  const a = m[0], b = m[1], c = m[2];
  const d = m[3], e = m[4], f = m[5];
  const g = m[6], h = m[7], i = m[8];
  const A = e * i - f * h;
  const B = f * g - d * i;
  const C = d * h - e * g;
  const D = c * h - b * i;
  const E = a * i - c * g;
  const F = b * g - a * h;
  const G = b * f - c * e;
  const H = c * d - a * f;
  const I = a * e - b * d;
  const det = a * A + b * B + c * C;
  const inv = 1 / det;
  return [A * inv, D * inv, G * inv, B * inv, E * inv, H * inv, C * inv, F * inv, I * inv];
}
function magic(slip, shape) {
  const bx = shape.B * slip;
  return Math.sin(shape.C * Math.atan(bx - shape.E * (bx - Math.atan(bx))));
}
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0 || 1), 0, 1);
  return t * t * (3 - 2 * t);
}

function assertMath() {
  const q = quatFromAxisAngle({ x: 0, y: 1, z: 0 }, Math.PI / 2);
  const v = rotateVec(q, { x: 0, y: 0, z: 1 });
  if (Math.abs(v.x - 1) > 1e-6 || Math.abs(v.y) > 1e-6 || Math.abs(v.z) > 1e-6) {
    throw new Error("quaternion rotate failed");
  }
  const R = quatToMat3(q);
  const vr = mulMatVec(R, { x: 0, y: 0, z: 1 });
  if (Math.abs(vr.x - v.x) > 1e-6 || Math.abs(vr.z - v.z) > 1e-6) {
    throw new Error("quat matrix does not match rotate");
  }
  const I = [4, 1, 0.2, 1, 5, 0.3, 0.2, 0.3, 6];
  const P = mulMat(I, invertMat3(I));
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const expect = r === c ? 1 : 0;
      if (Math.abs(P[r * 3 + c] - expect) > 1e-6) throw new Error("mat3 inverse failed");
    }
  }
  const up = cross({ x: 1, y: 0, z: 0 }, { x: 0, y: 1, z: 0 });
  if (Math.abs(up.z - 1) > 1e-9) throw new Error("cross product failed");
}

// ---------------------------------------------------------------------------
// Terrain. Height and grip are pure functions of x,z — the mesh only draws them.
// ---------------------------------------------------------------------------

function surfaceAt(x, z) {
  for (const zone of CONFIG.track.zones) {
    if (x >= zone.x && x <= zone.x + zone.w && z >= zone.z && z <= zone.z + zone.d) return zone.surface;
  }
  return CONFIG.track.defaultSurface;
}

// Blend grip a couple of metres across a zone edge so the car doesn't hit a friction cliff.
function surfaceParams(x, z) {
  const radius = CONFIG.track.blend;
  const samples = [[0, 0, 3], [radius, 0, 1], [-radius, 0, 1], [0, radius, 1], [0, -radius, 1]];
  let wsum = 0;
  const acc = { mu: 0, rolling: 0, sink: 0, lB: 0, lC: 0, lE: 0, aB: 0, aC: 0, aE: 0 };
  for (const [dx, dz, w] of samples) {
    const s = CONFIG.surfaces[surfaceAt(x + dx, z + dz)] || CONFIG.surfaces.grass;
    acc.mu += s.mu * w;
    acc.rolling += s.rolling * w;
    acc.sink += s.sink * w;
    acc.lB += s.lng.B * w;
    acc.lC += s.lng.C * w;
    acc.lE += s.lng.E * w;
    acc.aB += s.lat.B * w;
    acc.aC += s.lat.C * w;
    acc.aE += s.lat.E * w;
    wsum += w;
  }
  const k = 1 / wsum;
  return {
    mu: acc.mu * k,
    rolling: acc.rolling * k,
    sink: acc.sink * k,
    lng: { B: acc.lB * k, C: acc.lC * k, E: acc.lE * k },
    lat: { B: acc.aB * k, C: acc.aC * k, E: acc.aE * k },
  };
}

function featureHeight(x, z, f) {
  const u = (x - f.x) / f.w;
  const v = (z - f.z) / f.d;
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  if (f.type === "whoops") {
    const edge = smoothstep(0, 0.1, u) * smoothstep(1, 0.9, u) * smoothstep(0, 0.08, v) * smoothstep(1, 0.92, v);
    return edge * f.amp * (0.5 - 0.5 * Math.cos(v * f.cycles * TAU));
  }
  if (f.type === "bump") {
    const edge = smoothstep(0, 0.15, u) * smoothstep(1, 0.85, u);
    return edge * f.height * Math.sin(v * Math.PI);
  }
  if (f.type === "ramp") {
    const side = smoothstep(0, 0.08, u) * smoothstep(1, 0.92, u);
    const profile = v < 0.62 ? smoothstep(0, 1, v / 0.62) : 1 - smoothstep(0, 1, (v - 0.62) / 0.38);
    return side * f.height * profile;
  }
  return 0;
}

function groundHeight(x, z) {
  let h = 0;
  for (const f of CONFIG.track.features) h += featureHeight(x, z, f);
  return h;
}

function groundNormal(x, z) {
  const e = 0.35;
  const hx = groundHeight(x + e, z) - groundHeight(x - e, z);
  const hz = groundHeight(x, z + e) - groundHeight(x, z - e);
  // Cross of the two tangents points downward on flat ground, so flip it.
  const n = {
    x: -hx,
    y: 2 * e,
    z: -hz,
  };
  return normalize(n);
}

function raycast(origin, dir, maxDist) {
  const h0 = groundHeight(origin.x, origin.z);
  if (origin.y <= h0) {
    return {
      distance: 0,
      point: { x: origin.x, y: h0, z: origin.z },
      normal: groundNormal(origin.x, origin.z),
      surface: surfaceAt(origin.x, origin.z),
    };
  }
  const steps = 10;
  let lo = 0;
  let found = false;
  for (let i = 1; i <= steps; i++) {
    const t = maxDist * (i / steps);
    const p = add(origin, mul(dir, t));
    if (p.y <= groundHeight(p.x, p.z)) {
      lo = maxDist * ((i - 1) / steps);
      found = true;
      let hi = t;
      for (let k = 0; k < 8; k++) {
        const mid = (lo + hi) * 0.5;
        const pm = add(origin, mul(dir, mid));
        if (pm.y <= groundHeight(pm.x, pm.z)) hi = mid;
        else lo = mid;
      }
      const hit = add(origin, mul(dir, hi));
      hit.y = groundHeight(hit.x, hit.z);
      return {
        distance: hi,
        point: hit,
        normal: groundNormal(hit.x, hit.z),
        surface: surfaceAt(hit.x, hit.z),
      };
    }
  }
  if (!found) return null;
  return null;
}

// ---------------------------------------------------------------------------
// Vehicle state
// ---------------------------------------------------------------------------

const wheels = CONFIG.wheels.map((spec) => ({
  spec,
  omega: 0,
  spinAngle: 0,
  suspensionLength: CONFIG.suspension.restLength,
  compression: 0,
  inContact: false,
  contact: { x: 0, y: 0, z: 0 },
  centerWorld: { x: 0, y: 0, z: 0 },
  normal: { x: 0, y: 1, z: 0 },
  forward: { x: 0, y: 0, z: 1 },
  right: { x: 1, y: 0, z: 0 },
  surface: "asphalt",
  fz: 0,
  fx: 0,
  fy: 0,
  slipRatio: 0,
  slipAngle: 0,
  driveTorque: 0,
  vLong: 0,
  vLat: 0,
  steerAngle: 0,
  skidAcc: 0,
  sinkDepth: 0,
  tireSquash: 0,
  latFlex: 0,
  rutAcc: 0,
}));

const state = {
  position: { x: 0, y: 1, z: 0 },
  velocity: { x: 0, y: 0, z: 0 },
  quat: { x: 0, y: 0, z: 0, w: 1 },
  omega: { x: 0, y: 0, z: 0 },
  force: { x: 0, y: 0, z: 0 },
  torque: { x: 0, y: 0, z: 0 },
  gear: 1,
  shiftTimer: 0,
  shiftCooldown: 0,
  reverseHold: 0,
  engineOmega: 0,
  steer: 0,
  driveMode: CONFIG.drive.defaultMode,
  tc: false,
  debug: false,
  time: 0,
  tick: 0,
  blewUp: false,
  minUp: 1,
};

const input = { throttle: 0, brake: 0, steer: 0, handbrake: 0 };
let scripted = null;
const keys = new Set();
const touch = { throttle: 0, brake: 0, steerL: 0, steerR: 0, handbrake: 0 };
const steerUi = { angle: 0, dragging: false, last: 0 };

function staticCompression() {
  const fz = (CONFIG.chassis.mass * CONFIG.physics.gravity) / CONFIG.wheels.length;
  return clamp(fz / CONFIG.suspension.stiffness, 0, CONFIG.suspension.maxCompression * 0.8);
}

function rideHeight() {
  const w = CONFIG.wheels[0];
  const length = CONFIG.suspension.restLength - staticCompression();
  return length + w.radius - w.y;
}

function localToWorld(p) {
  return add(state.position, rotateVec(state.quat, p));
}
function worldToLocal(p) {
  return rotateVec({ x: -state.quat.x, y: -state.quat.y, z: -state.quat.z, w: state.quat.w }, sub(p, state.position));
}
function velocityAt(point) {
  return add(state.velocity, cross(state.omega, sub(point, state.position)));
}
function applyForce(point, f) {
  state.force.x += f.x;
  state.force.y += f.y;
  state.force.z += f.z;
  const t = cross(sub(point, state.position), f);
  state.torque.x += t.x;
  state.torque.y += t.y;
  state.torque.z += t.z;
}

function wheelbase() {
  const f = CONFIG.wheels.find((w) => w.axle === "front");
  const r = CONFIG.wheels.find((w) => w.axle === "rear");
  return f.z - r.z;
}
function trackWidth() {
  const l = CONFIG.wheels.find((w) => w.id === "FL");
  const r = CONFIG.wheels.find((w) => w.id === "FR");
  return r.x - l.x;
}

function reset(opts = {}) {
  const y = rideHeight();
  state.position = {
    x: opts.x ?? CONFIG.spawn.x,
    y: (opts.y ?? y) + (opts.drop ?? 0),
    z: opts.z ?? CONFIG.spawn.z,
  };
  const yaw = opts.yaw ?? 0;
  state.quat = quatFromAxisAngle({ x: 0, y: 1, z: 0 }, yaw);
  const fwd = rotateVec(state.quat, { x: 0, y: 0, z: 1 });
  const speed = opts.speed ?? 0;
  state.velocity = { x: fwd.x * speed, y: 0, z: fwd.z * speed };
  state.omega = { x: 0, y: 0, z: 0 };
  state.force = { x: 0, y: 0, z: 0 };
  state.torque = { x: 0, y: 0, z: 0 };
  state.gear = 1;
  state.shiftTimer = 0;
  state.shiftCooldown = 0;
  state.reverseHold = 0;
  state.engineOmega = (CONFIG.engine.idleRpm * TAU) / 60;
  state.steer = 0;
  steerUi.angle = 0;
  steerUi.dragging = false;
  state.time = 0;
  state.tick = 0;
  state.blewUp = false;
  state.minUp = 1;
  const comp = staticCompression();
  for (const w of wheels) {
    w.omega = speed / w.spec.radius;
    w.spinAngle = 0;
    w.suspensionLength = CONFIG.suspension.restLength - comp;
    w.compression = comp;
    w.fx = 0;
    w.fy = 0;
    w.fz = 0;
    w.slipRatio = 0;
    w.slipAngle = 0;
    w.driveTorque = 0;
    w.skidAcc = 0;
    w.rutAcc = 0;
    w.sinkDepth = 0;
    w.tireSquash = 0;
    w.latFlex = 0;
    w.inContact = true;
    w.surface = surfaceAt(state.position.x, state.position.z);
    w.steerAngle = 0;
  }
  clearEffects();
  snapCamera();
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------

function readInput() {
  if (scripted) {
    input.throttle = scripted.throttle || 0;
    input.brake = scripted.brake || 0;
    input.steer = scripted.steer || 0;
    input.handbrake = scripted.handbrake || 0;
    return;
  }
  const keyT = keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0;
  const keyB = keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0;
  const keyL = keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0;
  const keyR = keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0;
  const keyH = keys.has("Space") ? 1 : 0;
  input.throttle = Math.max(keyT, touch.throttle);
  input.brake = Math.max(keyB, touch.brake);
  input.handbrake = Math.max(keyH, touch.handbrake);
  const buttons = touch.steerR - touch.steerL;
  if (steerUi.dragging) input.steer = clamp(steerUi.angle / CONFIG.steer.wheelLock, -1, 1);
  else input.steer = clamp((keyR - keyL) + buttons, -1, 1);
}

// In reverse the brake pedal is the throttle and the gas pedal slows you.
function pedals() {
  if (state.gear < 0) return { throttle: input.brake, brake: input.throttle };
  if (input.brake > 0.05) return { throttle: 0, brake: input.brake };
  return { throttle: input.throttle, brake: 0 };
}

function updateSteer(dt) {
  if (!steerUi.dragging && !scripted) {
    const target = input.steer * CONFIG.steer.wheelLock;
    const maxStep = 3.2 * dt;
    steerUi.angle += clamp(target - steerUi.angle, -maxStep, maxStep);
  }
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  const fade = lerp(1, CONFIG.steer.speedFade, clamp(speed / CONFIG.steer.fadeSpeed, 0, 1));
  const target = input.steer * CONFIG.steer.maxAngle * fade;
  const rate = input.steer === 0 ? CONFIG.steer.returnRate : CONFIG.steer.rate;
  const maxStep = rate * dt;
  state.steer += clamp(target - state.steer, -maxStep, maxStep);
  const L = wheelbase();
  const T = trackWidth();
  for (const w of wheels) {
    if (!w.spec.steer || Math.abs(state.steer) < 1e-5) {
      w.steerAngle = w.spec.steer ? state.steer : 0;
      continue;
    }
    const R = L / Math.tan(state.steer);
    const side = Math.sign(w.spec.x) || 1;
    const Rw = R - side * (T * 0.5);
    w.steerAngle = Math.abs(Rw) < 0.35 ? state.steer : Math.atan(L / Rw);
  }
}

function updateReverse(dt) {
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  if (state.gear > 0 && input.brake > 0.65 && input.throttle < 0.05 && speed < 0.7) {
    state.reverseHold += dt;
    if (state.reverseHold > 0.22) {
      state.gear = -1;
      state.shiftTimer = 0.12;
      state.reverseHold = 0;
    }
  } else {
    state.reverseHold = 0;
  }
  if (state.gear < 0 && input.throttle > 0.2) {
    state.gear = 1;
    state.shiftTimer = 0.12;
  }
}

// ---------------------------------------------------------------------------
// Physics step
// ---------------------------------------------------------------------------

function castSuspension() {
  const down = normalize(rotateVec(state.quat, { x: 0, y: -1, z: 0 }));
  const rayLen = CONFIG.suspension.restLength + CONFIG.wheels[0].radius + 0.08;
  for (const w of wheels) {
    const origin = localToWorld({ x: w.spec.x, y: w.spec.y, z: w.spec.z });
    const hit = raycast(origin, down, rayLen);
    w.centerWorld = localToWorld({
      x: w.spec.x,
      y: w.spec.y - w.suspensionLength,
      z: w.spec.z,
    });
    if (!hit) {
      w.inContact = false;
      w.suspensionLength = CONFIG.suspension.restLength;
      w.compression = 0;
      w.tireSquash = 0;
      w.fz = 0;
      w.surface = surfaceAt(origin.x, origin.z);
      w.normal = { x: 0, y: 1, z: 0 };
      w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });
      continue;
    }
    const radius = w.spec.radius;
    const kS = CONFIG.suspension.stiffness;
    const kT = CONFIG.tire.verticalStiffness;
    const defl = CONFIG.suspension.restLength + radius - hit.distance;
    if (defl <= 1e-4) {
      w.inContact = false;
      w.suspensionLength = CONFIG.suspension.restLength;
      w.compression = 0;
      w.tireSquash = 0;
      w.fz = 0;
      w.surface = hit.surface;
      w.normal = hit.normal;
      w.contact = hit.point;
      w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });
      continue;
    }
    // Series springs: the softer suspension takes most of the travel, the tire squashes a little.
    let xSusp = (kT / (kS + kT)) * defl;
    let xTire = (kS / (kS + kT)) * defl;
    let bump = 0;
    if (xSusp > CONFIG.suspension.maxCompression) {
      bump = (xSusp - CONFIG.suspension.maxCompression) * CONFIG.suspension.bumpStop;
      xSusp = CONFIG.suspension.maxCompression;
    }
    xTire = clamp(xTire, 0, radius * CONFIG.tire.maxSquashFraction);
    w.tireSquash = xTire;
    w.inContact = true;
    w.suspensionLength = CONFIG.suspension.restLength - xSusp;
    w.compression = xSusp;
    w.contact = hit.point;
    w.normal = hit.normal;
    w.surface = hit.surface;
    w.centerWorld = localToWorld({ x: w.spec.x, y: w.spec.y - w.suspensionLength, z: w.spec.z });

    const denom = dot(hit.normal, down);
    let inv = 8;
    let rel = 0;
    if (denom < -0.1) {
      inv = -1 / denom;
      rel = dot(hit.normal, velocityAt(hit.point)) * inv;
    }
    let force = kS * xSusp * inv;
    const damp = rel < 0 ? CONFIG.suspension.dampingBump : CONFIG.suspension.dampingRebound;
    force -= damp * rel;
    force += bump;
    w.fz = clamp(force, 0, CONFIG.suspension.maxForce);
  }
}

function applyAntiRoll() {
  for (const axle of ["front", "rear"]) {
    const pair = wheels.filter((w) => w.spec.axle === axle);
    const a = pair[0];
    const b = pair[1];
    if (!a || !b || !a.inContact || !b.inContact) continue;
    const diff = a.compression - b.compression;
    const f = CONFIG.suspension.antiRoll * diff;
    a.fz += f;
    b.fz -= f;
  }
  for (const w of wheels) w.fz = clamp(w.fz, 0, CONFIG.suspension.maxForce);
}

function driveShares() {
  const split = CONFIG.drive.split[state.driveMode];
  return wheels.map((w) => {
    const axleShare = split[w.spec.axle] || 0;
    const n = wheels.filter((o) => o.spec.axle === w.spec.axle).length;
    return axleShare / n;
  });
}

function sampleTorque(rpm) {
  const curve = CONFIG.engine.torqueCurve;
  if (rpm <= curve[0].rpm) return curve[0].nm;
  for (let i = 1; i < curve.length; i++) {
    if (rpm <= curve[i].rpm) {
      const a = curve[i - 1];
      const b = curve[i];
      const t = (rpm - a.rpm) / (b.rpm - a.rpm);
      return lerp(a.nm, b.nm, t);
    }
  }
  return curve[curve.length - 1].nm;
}

function solvePowertrain(dt) {
  const shares = driveShares();
  const driven = [];
  for (let i = 0; i < wheels.length; i++) if (shares[i] > 0) driven.push(i);
  const box = CONFIG.gearbox;
  const gearRatio = state.gear < 0 ? box.reverse : box.gears[state.gear - 1];
  const sign = state.gear < 0 ? -1 : 1;
  const totalRatio = gearRatio * box.finalDrive * sign;

  let wRef = 0;
  let sumSq = 0;
  for (const i of driven) {
    wRef += shares[i] * wheels[i].omega;
    sumSq += shares[i] * shares[i];
  }

  const pedal = pedals();
  const rpm = (state.engineOmega * 60) / TAU;
  let teng = sampleTorque(rpm) * pedal.throttle;
  if (rpm < CONFIG.engine.idleRpm) teng += (CONFIG.engine.idleRpm - rpm) * CONFIG.engine.idleGain;
  if (rpm >= CONFIG.engine.limiterRpm) teng = Math.min(teng, 0);
  if (pedal.throttle < 0.02) teng -= CONFIG.engine.brakeNm * clamp(rpm / CONFIG.engine.maxRpm, 0, 1);

  const matchedRpm = Math.abs(wRef * totalRatio) * 60 / TAU;
  let cap = CONFIG.clutch.maxTorque;
  if (pedal.throttle < CONFIG.clutch.idleThrottle && matchedRpm < CONFIG.engine.idleRpm * CONFIG.clutch.idleRpmFactor) {
    cap = CONFIG.clutch.idleCap;
  }
  if (state.shiftTimer > 0) cap = 0;

  let clutchTorque = 0;
  if (cap > 0 && driven.length && Math.abs(totalRatio) > 1e-4) {
    const slip = state.engineOmega - wRef * totalRatio;
    const Ie = CONFIG.engine.inertia;
    const Iw = CONFIG.wheel.inertia;
    const lock = (1 / Ie) + (totalRatio * totalRatio * box.efficiency * sumSq) / Iw;
    const tcLock = slip / (lock * dt);
    clutchTorque = clamp(tcLock, -cap, cap);
  }

  state.engineOmega += ((teng - clutchTorque) * dt) / CONFIG.engine.inertia;
  const limit = (CONFIG.engine.limiterRpm * TAU) / 60;
  state.engineOmega = clamp(state.engineOmega, 0, limit * 1.02);

  const wheelTorque = clutchTorque * totalRatio * box.efficiency;
  for (let i = 0; i < wheels.length; i++) {
    let torque = wheelTorque * shares[i];
    if (state.tc && shares[i] > 0) {
      const slip = Math.abs(wheels[i].slipRatio);
      if (slip > CONFIG.tc.slip) {
        torque *= clamp(1 - (slip - CONFIG.tc.slip) * CONFIG.tc.gain, CONFIG.tc.min, 1);
      }
    }
    wheels[i].driveTorque = torque;
  }

  state.shiftTimer = Math.max(0, state.shiftTimer - dt);
  state.shiftCooldown = Math.max(0, state.shiftCooldown - dt);
  if (state.gear < 1 || state.shiftTimer > 0 || state.shiftCooldown > 0) return;

  let slipAvg = 0;
  if (driven.length) {
    for (const i of driven) slipAvg += Math.abs(wheels[i].slipRatio);
    slipAvg /= driven.length;
  }
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  const spinning = slipAvg > box.wheelspinSlip && speed < box.wheelspinSpeed;
  if (!spinning && rpm > box.upRpm && state.gear < box.gears.length && pedal.throttle > 0.45) {
    state.gear += 1;
    state.shiftTimer = box.shiftTime;
    state.shiftCooldown = box.shiftCooldown;
  } else if (rpm < box.downRpm && state.gear > 1) {
    state.gear -= 1;
    state.shiftTimer = box.shiftTime;
    state.shiftCooldown = box.shiftCooldown;
  }
}

function tireFrame(w) {
  const n = w.normal;
  let fwd = rotateVec(state.quat, { x: 0, y: 0, z: 1 });
  fwd = sub(fwd, mul(n, dot(fwd, n)));
  if (vecLen(fwd) < 1e-4) fwd = { x: 0, y: 0, z: 1 };
  fwd = normalize(fwd);
  let right = normalize(cross(n, fwd));
  fwd = normalize(cross(right, n));
  const s = Math.sin(w.steerAngle);
  const c = Math.cos(w.steerAngle);
  w.forward = add(mul(fwd, c), mul(right, s));
  w.right = add(mul(right, c), mul(fwd, -s));
}

function solveTires(dt) {
  const ref = (CONFIG.chassis.mass * CONFIG.physics.gravity) / wheels.length;
  for (const w of wheels) {
    tireFrame(w);
    const vel = velocityAt(w.centerWorld);
    w.vLong = dot(vel, w.forward);
    w.vLat = dot(vel, w.right);
    if (!w.inContact || w.fz < 25) {
      w.fx = 0;
      w.fy = 0;
      w.slipRatio += (0 - w.slipRatio) * 0.2;
      w.slipAngle += (0 - w.slipAngle) * 0.2;
      continue;
    }
    w.grip = surfaceParams(w.centerWorld.x, w.centerWorld.z);
    const kappa = (w.omega * w.spec.radius - w.vLong) / Math.max(Math.abs(w.vLong), CONFIG.tire.kappaFloor);
    const alpha = Math.atan2(w.vLat, Math.max(Math.abs(w.vLong), CONFIG.tire.alphaFloor));
    const rate = Math.max(Math.hypot(w.vLong, w.vLat), 2) / CONFIG.tire.relaxation;
    const blend = 1 - Math.exp(-rate * dt);
    w.slipRatio += (kappa - w.slipRatio) * blend;
    w.slipAngle += (alpha - w.slipAngle) * blend;

    const surf = w.grip || surfaceParams(w.contact.x, w.contact.z);
    const load = Math.max(0.3, 1 - CONFIG.tire.loadSensitivity * ((w.fz - ref) / ref));
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const gripScale = 1 - (spec.gripLoss || 0) * clamp(w.sinkDepth, 0, 1);
    const peak = surf.mu * gripScale * w.fz * load;
    let fx = magic(w.slipRatio, surf.lng) * peak;
    let fy = -magic(w.slipAngle, surf.lat) * peak;
    const rho = Math.hypot(fx / peak, fy / peak);
    if (rho > 1) {
      fx /= rho;
      fy /= rho;
    }
    w.fx = fx;
    w.fy = fy;
    const flexTarget = clamp(-fy / CONFIG.tire.flexStiffness, -0.07, 0.07);
    w.latFlex += (flexTarget - w.latFlex) * (1 - Math.exp(-dt / CONFIG.tire.flexTime));
  }
}

function updateSink(dt) {
  // sinkDepth is 0..1 on each wheel. Slip digs a loose surface in; low slip or
  // being airborne lets it fill back. High slip outruns that recovery, so
  // flooring it stays buried and easing off climbs out.
  for (const w of wheels) {
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const slip = Math.abs(w.slipRatio);
    if (spec.loose && w.inContact) w.sinkDepth += slip * spec.slipGain * dt;
    if (!w.inContact || slip < 0.55) w.sinkDepth -= (spec.recover || 0.45) * dt;
    if (!spec.loose) w.sinkDepth -= 1.2 * dt;
    w.sinkDepth = clamp(w.sinkDepth, 0, 1);
  }
}

function applyContactForces() {
  for (const w of wheels) {
    if (!w.inContact) continue;
    applyForce(w.contact, mul(w.normal, w.fz));
    applyForce(w.contact, mul(w.forward, w.fx));
    applyForce(w.contact, mul(w.right, w.fy));
    const surf = w.grip || surfaceParams(w.contact.x, w.contact.z);
    const spec = CONFIG.surfaces[w.surface] || CONFIG.surfaces.grass;
    const vel = velocityAt(w.centerWorld);
    // Horizontal only. A vertical component here fights the suspension and jitters.
    const hs = Math.hypot(vel.x, vel.z);
    if (hs > 0.05 && w.fz > 0) {
      const roll = surf.rolling * w.fz * Math.min(1, hs / 1.4);
      const speedDrag = (surf.sink || 0) * w.fz * hs;
      const rut = (spec.hDrag || 0) * w.sinkDepth * w.fz * hs;
      const mag = roll + speedDrag + rut;
      applyForce(w.contact, { x: -vel.x / hs * mag, y: 0, z: -vel.z / hs * mag });
    }
  }
  const v = state.velocity;
  const s = vecLen(v);
  if (s > 0.3) {
    const a = CONFIG.chassis.aero;
    const drag = 0.5 * a.rho * a.cd * a.area * s * s;
    applyForce(state.position, mul(v, -drag / s));
  }
}

function collideChassis() {
  const k = CONFIG.chassis.scrapeStiffness;
  const c = CONFIG.chassis.scrapeDamping;
  for (const p of CONFIG.chassis.samples) {
    const world = localToWorld(p);
    const h = groundHeight(world.x, world.z);
    if (world.y >= h) continue;
    const n = groundNormal(world.x, world.z);
    const pen = h - world.y;
    const vn = dot(velocityAt(world), n);
    let f = pen * k - vn * c;
    if (f < 0) continue;
    f = Math.min(f, CONFIG.chassis.scrapeCap);
    applyForce(world, mul(n, f));
  }
}

function integrateWheels(dt) {
  const pedal = pedals();
  const I = CONFIG.wheel.inertia;
  for (const w of wheels) {
    let brake = pedal.brake * (w.spec.axle === "front" ? CONFIG.brake.frontTorque : CONFIG.brake.rearTorque);
    if (input.handbrake > 0 && w.spec.axle === "rear") brake = Math.max(brake, CONFIG.brake.handbrakeTorque * input.handbrake);
    let T = w.driveTorque - w.fx * w.spec.radius;
    T -= Math.sign(w.omega) * CONFIG.wheel.spinDrag;
    const wUn = w.omega + (T * dt) / I;
    const maxDelta = (brake * dt) / I;
    if (brake > 0 && Math.abs(wUn) <= maxDelta) w.omega = 0;
    else if (brake > 0) w.omega = wUn - Math.sign(wUn) * maxDelta;
    else w.omega = wUn;
    const sunk = CONFIG.surfaces[w.surface];
    if (sunk && sunk.spinDamp && w.sinkDepth > 0.8 && Math.abs(w.slipRatio) > 0.45) {
      const depth = (w.sinkDepth - 0.8) / 0.2;
      const dragT = sunk.spinDamp * depth;
      const wSign = Math.sign(w.omega || T || 1);
      w.omega -= wSign * Math.min(Math.abs(w.omega), (dragT * dt) / I);
    }
    w.omega = clamp(w.omega, -700, 700);
    w.spinAngle += w.omega * dt;
  }
}

function integrateChassis(dt) {
  const m = CONFIG.chassis.mass;
  state.force.y -= m * CONFIG.physics.gravity;
  state.velocity.x += (state.force.x / m) * dt;
  state.velocity.y += (state.force.y / m) * dt;
  state.velocity.z += (state.force.z / m) * dt;
  const ld = Math.exp(-CONFIG.chassis.linearDamping * dt);
  state.velocity.x *= ld;
  state.velocity.z *= ld;

  const R = quatToMat3(state.quat);
  const Ib = [
    CONFIG.chassis.inertia.x, 0, 0,
    0, CONFIG.chassis.inertia.y, 0,
    0, 0, CONFIG.chassis.inertia.z,
  ];
  const Iworld = mulMat(mulMat(R, Ib), transpose(R));
  const Iw = mulMatVec(Iworld, state.omega);
  const tau = sub(state.torque, cross(state.omega, Iw));
  const alpha = mulMatVec(invertMat3(Iworld), tau);
  state.omega.x += alpha.x * dt;
  state.omega.y += alpha.y * dt;
  state.omega.z += alpha.z * dt;
  const ad = Math.exp(-CONFIG.chassis.angularDamping * dt);
  state.omega.x *= ad;
  state.omega.y *= ad;
  state.omega.z *= ad;
  const om = vecLen(state.omega);
  if (om > 30) {
    const s = 30 / om;
    state.omega.x *= s;
    state.omega.y *= s;
    state.omega.z *= s;
  }
  const sp = vecLen(state.velocity);
  if (sp > 140) {
    const s = 140 / sp;
    state.velocity.x *= s;
    state.velocity.y *= s;
    state.velocity.z *= s;
  }

  state.position.x += state.velocity.x * dt;
  state.position.y += state.velocity.y * dt;
  state.position.z += state.velocity.z * dt;
  const wq = { x: state.omega.x, y: state.omega.y, z: state.omega.z, w: 0 };
  const dq = quatMul(wq, state.quat);
  state.quat.x += 0.5 * dq.x * dt;
  state.quat.y += 0.5 * dq.y * dt;
  state.quat.z += 0.5 * dq.z * dt;
  state.quat.w += 0.5 * dq.w * dt;
  quatNormalize(state.quat);

  const upy = rotateVec(state.quat, { x: 0, y: 1, z: 0 }).y;
  if (upy < state.minUp) state.minUp = upy;
  if (!Number.isFinite(state.position.y + state.quat.w + state.velocity.x)) state.blewUp = true;
}

function stepPhysics(dt) {
  if (state.blewUp) return;
  state.force.x = state.force.y = state.force.z = 0;
  state.torque.x = state.torque.y = state.torque.z = 0;
  readInput();
  updateSteer(dt);
  updateReverse(dt);
  castSuspension();
  applyAntiRoll();
  solvePowertrain(dt);
  solveTires(dt);
  updateSink(dt);
  applyContactForces();
  collideChassis();
  integrateWheels(dt);
  integrateChassis(dt);
  // Wheel hubs are stored in world space for the axle meshes. Refresh them
  // after the body moves so a fast car does not leave the axles a step behind.
  for (const w of wheels) {
    w.centerWorld = localToWorld({
      x: w.spec.x,
      y: w.spec.y - w.suspensionLength,
      z: w.spec.z,
    });
  }
  updateEffects(dt);
  state.time += dt;
}

// ---------------------------------------------------------------------------
// Cosmetic effects driven by the fixed step so a fast-forward still leaves marks.
// They never write forces.
// ---------------------------------------------------------------------------

const specks = [];
let speckI = 0;
let skidPool = [];
let skidCursor = 0;
let rutPool = [];
let rutCursor = 0;
let effectsReady = false;

function hash01(n) {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

function clearEffects() {
  for (const p of specks) p.life = 0;
  for (const m of skidPool) m.visible = false;
  for (const m of rutPool) m.visible = false;
  skidCursor = 0;
  rutCursor = 0;
  for (const w of wheels) {
    w.skidAcc = 0;
    w.rutAcc = 0;
  }
}

function dropSkid(w, slip) {
  if (!skidPool.length) return;
  const m = skidPool[skidCursor];
  skidCursor = (skidCursor + 1) % skidPool.length;
  m.visible = true;
  m.position.set(w.contact.x, w.contact.y + 0.03, w.contact.z);
  m.rotation.set(0, Math.atan2(w.forward.x, w.forward.z), 0);
  m.scale.set(1, 1, 0.7 + Math.min(slip, 1.4) * 0.45);
    if (w.surface === "wet") {
      m.material.color.setHex(0x1c2430);
      m.material.opacity = 0.55;
    } else {
      m.material.color.setHex(0x141414);
      m.material.opacity = 0.72;
    }
  }

function dropRut(w) {
  if (!rutPool.length) return;
  const m = rutPool[rutCursor];
  rutCursor = (rutCursor + 1) % rutPool.length;
  m.visible = true;
  const side = w.spec.x < 0 ? -0.08 : 0.08;
  m.position.set(w.contact.x + w.right.x * side, w.contact.y + 0.025, w.contact.z + w.right.z * side);
  m.rotation.set(0, Math.atan2(w.forward.x, w.forward.z), 0);
  const deep = clamp(0.4 + w.sinkDepth * 0.6, 0.4, 1);
  m.scale.set(0.7 + deep * 0.5, 1, 0.85);
  if (w.surface === "snow") m.material.color.setHex(0x9eb0be);
  else if (w.surface === "sand") m.material.color.setHex(0x8c7040);
  else m.material.color.setHex(0x2a1c12);
  m.material.opacity = 0.45 + deep * 0.4;
}

function emitSpeck(x, y, z, vx, vy, vz, color) {
  const p = specks[speckI];
  speckI = (speckI + 1) % specks.length;
  p.x = x; p.y = y; p.z = z;
  p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = CONFIG.particles.life;
  p.r = color.r; p.g = color.g; p.b = color.b;
}

function updateEffects(dt) {
  if (!effectsReady) return;
  for (const w of wheels) {
    if (!w.inContact) continue;
    const slip = Math.hypot(w.slipRatio, w.slipAngle * 2.2);
    const loose = w.surface === "sand" || w.surface === "dirt" || w.surface === "grass";
    const paved = w.surface === "asphalt" || w.surface === "wet";
    const spinning = Math.abs(w.slipRatio) > 0.3;
    if (paved && slip > CONFIG.skid.slip) {
      w.skidAcc += Math.max(Math.hypot(w.vLong, w.vLat), 1.2) * dt;
      if (w.skidAcc >= CONFIG.skid.spacing) {
        w.skidAcc = 0;
        dropSkid(w, slip);
      }
    } else {
      w.skidAcc = 0;
    }
    const rutty = w.surface === "snow" || w.surface === "sand" || w.surface === "mud";
    if (rutty && w.sinkDepth > 0.12) {
      w.rutAcc += Math.max(Math.hypot(w.vLong, w.vLat), spinning ? 1.4 : 0) * dt;
      if (w.rutAcc >= 0.22) {
        w.rutAcc = 0;
        dropRut(w);
      }
    } else {
      w.rutAcc = 0;
    }
    const sprayOn = (loose && (spinning || slip > 0.28)) || (paved && spinning) || (w.surface === "ice" && spinning) || (rutty && spinning && w.sinkDepth > 0.12);
    if (sprayOn && state.tick % 2 === 0) {
      const spray = w.surface === "sand" ? { r: 0.86, g: 0.72, b: 0.4 }
        : w.surface === "dirt" ? { r: 0.55, g: 0.36, b: 0.18 }
        : w.surface === "grass" ? { r: 0.42, g: 0.62, b: 0.28 }
        : w.surface === "snow" ? { r: 0.93, g: 0.96, b: 1 }
        : w.surface === "mud" ? { r: 0.32, g: 0.22, b: 0.12 }
        : w.surface === "ice" ? { r: 0.9, g: 0.95, b: 1 }
        : { r: 0.62, g: 0.62, b: 0.62 };
      const j = hash01(state.tick * 0.17 + w.spec.x * 3 + w.spec.z);
      const atContact = rutty && w.sinkDepth > 0.12;
      emitSpeck(
        w.contact.x + (atContact ? 0 : w.right.x * 0.4),
        w.contact.y + (atContact ? 0.08 : 0.25),
        w.contact.z + (atContact ? 0 : w.right.z * 0.4),
        -w.forward.x * 0.8 + (j - 0.5) * 1.4,
        1.1 + j * 1.3,
        -w.forward.z * 0.8 + (hash01(j + 2) - 0.5) * 1.4,
        spray,
      );
    }
  }
  for (const p of specks) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vy -= 3.2 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
  }
  state.tick++;
}

const look = new THREE.Vector3();

const SURFACE_ID = { asphalt: 0, wet: 1, dirt: 2, grass: 3, sand: 4, ice: 5, snow: 6, mud: 7 };

function makeSurfaceAtlas() {
  const S = 128;
  const c = document.createElement("canvas");
  c.width = S * 4;
  c.height = S * 2;
  const g = c.getContext("2d");
  const rnd = (x, y) => {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  };
  let ox = 0;
  let oy = 0;
  const tile = (id, paint) => {
    ox = (id % 4) * S;
    oy = Math.floor(id / 4) * S;
    g.save();
    g.translate(ox, oy);
    paint(g, S);
    g.restore();
  };
  const grain = (g, S, rgb, amp) => {
    const img = g.getImageData(ox, oy, S, S);
    const d = img.data;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const i = (y * S + x) * 4;
        const n = rnd(x, y);
        d[i] = clamp(rgb[0] + (n - 0.5) * amp, 0, 255);
        d[i + 1] = clamp(rgb[1] + (n - 0.5) * amp, 0, 255);
        d[i + 2] = clamp(rgb[2] + (n - 0.5) * amp, 0, 255);
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, ox, oy);
  };
  tile(0, (g, S) => { grain(g, S, [74, 79, 86], 28); g.strokeStyle = "rgba(30,30,32,0.35)"; g.lineWidth = 1; for (let i = 8; i < S; i += 18) { g.beginPath(); g.moveTo(0, i); g.lineTo(S, i + 2); g.stroke(); } });
  tile(1, (g, S) => { grain(g, S, [48, 62, 78], 22); g.fillStyle = "rgba(180,200,220,0.18)"; for (let i = 0; i < 8; i++) g.fillRect(rnd(i, 3) * S, rnd(i, 9) * S, 30, 3); });
  tile(2, (g, S) => { grain(g, S, [122, 78, 42], 46); });
  tile(3, (g, S) => { grain(g, S, [52, 110, 48], 40); g.strokeStyle = "rgba(30,80,28,0.45)"; for (let i = 0; i < 40; i++) { g.beginPath(); g.moveTo(rnd(i, 1) * S, rnd(i, 2) * S); g.lineTo(rnd(i, 4) * S, rnd(i, 5) * S); g.stroke(); } });
  tile(4, (g, S) => {
    grain(g, S, [198, 168, 96], 26);
    g.strokeStyle = "rgba(160,120,60,0.35)";
    for (let y = 0; y < S; y += 6) {
      g.beginPath();
      for (let x = 0; x <= S; x += 4) g.lineTo(x, y + Math.sin((x + y) * 0.18) * 2.2);
      g.stroke();
    }
  });
  tile(5, (g, S) => { grain(g, S, [214, 230, 238], 16); });
  tile(6, (g, S) => {
    grain(g, S, [236, 242, 246], 18);
    const img = g.getImageData(ox, oy, S, S);
    const d = img.data;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const i = (y * S + x) * 4;
        const n = rnd(x * 0.3, y * 0.3);
        if (n < 0.45) { d[i] -= 18; d[i + 1] -= 10; d[i + 2] += 8; }
        if (rnd(x + 20, y) > 0.97) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; }
      }
    }
    g.putImageData(img, ox, oy);
  });
  tile(7, (g, S) => {
    grain(g, S, [58, 40, 28], 30);
    g.fillStyle = "rgba(90,110,90,0.55)";
    for (let i = 0; i < 7; i++) {
      g.beginPath();
      g.ellipse(20 + rnd(i, 2) * (S - 40), 16 + rnd(i, 8) * (S - 32), 10 + rnd(i, 4) * 16, 6 + rnd(i, 6) * 8, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = "rgba(210,220,200,0.35)";
    for (let i = 0; i < 7; i++) g.fillRect(18 + rnd(i, 2) * (S - 40), 14 + rnd(i, 8) * (S - 32), 8, 2);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 4;
  return tex;
}

function groundMaterial(atlas) {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86, metalness: 0.02 });
  mat.customProgramCacheKey = () => "surface-atlas-1";
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.atlasMap = { value: atlas };
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", "#include <common>\nattribute float surfaceId;\nvarying float vSid;\nvarying vec3 vWpos;")
      .replace("#include <uv_vertex>", "#include <uv_vertex>\nvSid = surfaceId;\nvWpos = position;");
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying float vSid;\nvarying vec3 vWpos;\nuniform sampler2D atlasMap;")
      .replace("#include <color_fragment>", `#include <color_fragment>
        float col = mod(vSid, 4.0);
        float rowTop = floor(vSid / 4.0);
        vec2 f = fract(vWpos.xz * 0.35) * 0.84 + 0.08;
        float v0 = 1.0 - (rowTop + 1.0) / 2.0;
        vec2 auv = vec2((col + f.x) / 4.0, v0 + f.y / 2.0);
        diffuseColor.rgb *= texture2D(atlasMap, auv).rgb;`);
  };
  return mat;
}

function buildTrack() {
  const mesh = CONFIG.track.mesh;
  const res = mesh.res;
  const cols = Math.round((mesh.maxX - mesh.minX) / res) + 1;
  const rows = Math.round((mesh.maxZ - mesh.minZ) / res) + 1;
  const positions = new Float32Array(cols * rows * 3);
  const normals = new Float32Array(cols * rows * 3);
  const colors = new Float32Array(cols * rows * 3);
  const surfIds = new Float32Array(cols * rows);
  const color = new THREE.Color();
  let k = 0;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const x = mesh.minX + i * res;
      const z = mesh.minZ + j * res;
      const y = groundHeight(x, z);
      positions[k] = x;
      positions[k + 1] = y;
      positions[k + 2] = z;
      const n = groundNormal(x, z);
      normals[k] = n.x;
      normals[k + 1] = n.y;
      normals[k + 2] = n.z;
      const surf = surfaceAt(x, z);
      surfIds[k / 3] = SURFACE_ID[surf] ?? 3;
      color.set(CONFIG.surfaces[surf].color);
      if (surf === "grass") {
        const tuft = 0.5 + 0.5 * Math.sin(x * 1.7) * Math.sin(z * 1.45);
        const patch = 0.5 + 0.5 * Math.sin(x * 0.33 + z * 0.21);
        color.lerp(new THREE.Color(patch > 0.62 ? "#2c6428" : "#67a84a"), 0.28 + 0.22 * tuft);
      } else if (surf === "dirt") {
        const clod = 0.5 + 0.5 * Math.sin(x * 2.2 + 0.4) * Math.sin(z * 1.8);
        color.lerp(new THREE.Color("#5c3a1e"), 0.35 * clod);
        color.multiplyScalar(0.86 + 0.28 * clod);
      } else if (surf === "sand") {
        const rip = 0.5 + 0.5 * Math.sin(x * 2.8 + z * 0.55);
        color.lerp(new THREE.Color("#e4c98a"), 0.22 * rip);
        color.multiplyScalar(0.9 + 0.16 * rip);
      } else if (surf === "wet") {
        color.multiplyScalar(0.86 + 0.08 * Math.sin(x * 0.8 + z));
      } else {
        color.multiplyScalar(0.92 + 0.08 * Math.sin(x * 0.31) * Math.sin(z * 0.23));
      }
      if (surf === "asphalt" && Math.abs(x) < 0.85 && (Math.floor(z / 4) % 2) === 0) {
        color.lerp(new THREE.Color("#f4f4f4"), 0.8);
      }
      colors[k] = color.r;
      colors[k + 1] = color.g;
      colors[k + 2] = color.b;
      k += 3;
    }
  }
  const index = [];
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const a = j * cols + i;
      const b = a + 1;
      const c = a + cols;
      const d = c + 1;
      index.push(a, c, b, b, c, d);
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geom.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geom.setAttribute("surfaceId", new THREE.BufferAttribute(surfIds, 1));
  geom.setIndex(index);
  const ground = new THREE.Mesh(geom, groundMaterial(makeSurfaceAtlas()));
  ground.receiveShadow = true;
  scene.add(ground);

  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(2000, 2000),
    new THREE.MeshStandardMaterial({ color: CONFIG.surfaces.grass.color, roughness: 1 }),
  );
  base.rotation.x = -Math.PI / 2;
  base.position.y = -0.08;
  base.receiveShadow = true;
  scene.add(base);

  for (const zone of CONFIG.track.zones) {
    if (!zone.mark) continue;
    const posts = [
      [zone.x, zone.z],
      [zone.x + zone.w, zone.z],
      [zone.x, zone.z + zone.d],
      [zone.x + zone.w, zone.z + zone.d],
    ];
    for (const [x, z] of posts) {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 0.9, 8),
        new THREE.MeshStandardMaterial({ color: CONFIG.surfaces[zone.surface].color, roughness: 0.7 }),
      );
      post.position.set(x, groundHeight(x, z) + 0.45, z);
      post.castShadow = true;
      scene.add(post);
    }
  }

  // Posts sit behind the spawn camera so the crossbar never cuts the view.
  const gateMat = new THREE.MeshStandardMaterial({ color: 0xd3541a, roughness: 0.55 });
  const gateZ = -14;
  for (const x of [-11, 11]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.6, 0.28), gateMat);
    post.position.set(x, 0.8, gateZ);
    post.castShadow = true;
    scene.add(post);
  }
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(22.4, 0.16, 0.16),
    new THREE.MeshStandardMaterial({ color: 0x1b1e22, roughness: 0.4, metalness: 0.3 }),
  );
  bar.position.set(0, 1.55, gateZ);
  scene.add(bar);

  for (const label of CONFIG.track.labels) {
    const c = document.createElement("canvas");
    c.width = 256;
    c.height = 64;
    const g = c.getContext("2d");
    g.fillStyle = "rgba(0,0,0,0.55)";
    g.fillRect(0, 0, 256, 64);
    g.fillStyle = label.color;
    g.font = "700 36px sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label.text, 128, 34);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    sprite.position.set(label.x, groundHeight(label.x, label.z) + 2.4, label.z);
    sprite.scale.set(5.4, 1.35, 1);
    scene.add(sprite);
  }
}

function makeTread() {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#161616";
  g.fillRect(0, 0, 128, 64);
  g.fillStyle = "#3a3a3a";
  for (let i = 0; i < 10; i++) g.fillRect(4 + i * 12, 6, 6, 52);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function buildCar() {
  const paint = new THREE.MeshStandardMaterial({ color: 0xd3541a, roughness: 0.32, metalness: 0.42 });

  const add = (mesh) => { mesh.castShadow = true; chassis.add(mesh); return mesh; };
  const box = (w, h, d, mat, x, y, z, rx) => {

  // Lower body, hood, cabin, glass, bumpers, and arches. Wheels sit outside the tub.

  box(1.46, 0.14, 0.2, paintDark, 0, 0.0, -1.68);
  box(1.22, 0.1, 1.15, paint, 0, 0.2, 1.05, -0.14);
  box(0.7, 0.16, 0.08, dark, 0, 0.08, 1.78);
  box(1.18, 0.4, 1.45, dark, 0, 0.36, -0.12);
  box(1.22, 0.06, 1.15, paintDark, 0, 0.58, -0.1);
  box(1.08, 0.32, 0.04, glass, 0, 0.4, 0.58, 0.42);
  box(1.05, 0.28, 0.04, glass, 0, 0.4, -0.82, -0.5);

  for (const x of [-0.8, 0.8]) {

  const wheelRig = new THREE.Group();

  wheelRig.rotation.x = 0.85;
  const wheelSpin = new THREE.Group();
  wheelRig.add(wheelSpin);
  const rimW = new THREE.Mesh(
    new THREE.TorusGeometry(0.11, 0.012, 8, 16),
    new THREE.MeshStandardMaterial({ color: 0x1b1f24, roughness: 0.45, metalness: 0.4 }),
  );
  wheelSpin.add(rimW);
  for (let s = 0; s < 3; s++) {

  const hubW = new THREE.Mesh(

  for (let i = 0; i < 4; i++) {

    arm.castShadow = true;
    scene.add(arm);

  }
  scene.add(axles.front);
  scene.add(axles.rear);
  chassis.userData.axles = axles;

  for (const w of wheels) {
    w.arrows = {
      n: new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0x37d67a),

      y: new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0x3dc5ff),

      scene.add(a);

  }
