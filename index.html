const hud = {
  speed: document.getElementById("speed"),
  gear: document.getElementById("gear"),
  rpm: document.getElementById("rpm"),
  rpmfill: document.getElementById("rpmfill"),
  cards: [],
};

function buildHud() {
  const root = document.getElementById("wheels");
  for (const w of wheels) {
    const el = document.createElement("div");
    el.className = "wcard panel";
    el.innerHTML = `
      <div class="wtop"><span class="wid">${w.spec.id}</span><span class="wtag"></span></div>
      <div class="wsurf"></div>
      <div class="meter-label">SLIP</div>
      <div class="meter"><div class="slip"></div></div>
      <div class="meter-label">SUSP</div>
      <div class="meter susp"><div class="comp"></div></div>`;
    root.appendChild(el);
    hud.cards.push({
      root: el,
      tag: el.querySelector(".wtag"),
      surf: el.querySelector(".wsurf"),
      slip: el.querySelector(".slip"),
      comp: el.querySelector(".comp"),
    });
  }
  const legend = document.getElementById("legend");
  for (const [name, surf] of Object.entries(CONFIG.surfaces)) {
    const s = document.createElement("span");
    s.className = "swatch";
    s.innerHTML = `<i></i>${surf.ru || name}`;
    s.querySelector("i").style.background = surf.color;
    legend.appendChild(s);
  }
}

function updateHud() {
  const speed = Math.hypot(state.velocity.x, state.velocity.z);
  hud.speed.textContent = String(Math.round(speed * 3.6));
  hud.gear.textContent = state.gear < 0 ? "R" : String(state.gear);
  const rpm = (state.engineOmega * 60) / TAU;
  hud.rpm.textContent = `${Math.round(rpm)} RPM`;
  const t = clamp((rpm - CONFIG.engine.idleRpm) / (CONFIG.engine.limiterRpm - CONFIG.engine.idleRpm), 0, 1);
  hud.rpmfill.style.width = `${t * 100}%`;
  hud.rpmfill.classList.toggle("hot", rpm > CONFIG.engine.limiterRpm * 0.92);
  const shares = driveShares();
  wheels.forEach((w, i) => {
    const card = hud.cards[i];
    const slip = Math.hypot(w.slipRatio, w.slipAngle * 2.2);
    card.surf.textContent = (CONFIG.surfaces[w.surface] && CONFIG.surfaces[w.surface].ru) || w.surface;
    card.slip.style.width = `${clamp(slip, 0, 1) * 100}%`;
    card.slip.style.background = slip > 0.45 ? "#ff5a45" : slip > 0.25 ? "#ffbf3c" : "#86f0b0";
    card.comp.style.width = `${clamp(w.compression / CONFIG.suspension.maxCompression, 0, 1) * 100}%`;
    card.root.classList.toggle("driven", shares[i] > 0);
    card.root.classList.toggle("hot", slip > 0.45);
    let tag = "";
    if (Math.abs(w.slipRatio) > 0.45) tag = "SPIN";
    else if (Math.abs(w.slipAngle) > 0.2) tag = "SKID";
    else if (input.handbrake > 0 && w.spec.axle === "rear" && Math.abs(w.omega) < 1.5 && speed > 2) tag = "LOCK";
    card.tag.textContent = tag;
  });
  for (const b of document.querySelectorAll("[data-drive]")) b.classList.toggle("on", b.dataset.drive === state.driveMode);
  document.getElementById("forces").classList.toggle("on", state.debug);
  const tcBtn = document.getElementById("tc");
  if (tcBtn) tcBtn.classList.toggle("on", state.tc);
  const fuel = document.querySelector("#fuel span");
  const temp = document.querySelector("#temp span");
  const batt = document.querySelector("#batt span");
  const odo = document.getElementById("odo");
  const wear = document.getElementById("wear");
  if (fuel) fuel.style.width = `${clamp(state.fuel, 0, 1) * 100}%`;
  if (temp) {
    temp.style.width = `${clamp(state.coolant, 0, 1) * 100}%`;
    temp.style.background = state.coolant > 0.9 ? "#ff5a45" : "#ff7a3c";
  }
  if (batt) batt.style.width = `${clamp(state.battery, 0, 1) * 100}%`;
  if (odo) {
    const digits = state.odo.toFixed(1).padStart(7, "0");
    odo.textContent = digits;
  }
  if (wear) {
    const grounded = wheels.find((w) => w.inContact) || wheels[0];
    const ru = (CONFIG.surfaces[grounded.surface] && CONFIG.surfaces[grounded.surface].ru) || "АСФАЛЬТ";
    wear.textContent = `${ru} • ИЗНОС +${state.wear}`;
  }
  const eng = document.getElementById("eng");
  const cruise = document.getElementById("cruise");
  const lights = document.getElementById("lights");
  const wipers = document.getElementById("wipers");
  const rainBtn = document.getElementById("rainbtn");
  if (eng) eng.classList.toggle("on", state.engineOn);
  if (cruise) cruise.classList.toggle("on", state.cruise);
  if (lights) lights.classList.toggle("on", state.lights > 0);
  if (wipers) wipers.classList.toggle("on", state.wipers);
  if (rainBtn) rainBtn.classList.toggle("on", state.rain || state.weatherMode === "rain");
  const seedLine = document.getElementById("seedline");
  if (seedLine) seedLine.textContent = `СИД ${ROAD.seed}`;
  const menuBtn = document.getElementById("menubtn");
  const menu = document.getElementById("worldmenu");
  if (menuBtn && menu) menuBtn.classList.toggle("on", menu.classList.contains("open"));
  const bio = document.getElementById("bioline");
  if (bio) {
    const name = (BIOMES[state.biome] && BIOMES[state.biome].ru) || "";
    bio.textContent = state.biomeT > 0.15 ? `${name} → ${(BIOMES[state.biomeNext] && BIOMES[state.biomeNext].ru) || ""}` : name;
  }
  for (const b of document.querySelectorAll("[data-wx]")) b.classList.toggle("on", b.dataset.wx === state.weatherMode);
  for (const b of document.querySelectorAll("[data-time]")) b.classList.toggle("on", Number(b.dataset.time) === state.timeScale);
  const camBtn = document.getElementById("camhold");
  if (camBtn) camBtn.classList.toggle("on", orbit.hold);
}

function setDrive(mode) {
  if (!CONFIG.drive.split[mode]) return;
  state.driveMode = mode;
  updateHud();
}
function setDebug(on) {
  state.debug = !!on;
  updateHud();
}

function bindHold(el, down, up) {
  const ids = new Set();
  const sync = () => el.classList.toggle("held", ids.size > 0);
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    ids.add(e.pointerId);
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events have no capture */ }
    if (ids.size === 1) down();
    sync();
    e.preventDefault();
  });
  const end = (e) => {
    if (!ids.has(e.pointerId)) return;
    ids.delete(e.pointerId);
    if (ids.size === 0) up();
    sync();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function bindInput() {
  window.addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === "KeyR") reset();
    if (e.code === "KeyF") setDebug(!state.debug);
    if (e.code === "Digit1") setDrive("FWD");
    if (e.code === "Digit2") setDrive("RWD");
    if (e.code === "Digit3") setDrive("AWD");
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => keys.clear());
  bindHold(document.getElementById("gas"), () => { touch.throttle = 1; }, () => { touch.throttle = 0; });
  bindHold(document.getElementById("brake"), () => { touch.brake = 1; }, () => { touch.brake = 0; });
  bindHold(document.getElementById("handbrake"), () => { touch.handbrake = 1; }, () => { touch.handbrake = 0; });
  bindHold(document.getElementById("steerL"), () => { touch.steerL = 1; }, () => { touch.steerL = 0; });
  bindHold(document.getElementById("steerR"), () => { touch.steerR = 1; }, () => { touch.steerR = 0; });
  const wheel = document.getElementById("wheel");
  const wheelAngle = (e) => {
    const r = wheel.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
  };
  wheel.addEventListener("pointerdown", (e) => {
    steerUi.dragging = true;
    steerUi.last = wheelAngle(e);
    try { wheel.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ }
    e.preventDefault();
  });
  wheel.addEventListener("pointermove", (e) => {
    if (!steerUi.dragging) return;
    const ang = wheelAngle(e);
    let delta = ang - steerUi.last;
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;
    steerUi.last = ang;
    steerUi.angle = clamp(steerUi.angle + delta, -CONFIG.steer.wheelLock, CONFIG.steer.wheelLock);
    e.preventDefault();
  });
  const wheelEnd = () => { steerUi.dragging = false; };
  wheel.addEventListener("pointerup", wheelEnd);
  wheel.addEventListener("pointercancel", wheelEnd);
  const swallow = (e) => e.preventDefault();
  const guard = (el) => {
    el.addEventListener("touchstart", swallow, { passive: false });
    el.addEventListener("touchmove", swallow, { passive: false });
    el.addEventListener("contextmenu", swallow);
    el.addEventListener("selectstart", swallow);
  };
  guard(document);
  guard(document.body);
  for (const el of document.querySelectorAll("button, #hud, #touch, #rotate, #hint, #legend, #wheel, #worldmenu")) guard(el);
  document.addEventListener("gesturestart", swallow, { passive: false });
  document.addEventListener("gesturechange", swallow, { passive: false });
  document.addEventListener("dblclick", swallow);
  for (const b of document.querySelectorAll("[data-drive]")) {
    b.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      setDrive(b.dataset.drive);
      e.preventDefault();
    });
  }
  document.getElementById("tc").addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    state.tc = !state.tc;
    updateHud();
    e.preventDefault();
  });
  document.getElementById("forces").addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    setDebug(!state.debug);
    e.preventDefault();
  });
  document.getElementById("reset").addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    reset();
    e.preventDefault();
  });
  const toggle = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      fn();
      updateHud();
      e.preventDefault();
    });
  };
  toggle("eng", () => {
    if (state.engineOn) state.engineOn = false;
    else if (state.fuel > 0 && state.battery > 0.03) {
      state.engineOn = true;
      state.engineOmega = Math.max(state.engineOmega, (CONFIG.engine.idleRpm * TAU) / 60);
    }
  });
  toggle("cruise", () => {
    state.cruise = !state.cruise;
    if (state.cruise) state.cruiseSpeed = Math.max(8, Math.hypot(state.velocity.x, state.velocity.z));
  });
  toggle("lights", () => { state.lights = (state.lights + 1) % 3; });
  toggle("wipers", () => { state.wipers = !state.wipers; });
  toggle("rainbtn", () => { setWeather(state.weatherMode === "rain" ? "auto" : "rain"); });
  toggle("menubtn", () => {
    const menu = document.getElementById("worldmenu");
    if (menu) menu.classList.toggle("open");
  });
  toggle("newseed", () => {
    setSeed((Math.floor(Math.random() * 900000000) + 1) >>> 0, { resetCar: true, force: true });
  });
  for (const b of document.querySelectorAll("[data-wx]")) {
    b.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      setWeather(b.dataset.wx);
      updateHud();
      e.preventDefault();
    });
  }
  for (const b of document.querySelectorAll("[data-time]")) {
    b.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      state.timeScale = Number(b.dataset.time) || 1;
      updateHud();
      e.preventDefault();
    });
  }
  toggle("rocks", () => {
    const spot = roadSpot("rocks");
    reset({ x: spot.x, z: spot.z, speed: 1.2, yaw: spot.yaw });
  });
  toggle("camhold", () => {
    orbit.hold = !orbit.hold;
    if (!orbit.hold) orbit.idle = CONFIG.camera.returnDelay;
  });
  const canvasEl = document.getElementById("view");
  const orbitBlocked = (target) => !!(target && target.closest && target.closest("button, #wheel, #side, #extra, #modes, #worldmenu, #seedchip"));
  window.addEventListener("pointerdown", (e) => {
    if (orbitBlocked(e.target)) return;
    orbit.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    orbit.dragging = true;
    orbit.idle = 0;
    orbit.lastX = e.clientX;
    orbit.lastY = e.clientY;
    if (orbit.pointers.size < 2) orbit.pinch = 0;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ }
  });
  window.addEventListener("pointermove", (e) => {
    if (!orbit.pointers.has(e.pointerId)) return;
    orbit.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    orbit.idle = 0;
    const pts = [...orbit.pointers.values()];
    if (pts.length >= 2) {
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (orbit.pinch > 8) orbit.dist = clamp(orbit.dist * (orbit.pinch / d), CONFIG.camera.minDist, CONFIG.camera.maxDist);
      orbit.pinch = d;
      return;
    }
    const dx = e.clientX - orbit.lastX;
    const dy = e.clientY - orbit.lastY;
    orbit.lastX = e.clientX;
    orbit.lastY = e.clientY;
    orbit.yaw -= dx * 0.0065;
    orbit.pitch = clamp(orbit.pitch - dy * 0.005, CONFIG.camera.minPitch, CONFIG.camera.maxPitch);
  });
  const orbitEnd = (e) => {
    orbit.pointers.delete(e.pointerId);
    if (orbit.pointers.size === 0) {
      orbit.dragging = false;
      orbit.pinch = 0;
    } else if (orbit.pointers.size === 1) {
      const only = [...orbit.pointers.values()][0];
      orbit.lastX = only.x;
      orbit.lastY = only.y;
      orbit.pinch = 0;
    }
  };
  window.addEventListener("pointerup", orbitEnd);
  window.addEventListener("pointercancel", orbitEnd);
  canvasEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    orbit.dist = clamp(orbit.dist * (e.deltaY > 0 ? 1.08 : 0.92), CONFIG.camera.minDist, CONFIG.camera.maxDist);
    orbit.idle = 0;
  }, { passive: false });
}

function scheduleFit() {
  fitRenderer();
  clearTimeout(scheduleFit.soon);
  clearTimeout(scheduleFit.later);
  scheduleFit.soon = setTimeout(fitRenderer, 100);
  scheduleFit.later = setTimeout(fitRenderer, 350);
}
window.addEventListener("resize", scheduleFit);
window.addEventListener("orientationchange", scheduleFit);
window.addEventListener("pageshow", scheduleFit);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", scheduleFit);
  window.visualViewport.addEventListener("scroll", scheduleFit);
}

function plain(v) { return { x: v.x, y: v.y, z: v.z }; }

function report() {
  scene.updateMatrixWorld(true);
  const shares = driveShares();
  return {
    time: state.time,
    pos: plain(state.position),
    vel: plain(state.velocity),
    speed: Math.hypot(state.velocity.x, state.velocity.z),
    up: plain(rotateVec(state.quat, { x: 0, y: 1, z: 0 })),
    fwd: plain(rotateVec(state.quat, { x: 0, y: 0, z: 1 })),
    right: plain(rotateVec(state.quat, { x: 1, y: 0, z: 0 })),
    gear: state.gear,
    rpm: (state.engineOmega * 60) / TAU,
    drive: state.driveMode,
    blewUp: state.blewUp,
    minUp: state.minUp,
    rideHeight: rideHeight(),
    wheels: wheels.map((w, i) => {
      const axis = new THREE.Vector3(1, 0, 0).transformDirection(w.visual.spin.matrixWorld);
      const local = worldToLocal(w.centerWorld);
      return {
        id: w.spec.id,
        axle: w.spec.axle,
        share: shares[i],
        local: plain(local),
        center: plain(w.centerWorld),
        axis: { x: axis.x, y: axis.y, z: axis.z },
        compression: w.compression,
        suspensionLength: w.suspensionLength,
        inContact: w.inContact,
        surface: w.surface,
        slipRatio: w.slipRatio,
        slipAngle: w.slipAngle,
        steerAngle: w.steerAngle,
        sinkDepth: w.sinkDepth,
        water: w.water || 0,
        tireSquash: w.tireSquash,
        latFlex: w.latFlex,
        omega: w.omega,
        driveTorque: w.driveTorque,
        fz: w.fz,
        fx: w.fx,
        fy: w.fy,
        bottom: w.centerWorld.y - w.spec.radius,
        ground: groundHeight(w.centerWorld.x, w.centerWorld.z),
        radius: w.spec.radius,
      };
    }),
  };
}

function samplePixel() {
  const gl = renderer.getContext();
  const x = (renderer.domElement.width / 2) | 0;
  const y = (renderer.domElement.height / 2) | 0;
  const buf = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  return [buf[0], buf[1], buf[2], buf[3]];
}

function runSeconds(seconds) {
  const dt = CONFIG.physics.fixedDt;
  const n = Math.max(0, Math.round(seconds / dt));
  for (let i = 0; i < n; i++) stepPhysics(dt);
  updateVisuals(seconds);
  renderer.render(scene, camera);
  return report();
}

const manual = new URLSearchParams(location.search).has("manual");
let accumulator = 0;
let last = performance.now();

function frame(now) {
  let frameDt = (now - last) / 1000;
  last = now;
  if (frameDt > CONFIG.physics.maxFrame) frameDt = CONFIG.physics.maxFrame;
  accumulator += frameDt;
  const dt = CONFIG.physics.fixedDt;
  let steps = 0;
  while (accumulator >= dt && steps < CONFIG.physics.maxSubsteps) {
    stepPhysics(dt);
    accumulator -= dt;
    steps++;
  }
  updateVisuals(frameDt);
  renderer.render(scene, camera);
  if (state.blewUp) reset();
  requestAnimationFrame(frame);
}

function initWorld() {
  const params = new URLSearchParams(location.search);
  const manualRun = params.has("manual");
  if (params.has("seed")) ROAD.seed = Number(params.get("seed")) >>> 0;
  else if (manualRun) ROAD.seed = 5432;
  else ROAD.seed = (Math.floor(Math.random() * 900000000) + 1) >>> 0;
  if (!ROAD.seed) ROAD.seed = 1;
  clearRoad();
  state.weatherMode = manualRun ? "mixed" : "auto";
  state.timeScale = 1;
  state.weatherEpoch = 0;
  state.weatherTime = 0;
  state.weatherFront = 1e9;
}

function boot() {
  initWorld();
  assertMath();
  buildTrack();
  buildCar();
  buildEffects();
  buildHud();
  bindInput();
  reset();
  updateVisuals(0.016);
  renderer.render(scene, camera);
  window.__CAR__ = {
    ready: true,
    CONFIG,
    setInput(v) { scripted = { throttle: 0, brake: 0, steer: 0, handbrake: 0, ...v }; },
    clearInput() { scripted = null; },
    setDrive,
    setDebug,
    reset,
    runSeconds,
    report,
    samplePixel,
    surfaceAt,
    groundHeight,
    build: "voyage-5432g",
    setWeather,
    setSeed,
    auditSeed,
    biomeAt,
    orbitState: () => ({ yaw: orbit.yaw, pitch: orbit.pitch, dist: orbit.dist, hold: orbit.hold, dragging: orbit.dragging }),
    clearRuts,
    roadSpot,
    roadHeading,
    roadX,
    sceneCount: () => scene.children.length,
    countObjects() {
      let n = 0;
      scene.traverse(() => { n++; });
      return n;
    },
    rutDepthAt(x, z) {
      let m = 0;
      for (const c of softChunks) {
        if (!c.disp || x < c.x || z < c.z || x > c.x + c.w || z > c.z + c.d) continue;
        const i = clamp(Math.round((x - c.x) / c.res), 0, c.cols - 1);
        const j = clamp(Math.round((z - c.z) / c.res), 0, c.rows - 1);
        m = Math.min(m, c.disp[j * c.cols + i]);
      }
      return -m;
    },
    setOrbit(v = {}) {
      if (v.yaw != null) orbit.yaw = v.yaw;
      if (v.pitch != null) orbit.pitch = v.pitch;
      if (v.dist != null) orbit.dist = v.dist;
      if (v.hold != null) orbit.hold = !!v.hold;
      orbit.idle = 0;
      const d = cameraDesired();
      camPos.set(d.x, d.y, d.z);
      camera.position.copy(camPos);
      look.set(state.position.x, state.position.y + CONFIG.camera.lookHeight, state.position.z);
      camera.up.set(0, 1, 0);
      camera.lookAt(look);
      renderer.render(scene, camera);
    },
    setScene(v = {}) {
      if (v.timeOfDay != null) state.timeOfDay = v.timeOfDay;
      if (v.rain != null) state.rain = !!v.rain;
      if (v.lights != null) state.lights = v.lights;
      if (v.wipers != null) state.wipers = !!v.wipers;
      if (v.engineOn != null) state.engineOn = !!v.engineOn;
      if (v.fuel != null) state.fuel = v.fuel;
      if (v.coolant != null) state.coolant = v.coolant;
      if (v.battery != null) state.battery = v.battery;
      if (v.odo != null) state.odo = v.odo;
      if (v.wear != null) state.wear = v.wear;
      if (v.cruise != null) state.cruise = !!v.cruise;
      if (v.weatherMode) setWeather(v.weatherMode);
      if (v.timeScale) state.timeScale = Number(v.timeScale) || 1;
      if (v.seed != null) setSeed(v.seed, { force: true, rebuild: true });
      updateHud();
      updateVisuals(0.016);
      renderer.render(scene, camera);
    },
    tireCam(id) {
      const w = wheels.find((wheel) => wheel.spec.id === id) || wheels[0];
      updateVisuals(0.016);
      const p = w.contact || w.centerWorld;
      camera.position.set(p.x + 0.95, p.y + 0.18, p.z + 0.22);
      camera.up.set(0, 1, 0);
      camera.lookAt(p.x, p.y + 0.04, p.z);
      renderer.render(scene, camera);
    },
    tirePatch(id) {
      const w = wheels.find((wheel) => wheel.spec.id === id) || wheels[0];
      updateVisuals(0.016);
      const mat = w.visual.tire.material;
      const pos = w.visual.tire.geometry.attributes.position;
      const n = mat.userData.planeN.value;
      const d = mat.userData.planeD.value;
      let below = 0;
      let minH = 99;
      for (let i = 0; i < pos.count; i++) {
        const h = pos.getX(i) * n.x + pos.getY(i) * n.y + pos.getZ(i) * n.z;
        if (h < minH) minH = h;
        if (h < d - 0.001) below++;
      }
      return { defl: mat.userData.defl.value, d, minH, below, squash: w.tireSquash };
    },
    look(dx, dy, dz) {
      camera.position.set(state.position.x + dx, state.position.y + dy, state.position.z + dz);
      camera.up.set(0, 1, 0);
      camera.lookAt(state.position.x, state.position.y + 0.4, state.position.z);
      renderer.render(scene, camera);
    },
    dent(local, normal) {
      const p = localToWorld(local);
      const n = normal || { x: 1, y: 0, z: 0 };
      impacts.push({ x: p.x, y: p.y, z: p.z, nx: n.x, ny: n.y, nz: n.z, speed: 6 });
      state.impactCooldown = 0;
      applyImpacts();
      updateVisuals(0.016);
      renderer.render(scene, camera);
    },
    fitRenderer,
    viewMetrics() {
      const size = new THREE.Vector2();
      renderer.getSize(size);
      return {
        cssW: canvas.clientWidth,
        cssH: canvas.clientHeight,
        styleW: parseFloat(canvas.style.width),
        styleH: parseFloat(canvas.style.height),
        rendererW: size.x,
        rendererH: size.y,
        bufW: canvas.width,
        bufH: canvas.height,
        pr: renderer.getPixelRatio(),
        aspect: camera.aspect,
        innerW: window.innerWidth,
        innerH: window.innerHeight,
        vvW: window.visualViewport ? window.visualViewport.width : null,
        vvH: window.visualViewport ? window.visualViewport.height : null,
      };
    },
    screenHeading() {
      scene.updateMatrixWorld(true);
      const fwd = rotateVec(state.quat, { x: 0, y: 0, z: 1 });
      const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      const noseRight = fwd.x * camRight.x + fwd.y * camRight.y + fwd.z * camRight.z;
      const aim = (id) => {
        const w = wheels.find((wheel) => wheel.spec.id === id);
        const a = new THREE.Vector3(0, 0, 0);
        const b = new THREE.Vector3(0, 0, 1);
        w.visual.steer.updateWorldMatrix(true, true);
        w.visual.steer.localToWorld(a);
        w.visual.steer.localToWorld(b);
        const pa = a.clone().project(camera);
        const pb = b.clone().project(camera);
        return { dx: pb.x - pa.x, steerAngle: w.steerAngle };
      };
      const rotor = document.getElementById("wheel-rotor");
      const tf = getComputedStyle(rotor).transform;
      let wheelClockwise = 0;
      const matched = tf && tf.match(/matrix\(([^)]+)\)/);
      if (matched) {
        const p = matched[1].split(",").map(Number);
        wheelClockwise = Math.atan2(p[1], p[0]);
      }
      return {
        noseRight,
        fwd: { x: fwd.x, y: fwd.y, z: fwd.z },
        camRight: { x: camRight.x, y: camRight.y, z: camRight.z },
        wheelClockwise,
        fl: aim("FL"),
        fr: aim("FR"),
        steer: state.steer,
        input: input.steer,
      };
    },
    waterDepth,
    wheelAngle: () => steerUi.angle,
    lookAtWheel(id) {
      const w = wheels.find((wheel) => wheel.spec.id === id) || wheels[0];
      const p = new THREE.Vector3();
      w.visual.steer.getWorldPosition(p);
      const side = Math.sign(w.spec.x) || 1;
      camera.position.set(p.x + side * 1.15, p.y + 0.2, p.z + 0.35);
      camera.up.set(0, 1, 0);
      camera.lookAt(p);
      renderer.render(scene, camera);
    },
    pixelRatio: () => renderer.getPixelRatio(),
    controls() {
      readInput();
      return { throttle: input.throttle, brake: input.brake, steer: input.steer, handbrake: input.handbrake };
    },
  };
  console.log("car ready");
  if (!manual) requestAnimationFrame(frame);
}

try {
  boot();
} catch (err) {
  const box = document.getElementById("err");
  box.style.display = "block";
  box.textContent = String(err && err.stack || err);
  console.error(err);
}
